[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "valeryverkhoturov-wb-api-client"
version = "1.20260926.0"
description = "Auto-generated Python client for the Wildberries Seller API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Valery Verkhoturov" }]
keywords = ["wildberries", "wb", "api", "client", "sdk"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
# Runtime deps required by every generated sub-module. Keep in sync with
# what openapi-generator's `python` template emits.
dependencies = [
  "urllib3>=2.1,<3",
  "python-dateutil>=2.8",
  "pydantic>=2",
  "typing-extensions>=4.7",
]

[project.urls]
Homepage = "https://github.com/ValeryVerkhoturov/wb-api-client"
Issues = "https://github.com/ValeryVerkhoturov/wb-api-client/issues"

[tool.setuptools.packages.find]
include = ["wb_api_client*"]
