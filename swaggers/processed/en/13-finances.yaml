  /api/v1/documents/categories:
    servers:
    - url: https://documents-api.wildberries.ru
    get:
      operationId: getV1DocumentsCategories
      x-readonly-method: true
      x-category: documents
      tags:
      - Finances
      security:
      - BearerAuth: []
      summary: Documents Categories
      description: |-
        Returns documents categories

        [Request limit](https://dev.wildberries.ru/openapi/api-information#tag/introduction/Rate-Limits) per one seller account:
        | Type | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- | --- |
        | Personal | 10 s | 1 request | 10 s | 5 requests |
        | Service | 10 s | 1 request | 10 s | 5 requests |
        | Base with secret | 10 s | 1 request | 10 s | 5 requests |
        | Base | 24 h | 1 request | 24 h | 1 request |

        Library doc: https://valeryverkhoturov.github.io/wb-api-client-docs/reference/api/finances/get-api-v1-documents-categories
      parameters:
      - $ref: '#/components/parameters/LocaleCat'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCategories'
        '401':
          $ref: '#/components/responses/401'
        '402':
          $ref: '#/components/responses/402'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
      x-tagKey: documents
      x-original-tags:
      - Documents
  /api/v1/documents/list:
    servers:
    - url: https://documents-api.wildberries.ru
    get:
      operationId: getV1DocumentsList
      x-readonly-method: true
      x-category: documents
      security:
      - BearerAuth: []
      tags:
      - Finances
      summary: Documents List
      description: |-
        Returns seller documents list

        [Request limit](https://dev.wildberries.ru/openapi/api-information#tag/introduction/Rate-Limits) per one seller account:
        | Type | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- | --- |
        | Personal | 10 s | 1 request | 10 s | 5 requests |
        | Service | 10 s | 1 request | 10 s | 5 requests |
        | Base with secret | 10 s | 1 request | 10 s | 5 requests |
        | Base | 24 h | 1 request | 24 h | 1 request |

        Library doc: https://valeryverkhoturov.github.io/wb-api-client-docs/reference/api/finances/get-api-v1-documents-list
      parameters:
      - $ref: '#/components/parameters/LocaleList'
      - in: query
        name: beginTime
        schema:
          type: string
          example: '2024-07-09'
        description: Period start. Only with `endTime`
      - in: query
        name: endTime
        schema:
          type: string
          example: '2024-07-15'
        description: Period end. Only with `beginTime`
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - date
          - category
          default: date
          example: category
        description: |
          Sorting:
            - `date` — by the document creation date
            - `category` — by category (only when `locale=ru`)

          Only with `order`
      - in: query
        name: order
        schema:
          type: string
          enum:
          - desc
          - asc
          default: desc
          example: asc
        description: |
          Data order:
            - `desc` — descending
            - `asc` — ascending

          Only with `sort`
      - in: query
        name: category
        schema:
          type: string
          example: redeem-notification
        description: '[Document category](./documents-and-accounting#tag/documents/operation/getV1DocumentsCategories) ID from the `name` field'
      - in: query
        name: serviceName
        schema:
          type: string
          example: redeem-notification-44841941
        description: Unique document ID
      - in: query
        name: limit
        schema:
          type: integer
          default: 50
          maximum: 50
          example: 10
          format: int64
        description: The maximum number of response rows
      - in: query
        name: offset
        schema:
          type: integer
          default: 0
          example: 90
          format: int64
        description: From which row to start outputting data
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetList'
        '400':
          $ref: '#/components/responses/Responses400List'
        '401':
          $ref: '#/components/responses/401'
        '402':
          $ref: '#/components/responses/402'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
      x-tagKey: documents
      x-original-tags:
      - Documents
  /api/v1/documents/download:
    servers:
    - url: https://documents-api.wildberries.ru
    get:
      operationId: getV1DocumentsDownload
      x-readonly-method: true
      x-category: documents
      security:
      - BearerAuth: []
      tags:
      - Finances
      summary: Get Document
      description: |-
        Returns one document

        [Request limit](https://dev.wildberries.ru/openapi/api-information#tag/introduction/Rate-Limits) per one seller account:
        | Type | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- | --- |
        | Personal | 10 s | 1 request | 10 s | 5 requests |
        | Service | 10 s | 1 request | 10 s | 5 requests |
        | Base with secret | 10 s | 1 request | 10 s | 5 requests |
        | Base | 24 h | 1 request | 24 h | 1 request |

        Library doc: https://valeryverkhoturov.github.io/wb-api-client-docs/reference/api/finances/get-api-v1-documents-download
      parameters:
      - in: query
        required: true
        name: serviceName
        schema:
          type: string
          example: redeem-notification-44841941
        description: Unique document ID
      - in: query
        required: true
        name: extension
        schema:
          type: string
          example: zip
        description: Document format
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDoc'
        '400':
          $ref: '#/components/responses/Responses400Download'
        '401':
          $ref: '#/components/responses/401'
        '402':
          $ref: '#/components/responses/402'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
      x-tagKey: documents
      x-original-tags:
      - Documents
  /api/v1/documents/download/all:
    servers:
    - url: https://documents-api.wildberries.ru
    post:
      operationId: postV1DocumentsDownloadAll
      x-readonly-method: true
      x-category: documents
      security:
      - BearerAuth: []
      tags:
      - Finances
      summary: Get Documents
      description: |-
        Returns more than one document.

        [Request limit](https://dev.wildberries.ru/openapi/api-information#tag/introduction/Rate-Limits) per one seller account:
        | Type | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- | --- |
        | Personal | 5 min | 1 request | 5 min | 5 requests |
        | Service | 5 min | 1 request | 5 min | 5 requests |
        | Base with secret | 5 min | 1 request | 5 min | 5 requests |
        | Base | 24 h | 1 request | 24 h | 1 request |

        Library doc: https://valeryverkhoturov.github.io/wb-api-client-docs/reference/api/finances/post-api-v1-documents-download-all
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requestDownload'
            example:
              params:
              - extension: zip
                serviceName: redeem-notification-44841941
              - extension: xlsx
                serviceName: act-income-mp-392460936
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDocs'
        '400':
          $ref: '#/components/responses/Responses400DownloadAll'
        '401':
          $ref: '#/components/responses/401'
        '402':
          $ref: '#/components/responses/402'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
      x-tagKey: documents
      x-original-tags:
      - Documents
components:
  parameters:
    LocaleCat:
      name: locale
      in: query
      schema:
        type: string
        example: ru
        default: en
      description: |
        `title` field language:
          - `ru` — Russian
          - `en` — English
          - `zh` — Chinese
    LocaleList:
      name: locale
      in: query
      schema:
        type: string
        example: ru
        default: en
      description: |
        `category` field language:
          - `ru` — Russian
          - `en` — English
          - `zh` — Chinese
  schemas:
    requestDownload:
      type: object
      properties:
        params:
          type: array
          maxItems: 50
          minItems: 1
          items:
            type: object
            properties:
              extension:
                type: string
                description: Document format
              serviceName:
                type: string
                description: Unique document ID
    GetCategories:
      properties:
        data:
          type: object
          properties:
            categories:
              description: Documents categories
              type: array
              items:
                type: object
                properties:
                  name:
