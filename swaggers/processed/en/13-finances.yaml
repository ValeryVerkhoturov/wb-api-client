openapi: 3.0.1
info:
  version: finances
  title: Documents and Accounting
  description: |-
    View seller [balance](https://dev.wildberries.ru/openapi/documents-and-accounting#tag/balance), [financial reports](https://dev.wildberries.ru/openapi/documents-and-accounting#tag/financialReports), and [documents](https://dev.wildberries.ru/openapi/documents-and-accounting#tag/documents).
  x-file-name: finances
security:
- BearerAuth: []
tags:
- name: Balance
  x-displayName: Balance
  description: ''
  x-tagKey: balance
- name: Financial Reports
  x-displayName: Financial Reports
  description: ''
  x-tagKey: financialReports
- name: Documents
  x-displayName: Documents
  description: ''
  x-tagKey: documents
paths:
  /api/v1/account/balance:
    servers:
    - url: https://finance-api.wildberries.ru
    get:
      operationId: getV1AccountBalance
      x-readonly-method: true
      x-category: finance
      security:
      - BearerAuth: []
      summary: Get Seller Balance
      description: |-
        Balance widget data on [the main page](https://seller.wildberries.ru) of the sellers portal.

        [Request limit](https://dev.wildberries.ru/openapi/api-information#tag/introduction/Rate-Limits) per one seller account:
        | Type | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- | --- |
        | Personal | 1 min | 1 request | 1 min | 1 request |
        | Service | 1 min | 1 request | 1 min | 1 request |
        | Base with secret | 1 min | 1 request | 1 min | 1 request |
        | Base | 24 h | 1 request | 24 h | 1 request |

        Library doc: https://valeryverkhoturov.github.io/wb-api-client-docs/reference/api/finances/get-api-v1-account-balance
      tags:
      - Finances
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetV1AccountBalanceResponse200'
        '401':
          $ref: '#/components/responses/401'
        '402':
          $ref: '#/components/responses/402'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
      x-tagKey: balance
      x-original-tags:
      - Balance
  /api/finance/v1/sales-reports/list:
    servers:
    - url: https://finance-api.wildberries.ru
    post:
      x-readonly-method: true
      x-category: finance
      x-token-types:
      - personal
      - service
      security:
      - BearerAuth: []
      tags:
      - Finances
      summary: Sales Reports List
      operationId: postV1SalesReportsList
      description: |-
        Method is [available](https://dev.wildberries.ru/openapi/api-information#tag/authorization/Rules-for-using-API-access-tokens) by
        **Personal** token,
        **Service** token

        The method returns sales reports list in the [report table](https://seller.wildberries.ru/suppliers-mutual-settlements) format.

        The list contains data since January 29, 2024.

        [Request limit](https://dev.wildberries.ru/openapi/api-information#tag/introduction/Rate-Limits) per one seller account:
        | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- |
        | 1 min | 1 request | 1 min | 1 request |

        Library doc: https://valeryverkhoturov.github.io/wb-api-client-docs/reference/api/finances/post-api-finance-v1-sales-reports-list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesReportListReq'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostV1SalesReportsListResponse200'
        '204':
          description: No data
        '400':
          $ref: '#/components/responses/response400SalesReports'
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: Access denied
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Response4XX'
              examples:
                Response403TokenCategory:
                  $ref: '#/components/examples/Response403TokenCategory'
                Response403TokenType:
                  $ref: '#/components/examples/Response403TokenType'
        '429':
          $ref: '#/components/responses/429'
      x-tagKey: financialReports
      x-original-tags:
      - Financial Reports
  /api/finance/v1/sales-reports/detailed/{reportId}:
    servers:
    - url: https://finance-api.wildberries.ru
    post:
      x-readonly-method: true
      x-category: finance
      x-token-types:
      - personal
      - service
      security:
      - BearerAuth: []
      tags:
      - Finances
      summary: Details for the Sales Reports by Report ID
      operationId: postV1SalesReportsDetailedReportId
      description: |-
        Method is [available](https://dev.wildberries.ru/openapi/api-information#tag/authorization/Rules-for-using-API-access-tokens) by
        **Personal** token,
        **Service** token

        The method returns details for the [sales reports](https://seller.wildberries.ru/suppliers-mutual-settlements) by report IDs.

        The data is available since January 29, 2024.

        [Request limit](https://dev.wildberries.ru/openapi/api-information#tag/introduction/Rate-Limits) per one seller account:
        | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- |
        | 1 min | 1 request | 1 min | 1 request |

        Library doc: https://valeryverkhoturov.github.io/wb-api-client-docs/reference/api/finances/post-api-finance-v1-sales-reports-detailed-reportid
      parameters:
      - name: reportId
        in: path
        description: "Report ID.\nFor daily reports, we recommend using non-standard libraries with [BigInt](https://www.npmjs.com/package/json-bigint) support, instead of standard deserialization"
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancialReportsDetailedReportIdReq'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostV1SalesReportsDetailedReportIdResponse200'
        '204':
          description: No data
        '400':
          $ref: '#/components/responses/response400SalesReports'
        '401':
          $ref: '#/components/responses/401'
        '402':
          $ref: '#/components/responses/402'
        '403':
          description: Access denied
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Response4XX'
              examples:
                Response403TokenCategory:
                  $ref: '#/components/examples/Response403TokenCategory'
                Response403TokenType:
                  $ref: '#/components/examples/Response403TokenType'
        '404':
          $ref: '#/components/responses/response404SalesReports'
        '429':
          $ref: '#/components/responses/429'
      x-tagKey: financialReports
      x-original-tags:
      - Financial Reports
  /api/finance/v1/sales-reports/detailed:
    servers:
    - url: https://finance-api.wildberries.ru
    post:
      x-readonly-method: true
      x-category: finance
      security:
      - BearerAuth: []
      tags:
      - Finances
      summary: Details for the Sales Reports by Period
      operationId: postV1SalesReportsDetailed
      description: |-
        The method returns details for the [sales reports](https://seller.wildberries.ru/suppliers-mutual-settlements) by specified period.

        The data is available since January 29, 2024.

        You can save the report in [Google Sheets](https://dev.wildberries.ru/en/knowledge-base/articles/019d49a4-650c-7b04-9596-ba441936f9d3)

        [Request limit](https://dev.wildberries.ru/openapi/api-information#tag/introduction/Rate-Limits) per one seller account:
        | Type | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- | --- |
        | Personal | 1 min | 1 request | 1 min | 1 request |
        | Service | 1 min | 1 request | 1 min | 1 request |
        | Base with secret | 1 min | 1 request | 1 min | 1 request |
        | Base | 24 h | 2 requests | 12 h | 1 request |

        Library doc: https://valeryverkhoturov.github.io/wb-api-client-docs/reference/api/finances/post-api-finance-v1-sales-reports-detailed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesReportsDetailedReq'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostV1SalesReportsDetailedResponse200'
        '204':
          description: No data
        '400':
          $ref: '#/components/responses/response400SalesReports'
        '401':
          $ref: '#/components/responses/401'
        '402':
          $ref: '#/components/responses/402'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
      x-tagKey: financialReports
      x-original-tags:
      - Financial Reports
