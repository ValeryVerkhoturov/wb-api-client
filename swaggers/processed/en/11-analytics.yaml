openapi: 3.0.1
info:
  title: Analytics and Data
  version: analytics
  description: |-
    Data on seller analytics.
  x-file-name: analytics
security:
- BearerAuth: []
tags:
- name: Sales Funnel
  x-displayName: Sales Funnel
  description: ''
  x-tagKey: salesFunnel
  x-description: |
    <div class="description_auth">
      To access the methods, use a <a href="./api-information#tag/authorization/How-to-create-a-personal-access-base-or-test-token">token</a> for the <strong>Analytics</strong> category
    </div>


    <div class="description_ref">
      You can learn how to use methods in business cases in the <a href="/en/knowledge-base/articles/019d49a3-fb9a-7c0c-9372-17d880f74ff9/sales-funnel">instructions</a> on working with <strong>Sales Funnel</strong>
    </div>


    Methods for getting [statistics](https://seller.wildberries.ru/content-analytics/interactive-report/main) for:
      1. [Listings per period](./analytics#tag/salesFunnel/operation/postV3SalesFunnelProducts)
      2. [Listings per days](./analytics#tag/salesFunnel/operation/postV3SalesFunnelProductsHistory)
      3. [Grouped listings per days](./analytics#tag/salesFunnel/operation/postV3SalesFunnelGroupedHistory)

    <div class="description_important">
      Timezones are presented in IANA format, the current list can be viewed <a href="https://nodatime.org/TimeZones">here</a>
    </div>
- name: Order Feed
  x-displayName: Order Feed
  description: ''
  x-tagKey: orderFeed
  x-description: |
    <div class="description_auth">
      To access the method, use a <a href="./api-information#tag/authorization/How-to-create-a-personal-access-base-or-test-token">token</a> for the <strong>Analytics</strong> category
    </div>

    [Method](./analytics#tag/orderFeed/operation/postV1OrderFeed) for getting the [Order Feed](https://seller.wildberries.ru/content-analytics/order-feed) report
- name: Search Queries for Your Items
  x-displayName: Search Queries for Your Items
  description: ''
  x-tagKey: searchQueriesForYourItems
  x-description: |
    <div class="description_auth">
      To access the methods, use a <a href="./api-information#tag/authorization/How-to-create-a-personal-access-base-or-test-token">token</a> for the <strong>Analytics</strong> category
    </div>


    <div class="description_ref">
      You can learn how to use methods in business cases in the <a href="/en/knowledge-base/articles/019d49a4-0f6a-70bb-a87b-c1237a1a0714/search-queries-for-your-items">instructions</a> on working with <strong>Search Queries for Your Items</strong>
    </div>


    These methods can be used to get a [report on search queries for your items](https://seller.wildberries.ru/search-analytics/my-search-queries).

    <div class="description_important">
      You can use these methods only with <a href='https://seller.wildberries.ru/monetization/jam'>Jam</a> subscription
    </div>
- name: Stocks Report
  x-displayName: Stocks Report
  description: ''
  x-tagKey: stocksReport
  x-description: |+
    <div class="description_auth">
      To access the methods, use a <a href="./api-information#tag/authorization/How-to-create-a-personal-access-base-or-test-token">token</a> for the <strong>Analytics</strong> category
    </div>

    These methods can be used to get a [report on inventory metrics](https://seller.wildberries.ru/content-analytics/history-remains).<br></br>
    This is information from the detailed item table and the region and warehouse detail widget.<br></br> Inventory in responses of these methods is displayed for the current day.


    <div class="description_important">
      To get daily inventory for the period up to 3 months from the current date, use the <a href='./analytics#tag/sellerAnalyticsCsv'>Seller Analytics CSV</a> methods — the <code>STOCK_HISTORY_DAILY_CSV</code> report type
    </div>

- name: Item Rating
  x-displayName: Item Rating
  description: ''
  x-tagKey: itemRating
  x-description: |
    <div class="description_auth">
      To access the method, use a <a href="./api-information#tag/authorization/How-to-create-a-personal-access-base-or-test-token">token</a> for the <strong>Analytics</strong> category
    </div>

    [Method](./analytics#tag/itemRating/operation/postV2ItemRating) for getting the [Item Rating](https://seller.wildberries.ru/content-ratings) report
- name: Seller Analytics CSV
  x-displayName: Seller Analytics CSV
  description: ''
  x-tagKey: sellerAnalyticsCsv
  x-description: |
    <div class="description_auth">
      To access the methods, use a <a href="./api-information#tag/authorization/How-to-create-a-personal-access-base-or-test-token">token</a> for the <strong>Analytics</strong> category
    </div>


    <div class="description_ref">
      You can learn how to use methods in business cases in the <a href="/en/knowledge-base/articles/019d49a3-f76b-7f22-82f3-54930b8f59e8/seller-analytics-csv">instructions</a> on working with <strong>Seller Analytics CSV</strong>
    </div>


    To get a report:
      1. Generate it using the method [Create the report](./analytics#tag/sellerAnalyticsCsv/operation/postV2NmReportDownloads).
      2. Wait until the report is ready. You can check the status with the method [Get the reports list](./analytics#tag/sellerAnalyticsCsv/operation/getV2NmReportDownloads). The report is stored for 48 hours after it is ready, and it cannot be retrieved after.<br>
      If you receive a status of FAILED, [regenerate the report](./analytics#tag/sellerAnalyticsCsv/operation/postV2NmReportDownloadsRetry).
      3. [Download the report](./analytics#tag/sellerAnalyticsCsv/operation/getV2NmReportDownloadsFileDownloadId).

    You can get a report for a maximum of one year. Inventory reports can be gotten for a maximum of 3 months

    The maximum number of reports that can be generated per day is 20

    <div class="description_important">
      You can use these methods — except for inventory reports — only with <a href='https://seller.wildberries.ru/monetization/jam'>Jam</a> subscription
    </div>
paths:
  /api/analytics/v3/sales-funnel/products:
    servers:
    - url: https://seller-analytics-api.wildberries.ru
    post:
      x-readonly-method: true
      x-category: contentanalytics
      tags:
      - Analytics
      summary: Listings Statistics per Period
      operationId: postV3SalesFunnelProducts
      description: |-
        The method generates a report on items by comparing key metrics for the current period with a similar past one.

        The report data is updated once every 2 hours.

        Most of the data appears within an hour of the event:
        - orders
        - click-throughs
        - adds-to-Cart
        A small part of this data may appear within a few days.

        Purchases, cancellations, and returns are displayed in report for the day an item was ordered. For example, if an order was placed on January 1, and the customer returned the item on January 10, data about this return will appear in the report for January 1.
        You can track the final sales results using [details for the realization reports](https://dev.wildberries.ru/openapi/documents-and-accounting#tag/financialReports).

        The `brandNames`, `subjectIds`, `tagIds`, and `nmIds` parameters can be empty `[]`, in which case the response will return all of the seller listings.

        If you specify multiple parameters, the response will include listings that match all of these parameters simultaneously. If no listings match the request parameters, an empty response `[]` will be returned.

        You can get a report for a maximum of the last 365 days.

        In the previous period's data:
        \* The data in `pastPeriod` covers the same duration as in `selectedPeriod`
        \* If the `pastPeriod` start date is more than a year before the current date, it will be adjusted to: `pastPeriod.start = current date - 365 days`
        Pagination can be used.

        [Request limit](https://dev.wildberries.ru/openapi/api-information#tag/introduction/Rate-Limits) per one seller account:
        | Type | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- | --- |
        | Personal | 1 min | 3 requests | 20 s | 3 requests |
        | Service | 1 min | 3 requests | 20 s | 3 requests |
        | Base with secret | 1 min | 3 requests | 20 s | 3 requests |
        | Base | 1 h | 2 requests | 30 min | 1 request |

        Library doc: https://valeryverkhoturov.github.io/wb-api-client-docs/reference/api/analytics/post-api-analytics-v3-sales-funnel-products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemsRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostV3SalesFunnelProductsResponse200'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/401'
        '402':
          $ref: '#/components/responses/402'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
              examples:
                AccessDenied:
                  $ref: '#/components/examples/AuthorizationErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Response4XX'
              examples:
                Response403TokenCategory:
                  $ref: '#/components/examples/Response403TokenCategory'
        '429':
          $ref: '#/components/responses/429'
      x-tagKey: salesFunnel
      x-original-tags:
      - Sales Funnel
  /api/analytics/v3/sales-funnel/products/history:
    servers:
    - url: https://seller-analytics-api.wildberries.ru
    post:
      x-readonly-method: true
      x-category: contentanalytics
      tags:
      - Analytics
      summary: Listings Statistics per Days
      operationId: postV3SalesFunnelProductsHistory
      description: |-
        The method returns statistics for listings by day or by week.
        You can get data for a maximum of the last week.

        The report data is updated once every 2 hours.

        Most of the data appears within an hour of the event:
        - orders
        - click-throughs
        - adds-to-Cart
        A small part of this data may appear within a few days.

        Purchases, cancellations, and returns are displayed in report for the day an item was ordered. For example, if an order was placed on January 1, and the customer returned the item on January 10, data about this return will appear in the report for January 1.
        You can track the final sales results using [details for the realization reports](https://dev.wildberries.ru/openapi/documents-and-accounting#tag/financialReports).

        To get reports for a period of up to a year, use the [Seller Analytics CSV](https://dev.wildberries.ru/openapi/analytics#tag/sellerAnalyticsCsv) methods — the `DETAIL_HISTORY_REPORT` type. Reports of this type are available only with [Jam](https://seller.wildberries.ru/monetization/jam) subscription

        [Request limit](https://dev.wildberries.ru/openapi/api-information#tag/introduction/Rate-Limits) per one seller account:
        | Type | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- | --- |
        | Personal | 1 min | 3 requests | 20 s | 3 requests |
        | Service | 1 min | 3 requests | 20 s | 3 requests |
        | Base with secret | 1 min | 3 requests | 20 s | 3 requests |
        | Base | 1 h | 2 requests | 30 min | 1 request |

        Library doc: https://valeryverkhoturov.github.io/wb-api-client-docs/reference/api/analytics/post-api-analytics-v3-sales-funnel-products-history
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemHistoryRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostV3SalesFunnelProductsHistoryResponse200'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/401'
        '402':
          $ref: '#/components/responses/402'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
              examples:
                AccessDenied:
                  $ref: '#/components/examples/AuthorizationErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Response4XX'
              examples:
                Response403TokenCategory:
                  $ref: '#/components/examples/Response403TokenCategory'
        '429':
          $ref: '#/components/responses/429'
      x-tagKey: salesFunnel
      x-original-tags:
      - Sales Funnel
  /api/analytics/v3/sales-funnel/grouped/history:
    servers:
    - url: https://seller-analytics-api.wildberries.ru
    post:
      x-readonly-method: true
      x-category: contentanalytics
      tags:
      - Analytics
      summary: Grouped Listings Statistics per Days
      operationId: postV3SalesFunnelGroupedHistory
      description: |-
        The method returns statistics for listings by day or by week.
        Listings are grouped by subcategories, brands and labels.
        You can get data for a maximum of the last week.

        The report data is updated once every 2 hours.

        Most of the data appears within an hour of the event:
        - orders
        - click-throughs
        - adds-to-Cart
        A small part of this data may appear within a few days.

        Purchases, cancellations, and returns are displayed in report for the day an item was ordered. For example, if an order was placed on January 1, and the customer returned the item on January 10, data about this return will appear in the report for January 1.
        You can track the final sales results using [details for the realization reports](https://dev.wildberries.ru/openapi/documents-and-accounting#tag/financialReports).

        The `brandNames`, `subjectIDs`, `tagIds`, and `nmIds` parameters can be empty `[]`, in which case the response will return all of the seller listings.

        The item of the number of subcategories, brands, and labels in the request cannot be more than 16. For example, 4 brands and 4 subcategories or 2 subcategories, 2 labels, and 4 brands.

        To get reports for a period of up to a year, use the [Seller Analytics CSV](https://dev.wildberries.ru/openapi/analytics#tag/sellerAnalyticsCsv) methods — the `GROUPED_HISTORY_REPORT` type. Reports of this type are available only with [Jam](https://seller.wildberries.ru/monetization/jam) subscription

        [Request limit](https://dev.wildberries.ru/openapi/api-information#tag/introduction/Rate-Limits) per one seller account:
        | Type | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- | --- |
        | Personal | 1 min | 3 requests | 20 s | 3 requests |
        | Service | 1 min | 3 requests | 20 s | 3 requests |
        | Base with secret | 1 min | 3 requests | 20 s | 3 requests |
        | Base | 1 h | 2 requests | 30 min | 1 request |

        Library doc: https://valeryverkhoturov.github.io/wb-api-client-docs/reference/api/analytics/post-api-analytics-v3-sales-funnel-grouped-history
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupedHistoryRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostV3SalesFunnelGroupedHistoryResponse200'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/401'
        '402':
          $ref: '#/components/responses/402'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
              examples:
                AccessDenied:
                  $ref: '#/components/examples/AuthorizationErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Response4XX'
              examples:
                Response403TokenCategory:
                  $ref: '#/components/examples/Response403TokenCategory'
        '429':
          $ref: '#/components/responses/429'
      x-tagKey: salesFunnel
      x-original-tags:
      - Sales Funnel
  /api/v2/nm-report/downloads:
    servers:
    - url: https://seller-analytics-api.wildberries.ru
    post:
      operationId: postV2NmReportDownloads
      x-readonly-method: true
      x-category: contentanalytics
      tags:
      - Analytics
      security:
      - BearerAuth: []
      summary: Create the Report
      description: |-
        The method creates a task for generating a report with advanced seller analytics.

        You can create a CSV-version of [sales funnel](https://dev.wildberries.ru/openapi/analytics#tag/salesFunnel) or [search parameters](https://dev.wildberries.ru/openapi/analytics#tag/searchQueriesForYourItems) report with grouping:
        \* by WB item numbers
        \* by categories, brands, and labels
        In each of reports on sales funnel, you can group data by days, weeks, or months.

        Also you can create a CSV-version of [search texts](https://dev.wildberries.ru/openapi/analytics#tag/searchQueriesForYourItems/operation/postV2SearchReportProductSearchTexts) or [inventory](https://dev.wildberries.ru/openapi/analytics#tag/stocksReport) report.

        Each new report must have a unique ID.

        Do not use the same ID for different reports — this may cause errors during generation

        The set of parameters in the `params` object depends on the report type. To get a description of the parameters, select the report type from the dropdown list in the description of the `reportType` parameter.

        The parameters `includeSubstitutedSKUs` and `includeSearchTexts` cannot both be set to `false`

        If it was not possible to [get report](https://dev.wildberries.ru/openapi/analytics#tag/sellerAnalyticsCsv/operation/getV2NmReportDownloadsFileDownloadId), you can create a [repeat generation task](https://dev.wildberries.ru/openapi/analytics#tag/sellerAnalyticsCsv/operation/postV2NmReportDownloadsRetry). You can also [get a list and check the statuses](https://dev.wildberries.ru/openapi/analytics#tag/sellerAnalyticsCsv/operation/getV2NmReportDownloads) of reports.

        The report data is updated once every 2 hours.

        [Inventory reports](https://seller.wildberries.ru/content-analytics/history-remains) — the `STOCK_HISTORY_REPORT_CSV` and `STOCK_HISTORY_DAILY_CSV` types — can be created without [Jam](https://seller.wildberries.ru/monetization/jam) subscription

        [Request limit](https://dev.wildberries.ru/openapi/api-information#tag/introduction/Rate-Limits) per one seller account:
        | Type | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- | --- |
        | Personal | 1 min | 3 requests | 20 s | 3 requests |
        | Service | 1 min | 3 requests | 20 s | 3 requests |
        | Base with secret | 1 min | 3 requests | 20 s | 3 requests |
        | Base | 1 h | 1 request | 1 h | 1 request |

        Library doc: https://valeryverkhoturov.github.io/wb-api-client-docs/reference/api/analytics/post-api-v2-nm-report-downloads
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/SalesFunnelItemReq'
              - $ref: '#/components/schemas/SalesFunnelGroupReq'
              - $ref: '#/components/schemas/SearchReportGroupReq'
              - $ref: '#/components/schemas/SearchReportItemReq'
              - $ref: '#/components/schemas/SearchReportTextReq'
              - $ref: '#/components/schemas/InventoryMetricsReportReq'
              - $ref: '#/components/schemas/InventoryHistoryReportReq'
              discriminator:
                propertyName: reportType
                mapping:
                  DETAIL_HISTORY_REPORT: '#/components/schemas/SalesFunnelItemReq'
                  GROUPED_HISTORY_REPORT: '#/components/schemas/SalesFunnelGroupReq'
                  SEARCH_QUERIES_PREMIUM_REPORT_GROUP: '#/components/schemas/SearchReportGroupReq'
                  SEARCH_QUERIES_PREMIUM_REPORT_PRODUCT: '#/components/schemas/SearchReportItemReq'
                  SEARCH_QUERIES_PREMIUM_REPORT_TEXT: '#/components/schemas/SearchReportTextReq'
                  STOCK_HISTORY_REPORT_CSV: '#/components/schemas/InventoryMetricsReportReq'
                  STOCK_HISTORY_DAILY_CSV: '#/components/schemas/InventoryHistoryReportReq'
            examples:
              SalesFunnelItemReq:
                description: Sales funnel report. By WB item numbers
                value:
                  id: 06eae887-9d9f-491f-b16a-bb1766fcb8d2
                  reportType: DETAIL_HISTORY_REPORT
                  userReportName: Listing report
                  params:
                    nmIDs:
                    - 1234567
                    subjectIds:
                    - 1234567
                    brandNames:
                    - Name
                    tagIds:
                    - 1234567
                    startDate: '2024-06-21'
                    endDate: '2024-06-23'
                    timezone: Europe/Moscow
                    aggregationLevel: day
                    skipDeletedNm: false
              SalesFunnelGroupReq:
                description: Sales funnel report. By categories, brands and labels
                value:
                  id: 06eea887-9d9f-491f-b16a-bb1766fcb8d2
                  reportType: GROUPED_HISTORY_REPORT
                  userReportName: Subcategory report
                  params:
                    subjectIds:
                    - 1234567
                    brandNames:
                    - Name
                    tagIds:
                    - 1234567
                    startDate: '2024-06-21'
                    endDate: '2024-06-23'
                    timezone: Europe/Moscow
                    aggregationLevel: day
                    skipDeletedNm: false
              SearchReportGroupReq:
                description: Search parameters report. By categories, brands, and labels
                value:
                  id: 06eae887-9d9f-491f-b16a-bb1766fcb8d2
                  reportType: SEARCH_QUERIES_PREMIUM_REPORT_GROUP
                  userReportName: Subcategory report
                  params:
                    currentPeriod:
                      start: '2024-02-10'
                      end: '2024-02-10'
                    pastPeriod:
                      start: '2024-02-08'
                      end: '2024-02-08'
                    nmIds:
                    - 162579635
                    - 166699779
                    subjectIds:
                    - 64
                    - 334
                    brandNames:
                    - nikkle
                    - abikas
                    tagIds:
                    - 32
                    - 53
                    orderBy:
                      field: avgPosition
                      mode: asc
                    positionCluster: all
                    includeSubstitutedSKUs: true
                    includeSearchTexts: false
              SearchReportItemReq:
                description: Search parameters report. By WB item numbers
                value:
                  id: 06eea887-9d9f-491f-b16a-bb1766fcb8d2
                  reportType: SEARCH_QUERIES_PREMIUM_REPORT_PRODUCT
                  userReportName: Listing report
                  params:
                    currentPeriod:
                      start: '2024-02-10'
                      end: '2024-02-10'
                    pastPeriod:
                      start: '2024-02-08'
                      end: '2024-02-08'
                    subjectId: 123
                    brandName: Abble
                    tagId: 45
                    nmIds:
                    - 162579635
                    - 166699779
                    orderBy:
                      field: buyoutCount
                      mode: asc
                    positionCluster: all
                    includeSubstitutedSKUs: false
                    includeSearchTexts: true
              SearchReportTextReq:
                description: Search texts report
                value:
                  id: 06eae887-9d9f-491f-b16a-bb1766fcb8d2
                  reportType: SEARCH_QUERIES_PREMIUM_REPORT_TEXT
                  userReportName: Subcategory report
                  params:
                    currentPeriod:
                      start: '2024-02-10'
                      end: '2024-02-10'
                    pastPeriod:
                      start: '2024-02-08'
                      end: '2024-02-08'
                    nmIds:
                    - 162579635
                    - 166699779
                    subjectIds:
                    - 64
                    - 334
                    brandNames:
                    - nikkle
                    - abikas
                    tagIds:
                    - 32
                    - 53
                    topOrderBy: openCard
                    orderBy:
                      field: avgPosition
                      mode: asc
                    includeSubstitutedSKUs: true
                    includeSearchTexts: true
                    limit: 50
              InventoryMetricsReportReq:
                description: Inventory metrics report
                value:
                  id: 06eae887-9d9f-491f-b16a-bb1766fcb8d2
                  reportType: STOCK_HISTORY_REPORT_CSV
                  userReportName: Inventory report
                  params:
                    nmIDs:
                    - 111222333
                    - 444555666
                    subjectIDs:
                    - 123
                    - 456
                    brandNames:
                    - ЭгКа
                    - Stock
                    tagIDs:
                    - 3
                    - 4
                    - 5
                    currentPeriod:
                      start: '2024-02-10'
                      end: '2024-02-10'
                    stockType: mp
                    skipDeletedNm: true
                    availabilityFilters:
                    - deficient
                    - balanced
                    orderBy:
                      field: avgOrders
                      mode: asc
              InventoryHistoryReportReq:
                description: Inventory history report
                value:
                  id: 06eae887-9d9f-491f-b16a-bb1766fcb8d2
                  reportType: STOCK_HISTORY_DAILY_CSV
                  userReportName: Inventory report
                  params:
                    nmIds:
                    - 111222333
                    - 444555666
                    subjectIds:
                    - 123
                    - 456
                    brandNames:
                    - ЭгКа
                    - Stock
                    tagIds:
                    - 3
                    - 4
                    - 5
                    currentPeriod:
                      start: '2025-12-13'
                      end: '2025-12-15'
                    stockType: ''
                    skipDeletedNm: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NmReportCreateReportResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostV2NmReportDownloadsResponse400'
              examples:
                errorExample:
                  value:
                    title: Invalid request body
                    detail: userReportName can not contain emojis
                    requestId: 51b7828b-e298-4dfa-b7cd-45ab179921d3
                    origin: analytics-open-api
        '401':
          $ref: '#/components/responses/401'
        '402':
          $ref: '#/components/responses/402'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
              examples:
                AccessDenied:
                  $ref: '#/components/examples/AuthorizationErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Response4XX'
              examples:
