          example: '2024-02-10'
    StockType:
      type: string
      description: |
        Type of items storage warehouse:
          - `""` — all
          - `wb` — WB warehouses
          - `mp` — seller warehouses
      example: mp
      enum:
      - ''
      - wb
      - mp
    TableOrderBy:
      type: object
      description: Sorting parameters
      properties:
        field:
          $ref: '#/components/schemas/TableGroupField'
        mode:
          $ref: '#/components/schemas/OrderByMode'
      required:
      - field
      - mode
    TableGroupField:
      type: string
      description: |
        Sorting by field:
          - `ordersCount` — Items ordered
          - `ordersSum` — Total order value
          - `avgOrders` — Average daily orders
          - `buyoutCount` — Items purchased
          - `buyoutSum` — Total purchase value
          - `buyoutPercent` — Purchase rate
          - `stockCount` — Current inventory
          - `stockSum` — Current inventory value
          - `saleRate` — Current DSI
          - `avgStockTurnover` — Average DSI
          - `toClientCount` — On the way to user
          - `fromClientCount` — On the way from user
          - `minPrice` — Minimal seller price with seller discount (excluding WB Club discount)
          - `maxPrice` — Maximal seller price with seller discount (excluding WB Club discount)
          - `officeMissingTime` — Out-of-stock time
          - `lostOrdersCount` — Lost orders
          - `lostOrdersSum` — Lost order value
          - `lostBuyoutsCount` — Lost sales
          - `lostBuyoutsSum` — Lost sales value
      enum:
      - ordersCount
      - ordersSum
      - avgOrders
      - buyoutCount
      - buyoutSum
      - buyoutPercent
      - stockCount
      - stockSum
      - saleRate
      - avgStockTurnover
      - toClientCount
      - fromClientCount
      - minPrice
      - maxPrice
      - officeMissingTime
      - lostOrdersCount
      - lostOrdersSum
      - lostBuyoutsCount
      - lostBuyoutsSum
      example: avgOrders
    OrderByMode:
      type: string
      description: |
        Sorting order:
          - `asc` — ascending
          - `desc` — descending
      enum:
      - asc
      - desc
      example: asc
    TableGroupResponseSt:
      type: object
      properties:
        groups:
          type: array
          description: Set of data by groups
          items:
            $ref: '#/components/schemas/TableGroupItemSt'
        currency:
          $ref: '#/components/schemas/Currency'
    TableGroupItemSt:
      type: object
      description: Group data
      properties:
