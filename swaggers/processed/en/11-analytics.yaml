          format: int32
          description: Subcategory ID
          example: 123456789
        subjectName:
          type: string
          description: Subcategory name
          example: Кружка
        brandName:
          type: string
          description: Brand
          example: Крутая посуда
        tagID:
          type: integer
          format: int64
          description: Label ID
          example: 12345
        tagName:
          type: string
          description: Label name
          example: Человек-Паук
        metrics:
          description: Group metrics
          allOf:
          - $ref: '#/components/schemas/TableCommonMetrics'
        items:
          type: array
          description: Group items
          items:
            $ref: '#/components/schemas/TableItemSt'
    TableCommonMetrics:
      type: object
      description: Metrics
      properties:
        ordersCount:
          type: integer
          format: int64
          description: Items ordered
          example: 100
        ordersSum:
          type: integer
          format: int64
          description: Total order value
          example: 100000
        avgOrders:
          type: number
          format: float64
          description: Average daily orders
          example: 200
        avgOrdersByMonth:
          type: array
          description: Average monthly orders
          items:
            $ref: '#/components/schemas/FloatGraphByPeriodItem'
        buyoutCount:
          type: integer
          format: int64
          description: Items purchased
          example: 150
        buyoutSum:
          type: integer
          format: int64
          description: Total purchase value
          example: 150000
        buyoutPercent:
          type: integer
          format: int64
          description: Purchase rate
          example: 5
        stockCount:
          type: integer
          format: int64
          description: Current inventory
          example: 50
        stockSum:
          type: integer
          format: int64
          description: Current inventory value
          example: 50000
        saleRate:
          description: |
            Current DSI. Special cases:
              1) `"hours":-1` — infinite duration
              2) `"hours":-2` — zero duration
              3) `"hours":-3` — uncalculated duration
          type: object
          properties:
            days:
              type: integer
              format: int32
              example: 5
              description: Number of days
            hours:
              type: integer
              format: int32
              example: 15
              description: Number of hours
        avgStockTurnover:
          description: |
            Average DSI. Special cases:
              1) `"hours":-1` — infinite duration
              2) `"hours":-2` — zero duration
              3) `"hours":-3` — uncalculated duration
          type: object
          properties:
            days:
              type: integer
              format: int32
              example: 5
              description: Number of days
            hours:
              type: integer
              format: int32
              example: 15
              description: Number of hours
        toClientCount:
          type: integer
          format: int64
          description: On the way to user
          example: 20
        fromClientCount:
          type: integer
          format: int64
          description: On the way from user
          example: 30
        officeMissingTime:
          description: |
            Out-of-stock time. Special cases:
              1) `"hours":-1` — infinite duration
              2) `"hours":-2` — zero duration
              3) `"hours":-3` — uncalculated duration
              4) `"hours":-4` — absence during the entire period
          type: object
          properties:
            days:
              type: integer
              format: int32
              example: 5
              description: Number of days
            hours:
              type: integer
              format: int32
              example: 15
              description: Number of hours
        lostOrdersCount:
          type: number
          format: float64
          description: |
            Lost orders. Special cases:
              1. Value less than `0` and is not `-2` — the value is not calculated
              2. Value is `-2` — zero value
          example: 1550.52
        lostOrdersSum:
          type: number
          format: float64
          description: |
            Lost order value. Special cases:
              1. Value less than `0` and is not `-2` — the value is not calculated
              2. Value is `-2` — zero value
          example: 155000.25
        lostBuyoutsCount:
          type: number
          format: float64
          description: |
            Lost sales. Special cases:
              1. Value less than `0` and is not `-2` — the value is not calculated
              2. Value is `-2` — zero value
          example: 123.55
        lostBuyoutsSum:
          type: number
          format: float64
          description: |
            Lost sales value. Special cases:
              1. Value less than `0` and is not `-2` — the value is not calculated
              2. Value is `-2` — zero value
          example: 225555.15
