      summary: Add Customs Declaration Numbers to the Orders
      operationId: postV3ClickCollectOrdersMetaCustomsDeclaration
      description: |-
        Sets the customs declaration numbers and numeric codes of the countries for the assembly orders [label identifiers](https://dev.wildberries.ru/openapi/in-store-pickup#tag/inStorePickupLabelIdentifiers/operation/postV3ClickCollectOrdersMetaDetails). One assembly order can have only one customs declaration number.
        Customs declaration number can only be added if all the conditions are met:
        - the assembly order has the B2B sale attribute — `"isB2b": true` in the response of the method [getting new assembly orders](https://dev.wildberries.ru/openapi/in-store-pickup#tag/inStorePickupAssemblyOrders/operation/getV3ClickCollectOrdersNew)
        - the assembly order is in `confirm` or `prepare` statuses
        - the `customsDeclaration` field is returned in the response of the [Get order label identifiers](https://dev.wildberries.ru/openapi/in-store-pickup#tag/inStorePickupLabelIdentifiers/operation/postV3ClickCollectOrdersMetaDetails) method

        [Request limit](https://dev.wildberries.ru/openapi/api-information#tag/introduction/Rate-Limits) per one seller account for all methods for **adding In-Store Pickup label identifiers**:
        | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- |
        | 1 min | 20 requests | 3 s | 500 requests |
        One request with `4XX` response codes is counted as 10 requests.

        ---

        In [Sandbox](https://dev.wildberries.ru/en/sandbox) — maximum of 1 request per second for all **Marketplace** methods in total.

        Library doc: https://valeryverkhoturov.github.io/wb-api-client-docs/reference/api/in-store-pickup/post-api-marketplace-v3-click-collect-orders-meta-customs-declaration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - orders
              properties:
                orders:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    properties:
                      customsDeclaration:
                        type: string
                        minLength: 17
                        maxLength: 29
                        description: Customs declaration number
                        example: 10704010/010624/0000302
                      orderId:
                        type: integer
                        description: Assembly order ID
                        format: int64
                      originCountryCode:
                        type: string
                        description: |
                          Numeric code of the country of origin according to [Russian classification of countries of the world](https://esnsi.gosuslugi.ru/classifiers/16269). Required only for assembly orders with the B2B sale indicator `"isB2b": true`
                        example: '643'
                        maxLength: 3
                    required:
                    - customsDeclaration
                    - orderId
                    - originCountryCode
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.CustomsDeclarationSetResponse'
              examples:
                CustomsDeclarationResponse:
                  $ref: '#/components/examples/CustomsDeclarationResponse'
        '400':
          $ref: '#/components/responses/IncorrectRequest'
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                AccessDenied:
                  $ref: '#/components/examples/AccessDenied'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Response4XX'
              examples:
                Response403TokenCategory:
                  $ref: '#/components/examples/Response403TokenCategory'
        '429':
          $ref: '#/components/responses/429'
      x-tagKey: inStorePickupLabelIdentifiers
      x-original-tags:
      - In-Store Pickup Label Identifiers
