  x-file-name: in-store-pickup
  description: |-
    Management of [assembly orders](https://dev.wildberries.ru/openapi/in-store-pickup#tag/inStorePickupAssemblyOrders) and [order label identifiers](https://dev.wildberries.ru/openapi/in-store-pickup#tag/inStorePickupLabelIdentifiers) for the In-Store Pickup scheme.

    You can test the In-Store Pickup methods in the [sandbox](https://dev.wildberries.ru/en/sandbox). Also you can use [special methods](https://dev.wildberries.ru/en/docs/openapi-other/sandbox-environment#tag/marketplaceInStorePickup) in the sandbox for emulating user actions
  version: instorepickup
servers:
- url: https://marketplace-api.wildberries.ru
security:
- BearerAuth: []
tags:
- name: In-Store Pickup Assembly Orders
  x-displayName: In-Store Pickup Assembly Orders
  description: ''
  x-tagKey: inStorePickupAssemblyOrders
- name: In-Store Pickup Label Identifiers
  x-displayName: In-Store Pickup Label Identifiers
  description: ''
  x-tagKey: inStorePickupLabelIdentifiers
paths:
  /api/v3/click-collect/orders/new:
    servers:
    - url: https://marketplace-api.wildberries.ru
      description: |
        **Prod**
    - url: https://marketplace-api-sandbox.wildberries.ru
      description: |
        **Sandbox**
    get:
      operationId: getV3ClickCollectOrdersNew
      x-readonly-method: true
      x-category: marketplace
      tags:
      - InStorePickup
      summary: Get New Assembly Orders List
      description: |-
        The method provides a list of all new [assembly orders](https://dev.wildberries.ru/openapi/in-store-pickup#tag/inStorePickupAssemblyOrders) that the seller has at the time of the request.

        [Request limit](https://dev.wildberries.ru/openapi/api-information#tag/introduction/Rate-Limits) per one seller account for **In-Store Pickup assembly orders** methods:
        | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- |
        | 1 min | 300 requests | 200 ms | 20 requests |
        One request with `4XX` response codes is counted as 10 requests.

        ---

        In [Sandbox](https://dev.wildberries.ru/en/sandbox) — maximum of 1 request per second for all **Marketplace** methods in total.

        Library doc: https://valeryverkhoturov.github.io/wb-api-client-docs/reference/api/in-store-pickup/get-api-v3-click-collect-orders-new
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.NewOrders'
              examples:
                NewOrderClick:
                  $ref: '#/components/examples/NewOrderClick'
        '401':
          $ref: '#/components/responses/401'
        '402':
          $ref: '#/components/responses/402'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                AccessDenied:
                  $ref: '#/components/examples/AccessDenied'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Response4XX'
              examples:
                Response403TokenCategory:
                  $ref: '#/components/examples/Response403TokenCategory'
        '429':
          $ref: '#/components/responses/429'
      x-tagKey: inStorePickupAssemblyOrders
      x-original-tags:
      - In-Store Pickup Assembly Orders
  /api/v3/click-collect/orders:
    servers:
    - url: https://marketplace-api.wildberries.ru
      description: |
        **Prod**
    - url: https://marketplace-api-sandbox.wildberries.ru
      description: |
        **Sandbox**
    get:
      operationId: getV3ClickCollectOrders
      x-readonly-method: true
      x-category: marketplace
      tags:
      - InStorePickup
      summary: Get Information on Completed Orders
      description: |-
        The method provides information on completed assembly orders after the sale or cancellation of an order.
        You can get data for a specified period, maximum of 30 calendar days per request.

        [Request limit](https://dev.wildberries.ru/openapi/api-information#tag/introduction/Rate-Limits) per one seller account for **In-Store Pickup assembly orders** methods:
        | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- |
        | 1 min | 300 requests | 200 ms | 20 requests |
        One request with `4XX` response codes is counted as 10 requests.

        ---

        In [Sandbox](https://dev.wildberries.ru/en/sandbox) — maximum of 1 request per second for all **Marketplace** methods in total.

        Library doc: https://valeryverkhoturov.github.io/wb-api-client-docs/reference/api/in-store-pickup/get-api-v3-click-collect-orders
      parameters:
      - name: limit
        in: query
        description: |
          Number of items in the response
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          format: int64
      - name: next
        in: query
        description: |
          Pagination parameter. To get the full list of data, specify 0 in the first request. To get the next data package, use the `next` value from the response
        required: true
        schema:
          type: integer
          format: int64
      - name: dateFrom
        in: query
        description: Period start date in the Unix timestamp format
        required: true
        schema:
          type: integer
          format: int64
      - name: dateTo
        in: query
        description: Period end date in the Unix timestamp format
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.Orders'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                IncorrectParameter:
                  $ref: '#/components/examples/IncorrectParameter'
        '401':
          $ref: '#/components/responses/401'
        '402':
          $ref: '#/components/responses/402'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                AccessDenied:
                  $ref: '#/components/examples/AccessDenied'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Response4XX'
              examples:
                Response403TokenCategory:
                  $ref: '#/components/examples/Response403TokenCategory'
        '429':
          $ref: '#/components/responses/429'
