              schema:
                $ref: '#/components/schemas/Error'
              examples:
                IncorrectParameter:
                  $ref: '#/components/examples/IncorrectParameter'
                IncorrectRequestBody:
                  $ref: '#/components/examples/IncorrectRequestBody'
                IncorrectRequest:
                  $ref: '#/components/examples/IncorrectRequest'
        '401':
          $ref: '#/components/responses/401'
        '402':
          $ref: '#/components/responses/402'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                AccessDenied:
                  $ref: '#/components/examples/AccessDenied'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Response4XX'
              examples:
                Response403TokenCategory:
                  $ref: '#/components/examples/Response403TokenCategory'
        '429':
          $ref: '#/components/responses/429'
      x-tagKey: dbwAssemblyOrders
      x-original-tags:
      - DBW Assembly Orders
