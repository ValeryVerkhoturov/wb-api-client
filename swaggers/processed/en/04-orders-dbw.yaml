  /api/v3/dbw/orders/status:
    servers:
    - url: https://marketplace-api.wildberries.ru
    post:
      operationId: postV3DbwOrdersStatus
      x-readonly-method: true
      x-category: marketplace
      security:
      - BearerAuth: []
      tags:
      - OrdersDbw
      summary: Get Orders Statuses
      description: |-
        Returns the statuses of orders based on the provided list of assembly order IDs
        `supplierStatus` is a status of an order. The trigger for its change is the action of the seller himself.
        Possible values for this field are:
        | Status | Description | How to move an order to this status |
        | ------- | --------- | --------------------------------------|
        | `new` | \*\*New order\*\* | |
        | `confirm` | \*\*Order on assembly\*\* | [Transfer to assembly](https://dev.wildberries.ru/openapi/orders-dbw#tag/dbwAssemblyOrders/operation/patchV3DbwOrdersOrderIdConfirm)
        | `complete` | \*\*Order on delivery\*\*
         | [Transfer to delivery](https://dev.wildberries.ru/openapi/orders-dbw#tag/dbwAssemblyOrders/operation/postV3DbwOrdersStatusDeliver)
        | `receive` | \*\*Received by the buyer\*\*
         | Changed by the courier
        | `reject` | \*\*Declined upon receipt\*\*
         | Changed by the courier
        | `cancel` | \*\*Canceled by the seller\*\* | [Cancel the order](https://dev.wildberries.ru/openapi/orders-dbw#tag/dbwAssemblyOrders/operation/patchV3DbwOrdersOrderIdCancel)
        | `cancel\_missed\_call` | \*\*Cancellation due to unreachable buyer\*\* | The status changes automatically |
        `wbStatus` is a status of an order on the Wildberries side.
        Possible values for this field are:
        - `waiting` — order in work
        - `sold` — the buyer got the order
        - `canceled` — order canceled
        - `canceled\_by\_client` — the buyer canceled the order
        - `declined\_by\_client` — the buyer canceled the order in the first hour
         Cancellation is available to the buyer in the first hour from the moment of order, if the order is not transferred to confirm status.
        - `defect` — order canceled due to a defect
        - `canceled\_by\_missed\_call` — cancellation due to unreachable buyer
        - `postponed\_delivery` — courier delivery is postponed

        [Request limit](https://dev.wildberries.ru/openapi/api-information#tag/introduction/Rate-Limits) per one seller account for DBW methods:

        * for getting and updating contact lists
        * for getting and deleting label identifiers
        * assembly orders

        | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- |
        | 1 min | 300 requests | 200 ms | 20 requests |
        One request with `4XX` response codes is counted as 10 requests

        Library doc: https://valeryverkhoturov.github.io/wb-api-client-docs/reference/api/orders-dbw/post-api-v3-dbw-orders-status
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - orders
              properties:
                orders:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  description: Order IDs list
                  items:
                    type: integer
                    format: int64
                    example: 5632423
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostV3DbwOrdersStatusResponse200'
        '400':
