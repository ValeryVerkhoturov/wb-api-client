    api.StatusSetResponses:
      type: object
      example:
        requestId: 03615778-eb9e-4f55-b4Of-fd3ac0fad2сc
        results:
        - orderId: 4299281547
          isError: true
          errors:
          - code: 404
            detail: NotFound
        - orderId: 4279781545
          isError: false
      properties:
        requestId:
          type: string
          description: Unique ID of the request with errors.
        results:
          type: array
          items:
            $ref: '#/components/schemas/api.StatusSetResponse'
    api.StatusSetResponse:
      type: object
      properties:
        errors:
          items:
            $ref: '#/components/schemas/api.BatchErrorResponse'
          type: array
          description: Error details
        isError:
          type: boolean
          description: Are there any errors
          example: true
        orderId:
          type: integer
          description: Assembly order ID with successfully set data
          example: 123456
          format: int64
    api.BatchErrorResponse:
      properties:
        code:
          type: integer
          description: |
            Error code:
              - `404`
              - `409`
          example: 404
          format: int64
        detail:
          type: string
          description: |
            - `NotFound` —  assembly order is not found
            - `StatusMismatch` — operation is not possible for this assembly order status
            - `ImeiIsNotFilled` — IMEI is not filled
            - `MetaValidationFail` — errors label identifier validation
          example: NotFound
        metaDetails:
          type: array
          description: Label identifiers validation error details
          items:
            type: object
            properties:
              key:
                type: string
                description: Label identifier
                example: sgtin
              value:
                type: string
                nullable: true
                description: Label identifier value
                example: '1234567890'
              decision:
                type: string
                description: |
                  Статус проверки:
                  - `sgtin`
                    - `sgtinInvalidFormat` — Invalid format
                    - `sgtinNotFound` — Label identifier not found in [Chestny ZNAK](https://chestnyznak.ru/en/)
                    - `sgtinEmitted` —  Label identifier has been issued
                    - `sgtinApplied` — Putting into circulation not completed
                    - `sgtinWrittenOff` — Written off
                    - `sgtinRetired` — Retired
                    - `sgtinWithdrawn` — Withdrawn
                    - `sgtinDisaggregation` — Disaggregation
                    - `sgtinDisaggregated` — Disaggregated
                    - `sgtinAppliedNotPaid` — Not paid
                    - `pending` — Label identifier for inspection
                example: sgtinEmitted
      type: object
    api.MetaDeleteResponses:
      type: object
      properties:
        requestId:
          type: string
          description: Unique request ID. Displayed for responses with errors
        results:
          type: array
          items:
            type: object
            properties:
              errors:
                items:
                  type: object
                  properties:
                    code:
                      type: integer
                      description: |
                        Error code:
                          - `404`
                          - `409`
                      format: int64
                    detail:
                      type: string
                      description: |
                        - `NotFound` —  assembly order is not found
                        - `StatusMismatch` — operation is not possible for this assembly order status
                        - `ImeiIsNotFilled` — IMEI is not filled
                type: array
                description: Error details
              isError:
                type: boolean
                description: Are there any errors
              orderId:
                type: integer
                description: Assembly order ID with successfully set data
                format: int64
