          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostV3DbwOrdersStickersResponse200'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                IncorrectRequestBody:
                  $ref: '#/components/examples/IncorrectRequestBody'
                IncorrectRequest:
                  $ref: '#/components/examples/IncorrectRequest'
                IncorrectParameter:
                  $ref: '#/components/examples/IncorrectParameter'
        '401':
          $ref: '#/components/responses/401'
        '402':
          $ref: '#/components/responses/402'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                AccessDenied:
                  $ref: '#/components/examples/AccessDenied'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Response4XX'
              examples:
