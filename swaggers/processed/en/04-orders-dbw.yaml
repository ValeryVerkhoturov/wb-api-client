  /api/v3/dbw/orders/stickers:
    servers:
    - url: https://marketplace-api.wildberries.ru
    post:
      operationId: postV3DbwOrdersStickers
      x-readonly-method: true
      x-category: marketplace
      security:
      - BearerAuth: []
      tags:
      - OrdersDbw
      summary: Get Orders Stickers
      description: |-
        Returns a list of stickers for the [assembly orders](https://dev.wildberries.ru/openapi/orders-dbw#tag/dbwAssemblyOrders/operation/getV3DbwOrdersNew) in the [statuses](https://dev.wildberries.ru/openapi/orders-dbw#tag/dbwAssemblyOrders/operation/postV3DbwOrdersStatus):
        - `confirm` — on assembly
        - `complete` — on delivery
        You can get a maximum of 100 stickers per request.
        Available sticker formats:
        - SVG
        - ZPLV (vertical)
        - ZPLH (horizontal)
        - PNG
        Available dimensions:
        - 580x400 px, with `width=58&height=40` in request
        - 400x300 px, with `width=40&height=30` in request

        [Request limit](https://dev.wildberries.ru/openapi/api-information#tag/introduction/Rate-Limits) per one seller account for DBW methods:

        * for getting and updating contact lists
        * for getting and deleting label identifiers
        * assembly orders

        | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- |
        | 1 min | 300 requests | 200 ms | 20 requests |
        One request with `4XX` response codes is counted as 10 requests

        Library doc: https://valeryverkhoturov.github.io/wb-api-client-docs/reference/api/orders-dbw/post-api-v3-dbw-orders-stickers
      parameters:
      - name: type
        in: query
        required: true
        description: Sticker format
        schema:
          type: string
          enum:
          - svg
          - zplv
          - zplh
          - png
      - name: width
        in: query
        required: true
        description: Sticker width
        schema:
          type: integer
          enum:
          - 58
          - 40
          format: int64
      - name: height
        in: query
        required: true
        description: Sticker height
        schema:
          type: integer
          enum:
          - 40
          - 30
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                orders:
                  type: array
                  minItems: 1
                  maxItems: 100
                  description: Assembly order IDs list
                  items:
                    type: integer
                    format: int64
                    example: 5346346
      responses:
