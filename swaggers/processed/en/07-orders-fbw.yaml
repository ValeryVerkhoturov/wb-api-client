    post:
      x-readonly-method: false
      x-category: supplies
      operationId: postV1DraftsDraftIdItems
      x-token-types:
      - personal
      - service
      summary: Add Items to Draft
      description: |-
        Method is [available](https://dev.wildberries.ru/openapi/api-information#tag/authorization/Rules-for-using-API-access-tokens) by
        **Personal** token,
        **Service** token

        Adds items to the specified supply draft.

        The method works on the principle of atomicity:
        - if all skus are successfully validated, all items will be added to the draft. The response will return `{"results":[]}`
        - if at least one sku is not validated, no items will be added to the draft. The response will return a list of invalid skus

        [Request limit](https://dev.wildberries.ru/openapi/api-information#tag/introduction/Rate-Limits) per one seller account:
        | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- |
        | 1 min | 30 requests | 2 s | 10 requests |

        Library doc: https://valeryverkhoturov.github.io/wb-api-client-docs/reference/api/orders-fbw/post-api-supplies-v1-drafts-draftid-items
      tags:
      - OrdersFbw
      parameters:
      - name: draftId
        in: path
        description: Draft ID
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/models.DraftAdditemsRequest'
            example:
              items:
              - quantity: 1
                sku: '1234567'
              - quantity: 1
                sku: '2000000512907'
      responses:
        '200':
          description: |
            Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.DraftAddItemsErrorResponse'
              examples:
                invalidSku:
                  $ref: '#/components/examples/InvalidSku'
                SuccessResponse:
