  /api/supplies/v1/drafts:
    servers:
    - url: https://supplies-api.wildberries.ru
    get:
      x-readonly-method: true
      x-token-types:
      - personal
      - service
      x-category: supplies
      operationId: getV1Drafts
      summary: Drafts List
      description: |-
        Method is [available](https://dev.wildberries.ru/openapi/api-information#tag/authorization/Rules-for-using-API-access-tokens) by
        **Personal** token,
        **Service** token

        The method returns a list of supply drafts

        [Request limit](https://dev.wildberries.ru/openapi/api-information#tag/introduction/Rate-Limits) per one seller account:
        | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- |
        | 1 min | 30 requests | 2 s | 10 requests |

        Library doc: https://valeryverkhoturov.github.io/wb-api-client-docs/reference/api/orders-fbw/get-api-supplies-v1-drafts
      tags:
      - OrdersFbw
      parameters:
      - name: limit
        in: query
        description: Number of drafts in the response
        schema:
          type: integer
          default: 1000
          minimum: 0
          maximum: 1000
          format: int64
      - name: offset
        in: query
        description: How many results to skip. For example, for the value 10, the response will start with the 11 element
        schema:
          type: integer
          default: 0
          minimum: 0
          format: int64
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - createDt
          - updateDt
          default: createDt
        description: |
          Sorting:
            - `createdDt` — by the draft creation date
            - `updatedDt` — by the draft update date
      - name: order
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        description: |
          Data order:
            - `desc` — descending
            - `asc` — ascending
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ListDraftsResponse'
              example:
                drafts:
                - draftId: b5aed067-69d4-47b8-a5d0-591c615288f9
                  phone: +7 123 *** 23 23
                  skuQuantity: 5
                  itemQuantity: 1
                  createdAt: '2025-06-17T08:11:57.767Z'
                  updatedAt: '2025-06-17T08:11:57.767Z'
                total: 1
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors.DraftError'
              examples:
                BadLimitFormat:
                  $ref: '#/components/examples/BadLimitFormat'
                BadOffsetFormat:
                  $ref: '#/components/examples/BadOffsetFormat'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
      x-tagKey: supplyDrafts
      x-original-tags:
      - Supply Drafts
    post:
      x-readonly-method: false
      x-token-types:
      - personal
      - service
      x-category: supplies
      operationId: postV1Drafts
      summary: Create Draft
      description: |-
        Method is [available](https://dev.wildberries.ru/openapi/api-information#tag/authorization/Rules-for-using-API-access-tokens) by
        **Personal** token,
        **Service** token

        The method creates empty supply draft.

