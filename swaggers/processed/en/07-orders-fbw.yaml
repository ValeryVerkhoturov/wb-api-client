  /api/v1/supplies:
    servers:
    - url: https://supplies-api.wildberries.ru
    post:
      operationId: postV1Supplies
      x-readonly-method: true
      x-category: supplies
      tags:
      - OrdersFbw
      summary: Supplies List
      description: |-
        The method returns a list of supplies, the last 1000 supplies by default.

        [Request limit](https://dev.wildberries.ru/openapi/api-information#tag/introduction/Rate-Limits) per one seller account:
        | Type | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- | --- |
        | Personal | 1 min | 30 requests | 2 s | 10 requests |
        | Service | 1 min | 30 requests | 2 s | 10 requests |
        | Base with secret | 1 min | 30 requests | 2 s | 10 requests |
        | Base | 1 h | 2 requests | 30 min | 1 request |

        Library doc: https://valeryverkhoturov.github.io/wb-api-client-docs/reference/api/orders-fbw/post-api-v1-supplies
      parameters:
      - name: limit
        in: query
        description: Number of objects in the response
        schema:
          type: integer
          default: 1000
          maximum: 1000
          minimum: 1
          format: int64
      - name: offset
        in: query
        description: From which element to start outputting data
        schema:
          type: integer
          default: 0
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/models.SuppliesFiltersRequest'
            example:
              dates:
              - from: '2024-03-04'
                till: '2025-03-24'
                type: factDate
              statusIDs:
              - 5
              - 6
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostV1SuppliesResponse200'
              example:
              - phone: +7 916 *** 44 44
                supplyID:
                preorderID: 34597755
                createDate: '2024-12-29T16:58:26+03:00'
                supplyDate:
                factDate:
                updatedDate:
                statusID: 1
                boxTypeID: 1
              - phone: +7 916 *** 33 33
                supplyID: 26596368
                preorderID: 34601223
                createDate: '2024-12-29T16:57:59+03:00'
                supplyDate: '2024-12-29T00:00:00+03:00'
                factDate:
                updatedDate:
                statusID: 2
                boxTypeID: 5
              - phone: +7 000 *** 36 76
                supplyID: 22677736
                preorderID: 27363170
                createDate: '2024-08-22T18:10:59+03:00'
                supplyDate: '2024-08-22T00:00:00+03:00'
                factDate: '2024-08-22T12:24:14+03:00'
                updatedDate: '2024-08-22T18:33:45+03:00'
                statusID: 6
                boxTypeID: 2
                isBoxOnPallet: false
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorModel'
              examples:
                BadTypeFormat:
                  $ref: '#/components/examples/BadTypeFormat'
                BadLimitFormat:
                  $ref: '#/components/examples/BadLimitFormat'
                BadOffsetFormat:
                  $ref: '#/components/examples/BadOffsetFormat'
                BadFromOrTill:
                  $ref: '#/components/examples/BadFromOrTill'
                BadStatusIDs:
                  $ref: '#/components/examples/BadStatusIDs'
        '401':
          $ref: '#/components/responses/401'
        '402':
          $ref: '#/components/responses/402'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
      x-tagKey: suppliesInformation
      x-original-tags:
      - Supplies Information
  /api/v1/supplies/{ID}:
    servers:
    - url: https://supplies-api.wildberries.ru
    get:
      operationId: getV1SuppliesId
      x-readonly-method: true
      x-category: supplies
      tags:
      - OrdersFbw
      summary: Supply Details
      description: |-
        The method returns supply details by ID.

        [Request limit](https://dev.wildberries.ru/openapi/api-information#tag/introduction/Rate-Limits) per one seller account:
        | Type | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- | --- |
        | Personal | 1 min | 30 requests | 2 s | 10 requests |
        | Service | 1 min | 30 requests | 2 s | 10 requests |
        | Base with secret | 1 min | 30 requests | 2 s | 10 requests |
        | Base | 1 h | 2 requests | 30 min | 1 request |

        Library doc: https://valeryverkhoturov.github.io/wb-api-client-docs/reference/api/orders-fbw/get-api-v1-supplies-id
      parameters:
      - name: ID
        in: path
        description: ID of the supply or the order
        required: true
        schema:
          type: integer
          format: int64
      - name: isPreorderID
        in: query
        description: |
          Search by:
            - `true` — order ID, if you pass the order ID in `ID`
            - `false` — supply ID, if you pass the supply ID in `ID`
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.SupplyDetails'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorModel'
              examples:
                BadPathParamFormat:
                  $ref: '#/components/examples/BadPathParamFormat'
                BadisPreorderIDFormat:
                  $ref: '#/components/examples/BadisPreorderIDFormat'
                PreorderIdSearchError:
                  $ref: '#/components/examples/PreorderIdSearchError'
                BadID:
                  $ref: '#/components/examples/BadID'
        '401':
          $ref: '#/components/responses/401'
        '402':
          $ref: '#/components/responses/402'
        '403':
          $ref: '#/components/responses/403'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorModel'
              examples:
                SupplyNotFound:
                  $ref: '#/components/examples/SupplyNotFound'
        '429':
          $ref: '#/components/responses/429'
      x-tagKey: suppliesInformation
      x-original-tags:
      - Supplies Information
