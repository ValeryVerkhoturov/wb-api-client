openapi: 3.0.1
info:
  title: FBW Supplies
  version: ordersfbw
  description: |-
    This section describes the methods for getting:
    - [information for forming supplies](https://dev.wildberries.ru/openapi/orders-fbw#tag/informationForFormingSupplies)
    - [supplies information](https://dev.wildberries.ru/openapi/orders-fbw#tag/suppliesInformation)
  x-file-name: orders-fbw
security:
- BearerAuth: []
tags:
- name: Information for Forming Supplies
  x-displayName: Information for Forming Supplies
  description: ''
  x-tagKey: informationForFormingSupplies
- name: Supplies Information
  x-displayName: Supplies Information
  description: ''
  x-tagKey: suppliesInformation
- name: Supply Drafts
  x-displayName: Supply Drafts
  description: ''
  x-tagKey: supplyDrafts
paths:
  /api/v1/acceptance/options:
    servers:
    - url: https://supplies-api.wildberries.ru
    post:
      operationId: postV1AcceptanceOptions
      x-readonly-method: true
      x-category: supplies
      security:
      - BearerAuth: []
      tags:
      - OrdersFbw
      summary: Acceptance Options
      description: |-
        The method is [temporary disabled](https://dev.wildberries.ru/en/release-notes?id=570)

        [Request limit](https://dev.wildberries.ru/openapi/api-information#tag/introduction/Rate-Limits) per one seller account:
        | Type | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- | --- |
        | Personal | 1 min | 6 requests | 10 s | 6 requests |
        | Service | 1 min | 6 requests | 10 s | 6 requests |
        | Base with secret | 1 min | 6 requests | 10 s | 6 requests |
        | Base | 1 h | 2 requests | 30 min | 1 request |

        Library doc: https://valeryverkhoturov.github.io/wb-api-client-docs/reference/api/orders-fbw/post-api-v1-acceptance-options
      parameters:
      - name: warehouseID
        in: query
        description: "Warehouse ID.\n If the parameter is not specified, data for all warehouses is returned.\n \\*\\*Maximum is one value\\*\\*"
        schema:
          type: integer
          format: int64
        example: 507
      requestBody:
        content:
          application/json:
            schema:
              type: array
              maxItems: 5000
              items:
                $ref: '#/components/schemas/models.Good'
            examples:
              RequestOptions:
                $ref: '#/components/examples/RequestOptions'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.OptionsResultModel'
              examples:
                Response:
                  $ref: '#/components/examples/OptionsResponse'
        '400':
          description: Incorrect request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorModel'
              examples:
                BadWarehouseIDsParam:
                  $ref: '#/components/examples/Response400Options'
        '401':
          $ref: '#/components/responses/401'
        '402':
          $ref: '#/components/responses/402'
        '403':
          $ref: '#/components/responses/403'
        '404':
          description: Not found
        '429':
          $ref: '#/components/responses/429'
      x-tagKey: informationForFormingSupplies
      x-original-tags:
      - Information for Forming Supplies
