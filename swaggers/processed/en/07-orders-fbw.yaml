  /api/supplies/v1/discrepancies/{supplyId}:
    servers:
    - url: https://supplies-api.wildberries.ru
    get:
      operationId: getV1SuppliesSupplyIdDiscrepanciesQuantity
      x-readonly-method: true
      x-category: supplies
      x-token-types:
      - personal
      - service
      tags:
      - OrdersFbw
      summary: Supply Discrepancies
      description: |-
        Method is [available](https://dev.wildberries.ru/openapi/api-information#tag/authorization/Rules-for-using-API-access-tokens) by
        **Personal** token,
        **Service** token

        The method returns information about discrepancies between the declared and actual item quantity in the supply.

        Available for supplies accepted no more than one year ago.

        \*\*Discrepancy types:\*\*

        Discrepancy upwards:

        1. Excess of items with the declared SKU:
        - `"discrepancyType": "surplus"`
        - `"discrepancyLabel": "surplus"`
        2. Excess of items with a SKU that does not match the declared one:
        - `"discrepancyType": "surplus"`
        - `"discrepancyLabel": "re-sorting"`
        Discrepancy downwards:

        1. Missing items:
        - `"discrepancyType": "shortage"`
        - `"discrepancyLabel": "shortage"`
        2. Some SKUs do not match the declared ones:
        - `"discrepancyType": "shortage"`
        - `"discrepancyLabel": "re-sorting"`

        [Request limit](https://dev.wildberries.ru/openapi/api-information#tag/introduction/Rate-Limits) per one seller account:
        | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- |
        | 1 min | 1 request | 1 min | 1 request |

        Library doc: https://valeryverkhoturov.github.io/wb-api-client-docs/reference/api/orders-fbw/get-api-supplies-v1-discrepancies-supplyid
      parameters:
      - name: supplyId
        in: path
        description: Supply ID
        required: true
        schema:
          type: string
          format: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetV1SuppliesSupplyIdDiscrepanciesQuantityResponse200'
              examples:
                ItemDiscrepancyResponse:
                  $ref: '#/components/examples/ItemDiscrepancyResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorModel'
              examples:
                BadPathParamFormat:
                  $ref: '#/components/examples/BadPathParamFormat'
                BadSupplyIDPackage:
                  $ref: '#/components/examples/BadSupplyIDPackage'
                BadID:
                  $ref: '#/components/examples/BadID'
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: Доступ запрещён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.SupplyAcceptedMoreThanYearAgo'
              examples:
                SupplyAcceptedMoreThanYearAgo:
                  $ref: '#/components/examples/SupplyAcceptedMoreThanYearAgo'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Response4XX'
              examples:
                Response403TokenCategory:
                  $ref: '#/components/examples/Response403TokenCategory'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorModel'
              examples:
                SupplyNotFound:
                  $ref: '#/components/examples/SupplyNotFound'
        '429':
          $ref: '#/components/responses/429'
      x-tagKey: suppliesInformation
      x-original-tags:
      - Supplies Information
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Wildberries API token (JWT). Create in the seller portal → Настройки → Доступ к API. Sent as `Authorization: Bearer `.'
  schemas:
    models.ItemDiscrepancyResponse:
      type: object
      properties:
        packageCode:
          description: Package ID
          type: string
        videoUrl:
          description: Video of discrepancies during acceptance
          type: string
        videoStartsAt:
          description: Date and time of video recording of discrepancies during acceptance
          type: string
        videoUnavailable:
          description: |
            Is the video available:
              - `false` — yes
              - `true` — no
          type: boolean
        items:
          description: Supply items
          type: array
          items:
            $ref: '#/components/schemas/models.DiscrepancyResponseItem'
    models.DiscrepancyResponseItem:
      type: object
      properties:
        declaredSku:
          nullable: false
          description: SKU declared when creating the supply
          type: string
        discrepancyType:
          nullable: false
          type: string
          description: |
            Overall discrepancy type for the box:
              - `surplus` — more items delivered than declared
              - `shortage` — fewer items delivered than declared
              - `re-sorting` — the SKU of the accepted item does not match the one declared when creating the supply
          enum:
          - surplus
          - shortage
          - re-sorting
        declaredAmount:
          nullable: false
          description: Item quantity declared when creating the supply
          type: integer
          format: int64
        actualAmount:
          nullable: false
          description: Actual item quantity
          type: integer
          format: int64
        discrepancyQuantity:
          nullable: false
          description: Difference between declared and actual item quantity
          type: integer
          format: int64
        actualSku:
          nullable: false
          description: Actual SKU
          type: string
        skuScans:
          description: Item scan results
          nullable: true
          type: array
          items:
            $ref: '#/components/schemas/models.ItemScans'
    models.ItemScans:
      type: object
      properties:
        scanId:
          nullable: false
          description: Scan ID
          type: integer
          format: int64
        declaredSku:
          nullable: false
          description: SKU declared when creating the supply
          type: string
        scanTime:
          nullable: false
          description: Scan date and time
          type: string
        discrepancyLabel:
          nullable: false
          type: string
          description: |
            Discrepancy type:
              - `surplus` — more items delivered than declared
              - `shortage` — fewer items delivered than declared
              - `re-sorting` — the SKU of the accepted item does not match the one declared when creating the supply
          enum:
          - surplus
          - shortage
          - re-sorting
        actualSku:
          nullable: false
          type: string
          description: Actual SKU
    errors.DraftError:
      type: object
      properties:
        status:
          type: integer
          description: HTTP status code
          format: int64
        title:
          type: string
          description: Error title
        detail:
          type: string
          description: Error details
        requestId:
          type: string
          description: Unique request ID
        origin:
          type: string
          description: Service name
    models.DraftAdditemsRequest:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/models.Item'
          description: Items list
          maxItems: 1000
    models.DraftAddItemsErrorResponse:
      properties:
        results:
          description: List of invalid SKUs with errors
          items:
            $ref: '#/components/schemas/models.DraftAddItemsResultItem'
          type: array
      type: object
    models.DraftDeleteItemsErrorResponse:
      properties:
        results:
          type: array
          items:
            type: string
      type: object
    models.DraftAddItemsResultItem:
      properties:
        error:
          allOf:
          - $ref: '#/components/schemas/models.DraftAddItemsResultError'
          description: Error detail
        sku:
          description: SKU
          type: string
      type: object
    models.DraftAddItemsResultError:
      properties:
        detail:
          description: Error details
          example: Создайте карточку товара с этим баркодом
          type: string
        title:
          description: Error title
          example: Invalid sku
          type: string
      type: object
    models.DraftCreateResponse:
      type: object
      properties:
        draftId:
          type: string
          description: Draft ID
          example: cd20d135-f13f-47a0-903c-3bd268b92047
    models.DraftDeleteitemsRequest:
      type: object
      required:
      - skus
      properties:
        skus:
          type: array
          minItems: 1
          items:
            type: string
          description: SKUs list
    models.DraftItemItem:
      type: object
      properties:
        sku:
          type: string
          description: SKU
        color:
          type: string
          description: Item color
        quantity:
          type: integer
          description: Item quantity
          format: int64
        brandName:
          type: string
          description: Brand
        imgSrc:
          type: string
          description: Link to item image
        nmId:
          type: integer
          description: WB item number
          format: int64
        subjectName:
          type: string
          description: Subcategory
        techSize:
          type: string
          description: Item size
        title:
          type: string
          description: Item title
        vendorCode:
          type: string
          description: Seller item number
    models.DraftItem:
      type: object
      properties:
        draftId:
          type: string
          description: Draft ID
        phone:
          type: string
          description: Phone number of the user that created the draft
        createdAt:
          type: string
          description: Date and time the draft was created
          format: ISO 8601
        updatedAt:
          type: string
          description: Date and time the draft was updated
          format: ISO 8601
        skuQuantity:
          type: integer
          description: SKU quantity
          format: int64
        itemQuantity:
          type: integer
          description: Item quantity
          format: int64
    models.ListDraftItemsResponse:
      type: object
      properties:
        skuQuantity:
          type: integer
          description: SKU quantity
          format: int64
        itemQuantity:
          type: integer
          description: Item quantity
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/models.DraftItemItem'
          description: Items list
    models.ListDraftsResponse:
      type: object
      properties:
        total:
          type: integer
          description: Total number of drafts
          format: int64
        drafts:
          type: array
          items:
            $ref: '#/components/schemas/models.DraftItem'
          description: Drafts list
    models.Item:
      type: object
      required:
      - quantity
      - sku
      properties:
        quantity:
          type: integer
          description: |
            Item quantity
          minimum: 1
          maximum: 999999
          format: int64
        sku:
          type: string
          description: SKU specified in the listing
    models.TransitTariff:
      type: object
      properties:
        transitWarehouseName:
          type: string
          description: Transit warehouse
        destinationWarehouseName:
          type: string
          description: Destination warehouse
        activeFrom:
          type: string
          description: From what date the transit direction is available
        boxTariff:
          nullable: true
          type: array
          description: Tariff for box transit. If `null`, transit for boxes is not available
          items:
            $ref: '#/components/schemas/models.VolumeTariff'
        palletTariff:
          type: integer
          description: Tariff per pallet, ₽
          format: int64
    models.VolumeTariff:
      type: object
      properties:
        from:
          type: integer
          description: Supply volume from, liters
          format: int64
        to:
          type: integer
          description: Supply volume up to, liters
          format: int64
        value:
          type: number
          description: Rate, ₽ per liter
    models.Box:
      type: object
      properties:
        packageCode:
          type: string
          description: Package SKU
        quantity:
          type: integer
          description: Total quantity of items in the package, pieces
          format: int64
        barcodes:
          type: array
          description: List of packed items
          items:
            $ref: '#/components/schemas/models.GoodInBox'
      example:
        packageCode: WB_689
        quantity: 1
        barcodes:
        - barcode: '1234567891234'
          quantity: 1
    models.GoodInBox:
      type: object
      properties:
        barcode:
          type: string
          description: Barcode
        quantity:
          type: integer
          description: Quantity, pieces
          format: int64
    models.SuppliesFiltersRequest:
      properties:
        dates:
          description: Filter by dates
          items:
            $ref: '#/components/schemas/models.DateFilterRequest'
          type: array
        statusIDs:
          description: |
            Filter the supply by statuses. Possible values:
              - `1` — Not planned
              - `2` — Planned
              - `3` — Dispatch allowed
              - `4` — Accepting
              - `5` — Accepted
              - `6` — Unloaded at the gate
          items:
            $ref: '#/components/schemas/models.HandySupplyStatus'
          type: array
      type: object
    models.GoodInSupply:
      type: object
      properties:
        barcode:
          description: Item barcode
          type: string
        vendorCode:
          type: string
          description: Seller item number
        nmID:
          type: integer
          description: WB item number
          format: int64
        needKiz:
          description: |
            Is a labeling code [Chestny ZNAK](https://chestnyznak.ru/en) required for this item:
              - `false` — not required
              - `true` — required
          type: boolean
        tnved:
          type: string
          description: |-
            HS-code.

            If `"needKiz":true` and `"tnved":null`, it is required to specify the \*\*HS-codes\*\* in the [personal account](https://seller.wildberries.ru/new-goods) or through [API](./item-management#tag/listings/operation/postV2CardsUpdate)
          nullable: true
        techSize:
          type: string
          description: Item size specified by the seller
        color:
          description: Item color
          type: string
          nullable: true
        supplierBoxAmount:
          type: integer
          nullable: true
          description: Specified in the package, pieces
          format: int64
        quantity:
          type: integer
          description: Specified in the supply/order, pieces
          format: int64
        readyForSaleQuantity:
          type: integer
          nullable: true
          description: Ready for sale, pieces
          format: int64
        acceptedQuantity:
          type: integer
          nullable: true
          description: Accepted, pieces
          format: int64
        unloadingQuantity:
          type: integer
          nullable: true
          description: Total items at putaway, pieces
          format: int64
      example:
        barcode: '1234567891234'
        vendorCode: wb4sewt0vg
        nmID: 987456654
        needKiz: true
        tnved: '6204430000'
        techSize: C
        color: красный
        supplierBoxAmount: 10
        quantity: 10
        readyForSaleQuantity: 0
        unloadingQuantity: 0
        acceptedQuantity: 0
    models.DateFilterRequest:
      properties:
        from:
          type: string
          description: Period start date
          format: ISO 8601
        till:
          type: string
          description: Period end date
          format: ISO 8601
        type:
          type: string
          enum:
          - factDate
          - createDate
          - supplyDate
          - updatedDate
          description: |
            Dates type:
              - `factDate` — actual dispatch date
              - `createDate` — supply creation date
              - `supplyDate` — planned dispatch date
              - `updatedDate` — supply update date
      required:
      - type
      type: object
    models.SupplyDetails:
      type: object
      properties:
        phone:
          description: Phone number of the user that created the supply
          type: string
        statusID:
          description: |
            Supply status ID:
            - `1` — Not planned
            - `2` — Planned
            - `3` — Dispatch allowed
            - `4` — Accepting
            - `5` — Accepted
            - `6` — Unloaded at the gate
          enum:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          type: integer
          format: int64
        virtualTypeID:
          description: |
            ID of virtual supply type. Displayed only for supplies with `"boxTypeID":0`.
              - `0` — Carryover of stock
              - `1` — Depersonalization
              - `4` — QR supply
              - `5` — Additional acceptance
              - `6` — Scan acceptance
          type: integer
          format: int64
        boxTypeID:
          description: |
            Supply type ID:
              - `0` — Without boxes (virtual supply)
              - `1` and `2` — Boxes
              - `5` — Monopallets
              - `6` — Supersafe
          type: integer
          format: int64
        createDate:
          description: Date and time the supply was created
          type: string
        supplyDate:
          description: Planned dispatch date
          type: string
          nullable: true
        factDate:
          description: Actual dispatch date
          type: string
          nullable: true
        updatedDate:
          description: Date of the supply update
          type: string
          nullable: true
        warehouseID:
