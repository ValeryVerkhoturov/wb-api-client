                ItemsArrayLimitExceeded:
                  $ref: '#/components/examples/ItemsArrayLimitExceeded'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          description: Not found
          content:
            application/json:
