    documentsRequest:
      type: object
      properties:
        type:
          type: integer
          description: |-
            Document type.
            The types of documents that you can add for the item are listed in [subcategory characteristics](./item-management#tag/categoriesSubcategoriesAndCharacteristics/operation/getV2ObjectCharcsSubjectId) in the `charcID` field.
            Possible document types::
            - `1` — Certificate of Conformity. You can specify for `charcID`: 15001136, 15001137, 15001138
            - `2` — The Correspondence Declaration. You can specify for `charcID`: 15001135, 15001137, 15001138
            - `3` — Certificate of Registration of SGR. You can specify for `charcID`: 62945173, 15000785, 15004302
            - `4` — Registration Certificate. You can specify for `charcID`: 15001574, 15002355, 15002356, 15002357
            - `5` — Certificate of Registration of the Republic of Belarus. You can specify for `charcID`: 15003071, 15003939
            - `7` — Registration of a Pesticide. You can specify for `charcID`: 15003924, 15003925
            - `8` — Registration of an Agrochemical. You can specify for `charcID`: 15003920, 15003921
            - `9` — Medicine Registration Certificate. You can specify for `charcID`: 1897013, 15004284
          format: int64
        number:
          type: string
          description: Document number
        productNumber:
          type: string
          description: Additional document number
        tradeName:
          type: string
          description: Trade name
        applicant:
          type: string
          description: Representative of the medical device manufacturer
        startDate:
          type: string
          description: Document start date and time
        endDate:
          type: string
          description: Document end date and time
        isEndless:
          type: boolean
          description: |
            Is the document valid indefinitely:
              - `true` — yes, the document is indefinite
              - `false` — no, the document has an expiration date
    reasonDocument:
      type: string
      nullable: true
      description: |-
        Validation error, returns for `status: 2`.
        Possible values:
        - `document\_missing` — No document uploaded
        - `document\_not\_found` — The document not found in the register
        - `document\_inactive` — The document has no legal effect
        - `document\_expired` — The document expired
        - `applicant\_mismatch` — Applicant details in the document and the listing don't match
        - `trade\_name\_mismatch` — Trade name in the document and the listing don't match
        - `unknown` — Validation failed
        - `document\_type\_mismatch` — The document number does not match the specified document type
        - `document\_dates\_mismatch` — Incorrect registration or expiration date of the document
    reasonListing:
      type: string
      nullable: true
      description: |-
        Validation error, returns for `status: 2`.
        Only 1 reason is given. If the listing failed validation for several reasons, then after correcting the first reason, the next one will be returned.
        Possible values:
        - `tnved\_missing` — HS code not specified
        - `supplier\_inn\_missing` — Taxpayer identification number not specified
        - `supplier\_not\_registered` — Seller not found in the register
        - `supplier\_inactive` — Seller status error. Please check it in the register
        - `product\_group\_not\_registered` — You haven't added the required item type in the labeling system
        - `kiz\_required` — Labeling code [Chestny ZNAK](https://chestnyznak.ru/en) is required to sell this item in Russia
        - `kiz\_certificate\_missing` — Confirmation is required that the labeling has been applied to the item
