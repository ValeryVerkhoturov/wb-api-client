    SetRecomReq:
      type: object
      description: Request to add or replace recommendations
      required:
      - recList
      properties:
        recList:
          type: array
          description: Item recommendations list
          maxItems: 5000
          minItems: 1
          items:
            type: object
            properties:
              nmId:
                description: WB item number
                type: integer
                default: 0
                example: 5870243
                format: int64
              recommendations:
                description: |-
                  Recommended items.

                  Specify the `recomNm` of the items to add them to the recommendations for the specified `nmId`.

                  Sending an empty array `[]` will delete all current recommendations for the specified `nmId`.
                type: array
                maxItems: 20
                minItems: 0
                items:
                  type: object
                  properties:
                    recomNm:
                      description: Recommended item WB number
                      type: integer
                      default: 0
                      example: 5870244
                      format: int64
                    sort:
                      description: |
                        Position of the item in the recommendations list.

                          Allowed values:
                          - `1`–`20` — fixed position:
                             - when creating or replacing (`replace: true`) sets the display order
                             - when adding (`replace: false`) inserts the item at the specified position, existing ones are shifted
                          - `0` — automatic sorting:
                            - when creating or replacing (`replace: true`) — according to the order of items in the `recommendations` array
                            - when adding (`replace: false`) — at the end of the existing recommendations list, preserving the order from the `recommendations` array
                      type: integer
                      default: 20
                      maximum: 20
                      minimum: 0
                      example: 1
                      format: int64
        replace:
          description: |
            Requested action:
              - `false` — add new recommendations to the current ones
              - `true` — replace current recommendations with the new ones
          type: boolean
          default: false
          example: true
