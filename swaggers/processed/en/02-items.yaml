      summary: Upload Media Files via Links
      description: "The method uploads a set of media files to a listing by specifying links in the request.\n\nNew media files (`data`) replace old ones (`mediaFiles`). To add new files, set links both to new and old files.\n\nRequirements for links:\n\\* no authorization is required to access the file via the link\n\\* the link must point directly to the file. Ensure the link does not lead to a preview or authentication page. The link must end with the file name including its extension — for example, `/file\\_name.jpg`. If the link opens a TXT or HTML page, it is considered invalid.\nNote that some storage services do not generate direct links and therefore are not suitable for use. \\*\\*Google Drive\\*\\* is an example of such a service, as it only generates links to a file preview or internal service pages.\nRequirements for images:\n\\* maximum images for each listing — 30\n\\* minimal resolution – 700 × 900 pixels\n\\* maximum size — 32 MB\n\\* minimal quality — 65%\n\\* formats — JPG, PNG, BMP, GIF (static), WebP\nRequirements for video:\n\\* maximum one video for each listing\n\\* maximum size — 50 MB\n\\* formats — MOV, MP4\nIf one or several images or a video do not meet the requirements, no images and a video will be uploaded even if you have the success response (`200`)\n\n[Request limit](https://dev.wildberries.ru/openapi/api-information#tag/introduction/Rate-Limits) per one seller account for all **Media Files** methods:\n| Type | Period | Limit | Interval | Burst |\n| --- | --- | --- | --- | --- |\n| Personal | 1 min | 100 requests | 600 ms | 5 requests |\n| Service | 1 min | 100 requests | 600 ms | 5 requests |\n| Base with secret | 1 min | 100 requests | 600 ms | 5 requests |\n| Base | 1 h | 2 requests | 30 min | 1 request |\n\n---\n\nIn Sandbox — maximum of 1 request per second for all **Content** methods in total.\n\nLibrary doc: https://valeryverkhoturov.github.io/wb-api-client-docs/reference/api/items/post-content-v3-media-save"
      tags:
      - Items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nmId:
                  description: WB item number
                  type: integer
                  format: int64
                data:
                  description: Links to images in the order that they are on the listing, and a video at any position of the array
                  type: array
                  items:
                    type: string
            example:
              nmId: 213864079
              data:
              - https://basket-stage-02.dasec.ru/vol669/part66964/66964260/images/big/2.jpg
              - https://sample-videos.com/video321/mp4/720/big_buck_bunny_720p_mb.mp4
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostV3MediaSaveResponse200'
              example:
                data: {}
                error: false
                errorText: ''
                additionalErrors:
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mediaErrors'
        '401':
          $ref: '#/components/responses/401'
        '402':
          $ref: '#/components/responses/402'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mediaErrors'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Response4XX'
              examples:
                Response403TokenCategory:
                  $ref: '#/components/examples/Response403TokenCategory'
        '409':
