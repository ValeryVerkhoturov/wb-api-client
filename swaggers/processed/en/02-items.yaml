  /content/v2/get/cards/list:
    servers:
    - url: https://content-api.wildberries.ru
      description: |
        **Prod**
    - url: https://content-api-sandbox.wildberries.ru
      description: |
        **Sandbox**
    post:
      operationId: postV2GetCardsList
      x-readonly-method: true
      x-category: content
      security:
      - BearerAuth: []
      tags:
      - Items
      summary: Listings
      description: |-
        Returns the listings.

        Listings from the trash are not provided in the method response. You can get these listings via [different method](https://dev.wildberries.ru/openapi/item-management#tag/listings/operation/postV2GetCardsTrash)

        To get \*\*more than 100\*\* listings, use pagination:
        1. Make the first request:

        ```
                {
                  "settings": {
                    "sort": {
                      "ascending": true
                    },
                    "cursor": {
                      "limit": 100
                    },
                    "filter": {
                      "withPhoto": -1
                    }
                  }
                }
        ```

        To get only new or updated listings after data export, use ascending sorting: `"sort":{"ascending":true}`.
        2. Copy `"updatedAt": "\*\*\*","nmID":"\*\*\*"` from the `cursor` in the response and insert into the `cursor` of your next request.
        3. Make the next request.
        4. Repeat 2 and 3 until `total` value in the response is less than the `limit` value in the request. This will mean you got all listings.
        To get only items that were listed or updated after the previous data export:
        1. Save the `"cursor":{"updatedAt":"\*\*\*","nmID":"\*\*\*"}` fields from the last response of the previous data export. When exporting the data, use ascending sorting: `"sort":{"ascending":true}`.
        2. Specify the saved `"cursor":{"updatedAt":"\*\*\*","nmID":"\*\*\*"}` fields in the first request. Keep using ascending sorting.
        3. Save the `"cursor":{"updatedAt":"\*\*\*","nmID":"\*\*\*"}` fields from the last response of the current data export.
        In the `documents` object, the method returns:
        - information about the added documents — the `items` array
        - the validation results for each document — the `verdict` object in `items'. If `verdict` is not returned in the response, the document validation is not completed yet
        - the validation result for the entire listing — the `overallVerdict` object. During the listing validation, not only the results of the document validation are taken into account, but also other data. For example, the data of required labeling codes and information from external registries. If `overallVerdict` is not returned in the response, the listing validation is not completed yet
        Document and listing validations are performed asynchronously and can take up to 3 days.
        Each change in the validation result updates the date and time in the `updatedAt` response field.
        To get new validation results, use pagination uploads sorted in ascending order.

        [Request limit](https://dev.wildberries.ru/openapi/api-information#tag/introduction/Rate-Limits) per one seller account:
        | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- |
        | 1 min | 100 requests | 600 ms | 5 requests |

        Library doc: https://valeryverkhoturov.github.io/wb-api-client-docs/reference/api/items/post-content-v2-get-cards-list
      parameters:
      - name: locale
        in: query
        schema:
          type: string
          example: ru
        description: |
          Language for response of the `name`, `value` and `object` fields:
            - `ru` — Russian
            - `en` — English
            - `zh` — Chinese

          Not used in the sandbox. The sandbox data is returned only in Russian
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                settings:
                  type: object
                  description: Settings
                  properties:
                    sort:
                      description: Sorting by `updatedAt` — date and time listings were updated
                      type: object
                      properties:
                        ascending:
                          type: boolean
                          default: false
                          description: |
                            Sorting order:
                              - `false` — descending
                              - `true` — ascending
                    filter:
                      description: Filters
                      type: object
                      properties:
                        withPhoto:
                          type: integer
                          default: 0
                          enum:
                          - -1
                          - 0
                          - 1
                          - 2
                          description: |
                            Photo:
                              * `-1` — any listings
                              * `0` — any listings
                              * `1` — only listings with photos
                              * `2` — only listings without photos
                          format: int64
                        textSearch:
                          type: string
                          description: Seller item number, WB item number or SKU search
                        tagIDs:
                          type: array
                          description: Label ID search
                          items:
                            type: integer
                            format: int64
                        allowedCategoriesOnly:
                          description: |
                            Category:
                              - `true` — permitted
                              - `false` — forbidden

                              Not used in the sandbox
                          type: boolean
                        objectIDs:
                          type: array
                          description: Subcategory ID search
                          items:
                            type: integer
                            format: int64
                        brands:
                          type: array
                          description: Brand search
                          items:
                            type: string
                        imtID:
                          description: |
                            [Merged listing ID](https://dev.wildberries.ru/en/knowledge-base/articles/019d49a4-1320-71bb-9dac-8ba07e7177ce/working-with-items#merging-and-unmerging-listings) search
                          type: integer
                          format: int64
                    cursor:
                      description: |
                        Cursor
                      type: object
                      properties:
                        limit:
                          type: integer
                          maximum: 100
                          default: 10
                          description: Number of listings in the response
                          format: int64
                        updatedAt:
                          type: string
                          nullable: true
                          description: Update date and time
                        nmID:
                          type: integer
                          description: WB item number for the next listing page
                          format: int64
            example:
              settings:
                sort:
                  ascending: false
                filter:
                  textSearch: '4603743187500888'
                  allowedCategoriesOnly: true
                  tagIDs:
                  - 345
                  - 415
                  objectIDs:
                  - 235
                  - 67
                  brands:
                  - уллу
                  - EkkE
                  imtID: 328632
                  withPhoto: 0
                cursor:
                  updatedAt: '2023-12-06T11:17:00.96577Z'
                  nmID: 370870300
                  limit: 11
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostV2GetCardsListResponse200'
              example:
                cards:
                - nmID: 12345678
                  imtID: 123654789
                  nmUUID: 01bda0b1-5c0b-736c-b2be-d0a6543e9be
                  subjectID: 7771
                  subjectName: AKF системы
                  vendorCode: wb7f6mumjr1
                  kizMarked: true
                  brand: Тест
                  title: Тест-система
                  gtin: '04607009520001'
                  description: Тестовое описание
                  needKiz: false
                  photos:
                  - big: https://basket-10.wbbasket.ru/vol1592/part159206/159206280/images/big/1.webp
                    c246x328: https://basket-10.wbbasket.ru/vol1592/part159206/159206280/images/c246x328/1.webp
                    c516x688: https://basket-10.wbbasket.ru/vol1592/part159206/159206280/images/c516x688/1.webp
                    square: https://basket-10.wbbasket.ru/vol1592/part159206/159206280/images/square/1.webp
                    tm: https://basket-10.wbbasket.ru/vol1592/part159206/159206280/images/tm/1.webp
                  video: https://videonme-basket-12.wbbasket.ru/vol137/part22557/225577433/hls/1440p/index.m3u8
                  wholesale:
                    enabled: true
                    quantum: 112
                  dimensions:
                    length: 55
                    width: 40
                    height: 15
                    weightBrutto: 6.24
                    isValid: false
                  documents:
                    items:
                    - id: 019f3c09-8c1f-7063-aee4-c45969fb2dc5
