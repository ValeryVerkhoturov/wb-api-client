  /content/v2/cards/update:
    servers:
    - url: https://content-api.wildberries.ru
      description: |
        **Prod**
    - url: https://content-api-sandbox.wildberries.ru
      description: |
        **Sandbox**
    post:
      operationId: postV2CardsUpdate
      x-readonly-method: false
      x-category: content
      tags:
      - Items
      summary: Update Listings
      description: |-
        Edits listings. Also use it to add new sizes.

        The listing is overwritten when updated. So the request must also include those listing parameters that you are not going to update. To get their values, use [Listings](https://dev.wildberries.ru/openapi/item-management#tag/listings/operation/postV2GetCardsList) and [Listings in Trash](https://dev.wildberries.ru/openapi/item-management#tag/listings/operation/postV2GetCardsTrash).

        When the Listing is updated, the **documents** object is also completely overwritten. In the request, send the all documents data that should remain in the listing, including documents without changes.

        You cannot use this method to update or delete:
        - item size SKUs. You can only add additional SKUs
        - the `photos`, `video` and `tags` parameters
        - prices of items. The price can only be set if you add new sizes
        When adding a new size, specify its price using the `price` parameter. If no `price` is specified in the request, the size price will be `0`. In this case, you can update it using the methods:
        - [Set Prices and Discounts](https://dev.wildberries.ru/openapi/item-management#tag/pricesAndDiscounts/operation/postV2UploadTask), if [item](https://dev.wildberries.ru/openapi/item-management#tag/pricesAndDiscounts/operation/getV2ListGoodsFilter) has `"editablePriceSize":false`
        - [Set Size Prices](https://dev.wildberries.ru/openapi/item-management#tag/pricesAndDiscounts/operation/postV2UploadTaskSize), if [item](https://dev.wildberries.ru/openapi/item-management#tag/pricesAndDiscounts/operation/getV2ListGoodsFilter) has `"editablePriceSize":true`
        The dimensions of the items can only be specified in `centimeters`, and the weight of packed items must be specified in `kilograms`.

        If this method response is Success (`200`) but listing was not updated, check errors using [failed listings with errors](https://dev.wildberries.ru/openapi/item-management#tag/listings/operation/postV2CardsErrorList) method.
        With one request you can edit maximum 3000 listings (`nmID`). Maximum request size is 10 Mb.
        The process of synchronizing data with services may take up to 30 minutes. During this time, you can't add inventory to warehouses and set prices.
        To add documents to the listing, pass the document data in the `documents` request object.
        To update the added document, pass document ID `id` and data in the `documents` request object. To get the `id` use [listings](https://dev.wildberries.ru/item-management#tag/listings/operation/postV2GetCardsList) method.
        When the listing or document is changed, the validation is started again.

        Document validation is performed asynchronously and can take up to 3 days.
        You can update the listing again before completing the current validation. In this case, the validation will be started again, and the listing will retain its current status until the new validation is completed.
        If the listing was available for sale before the document was updated, it will be available until a new validation result is received. If the card has already been blocked, then after updating the data, it will remain blocked until a positive result of repeated validation is received.

        The validation results are displayed in the [listings](https://dev.wildberries.ru/openapi/item-management#tag/listings/operation/postV2GetCardsList), the `documents` object:
        - the result for each document in the `verdict` fields of the `items` object. If `verdict` is not returned in the response, the document validation is not completed yet.
        - the final overall result for the listing in the `overallVerdict` field. During the listing validation, not only the results of the document validation are taken into account, but also other data. For example, the data of required labeling codes and information from external registries. If `overallVerdict` is not returned in the response, the listing validation is not completed yet.

        The types of documents that you can add for the item are specified in [subcategory characteristics](https://dev.wildberries.ru/openapi/item-management#tag/categoriesSubcategoriesAndCharacteristics/operation/getV2ObjectCharcsSubjectId).

        Not all the documents that you can add are required and are being validated. You independently determine which permits are required for the item in accordance with the law.

        [Request limit](https://dev.wildberries.ru/openapi/api-information#tag/introduction/Rate-Limits) per one seller account:
        | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- |
        | 1 min | 10 requests | 6 s | 5 requests |

        Library doc: https://valeryverkhoturov.github.io/wb-api-client-docs/reference/api/items/post-content-v2-cards-update
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                - nmID
                - vendorCode
                - sizes
                minimum: 1
                maximum: 3000
                properties:
                  nmID:
                    type: integer
                    description: WB item number
                    format: int64
                  vendorCode:
                    type: string
                    description: Seller item number
                  kizMarked:
                    type: boolean
                    default: false
                    description: |
                      Confirmation that required labeling code [Chestny ZNAK](https://chestnyznak.ru/en) is specified:
                        - `true` — the seller confirms that required labeling code is applied to the item.
                        - `false` — the seller does not confirm that required labeling code is applied to the item. Pass `true` in the request to confirm that the item has required labeling code. The item will not pass validation if there is no confirmation from the seller that required labeling code is applied to the item.

                      To check if labeling code [Chestny ZNAK](https://chestnyznak.ru/en) is required, use the [Listings](./item-management#tag/listings/operation/postV2GetCardsList) method, the response field `needKiz`
                  brand:
                    type: string
                    description: Brand
                  title:
                    type: string
                    description: Item title
                    maxLength: 60
                  gtin:
                    type: string
                    description: "Additional GTIN. Specify this parameter if you have previously indicated the same GTIN in the `skus` parameter of one of the listings. It is not possible to specify the same GTIN in `skus` for different listings or item sizes.\n\n Only for sellers from the Russian"
                  description:
                    type: string
                    description: |-
                      Item description.
                      The maximum number of characters depends on the item category
                      Standard — 2000, minimum — 1000, maximum — 5000
                      More details about \*\*rules for filling out the listing\*\* in [Instructions](https://seller.wildberries.ru/instructions/ru/ru/material/how-to-create-card) category of sellers portal
                  dimensions:
                    description: |-
                      Dimensions and weight of the item \*\*with packaging\*\*.
                      Specify in `centimeters` and `kilograms` for any item.
                      The process of synchronizing new data with service may take up to 30 minutes
                    type: object
                    properties:
                      length:
                        type: integer
                        description: Length, cm
                        format: int64
                      width:
                        type: integer
                        description: Width, cm
                        format: int64
                      height:
                        type: integer
                        description: Height, cm
                        format: int64
                      weightBrutto:
                        type: number
                        description: "Weight, kg\nNumber of decimal places <=3"
                  documents:
                    type: object
                    description: Listing permits
                    properties:
                      items:
                        type: array
                        description: Permits list and their data
                        items:
                          allOf:
                          - type: object
                            properties:
                              id:
                                type: string
                                description: |-
                                  Document ID attached to the listing.
                                  Specify the `id` to rewrite previously attached document. The document ID is specified in the [listings](https://dev.wildberries.ru/item-management#tag/listings/operation/postV2GetCardsList).
                                  To add a new document, you do not need to specify the `id`.
                          - $ref: '#/components/schemas/documentsRequest'
                      excludeDocuments:
                        type: boolean
                        default: false
                        description: |
                          Seller confirmation that no documents are required for the item:
                            - `true` — yes, seller confirms that no documents are required. All values passed to `documents` will be replaced with empty values
                            - `false` — no, seller does not confirm that no documents are required

                          Whether the documents are required is checked when creating and changing the listing. If documents are required for the item and the value `true` is specified, the listing will not pass validation
                  characteristics:
                    type: array
                    description: |-
                      Item characteristics

                      Use the [Subcategory characteristics](./item-management#tag/categoriesSubcategoriesAndCharacteristics/operation/getV2ObjectCharcsSubjectId) method to get characteristics of the item
                    items:
                      type: object
                      required:
                      - id
                      - value
                      properties:
                        id:
                          type: integer
                          description: Characteristic ID
                          format: int64
                        value:
                          description: |-
                            Characteristic values.

                            Data type — array of strings or number — depends on the characteristic data type. For more details see the description of the `charcType` field in the [Subcategory characteristics](./item-management#tag/operation/getV2ObjectCharcsSubjectId) method.

                            The allowed number of values is specified in the `maxCount` field of the [Subcategory characteristics](./item-management#tag/operation/getV2ObjectCharcsSubjectId) method
                  sizes:
                    type: array
                    description: |-
                      Item sizes
                      If item has no sizes, send only SKUs
                    items:
                      type: object
                      properties:
                        chrtID:
                          type: integer
                          format: int64
                          description: |-
                            WB item number of this size
                            Required for existing sizes
                            If you add new size, do not send this ID
                        techSize:
                          type: string
                          description: Size (for example, XL, S, 45)
                        wbSize:
                          type: string
                          description: Russian size
                        price:
                          type: integer
                          description: |-
                            Price, ₽
                            Specified when adding the size
                          format: int64
                        skus:
                          type: array
                          items:
                            type: string
                          description: SKUs
            examples:
              UpdateListings:
                $ref: '#/components/examples/UpdateListings'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseItemList'
              example:
                data:
                error: false
                errorText: ''
