    PostV2GetCardsListResponse200:
      type: object
      properties:
        cards:
          type: array
          description: Listings
          items:
            type: object
            properties:
              nmID:
                type: integer
                description: WB item number
                format: int64
              imtID:
                type: integer
                description: |-
                  [Merged](https://dev.wildberries.ru/en/knowledge-base/articles/019d49a4-1320-71bb-9dac-8ba07e7177ce/working-with-items#merging-and-unmerging-listings) listing ID.
                  The same for all WB item number of group of merged listings.
                  Every listing has `imtID`, even if is not merged with any other listing
                format: int64
              nmUUID:
                type: string
                format: UUID
                description: Internal system ID of the listing
              subjectID:
                type: integer
                description: Subcategory ID
                format: int64
              subjectName:
                type: string
                description: Subcategory name
              vendorCode:
                type: string
                description: Seller item number
              brand:
                type: string
                description: Brand
              title:
                type: string
                description: Item title
              gtin:
                type: string
                description: "Additional GTIN. The field is returned only if an additional GTIN is specified.\n\n Only for sellers from the Russian"
              description:
                type: string
                description: Item description
              needKiz:
                description: |-
                  Is labeling code [Chestny ZNAK](https://chestnyznak.ru/en) required for the item:

                  - `false` — labeling code is not required

                  -`true` — labeling code is required
                type: boolean
              kizMarked:
                type: boolean
                default: false
                nullable: false
                description: |
                  Is there the confirmation from the seller that required labeling code [Chestny ZNAK](https://chestnyznak.ru/en) is applied to the item:
                    - `true` — yes
                    - `false` — no

                  Whether labeling code [Chestny ZNAK](https://chestnyznak.ru/en) is required is specified in the `needKiz` field
              photos:
                type: array
                description: Photo array
                items:
                  type: object
                  properties:
                    big:
                      description: URL of `900x1200` photo
                      type: string
                    c246x328:
                      description: URL of `248x328` photo
                      type: string
                    c516x688:
                      description: URL of `516x688` photo
                      type: string
                    square:
                      description: URL of `600x600` photo
                      type: string
                    tm:
                      description: URL of `75x100` photo
                      type: string
              video:
                type: string
                description: Video URL
              wholesale:
                type: object
                description: B2B sale
                properties:
                  enabled:
                    type: boolean
                    description: |
                      Is the item intended for sale only to B2B buyers:
                        - `true` — the item is intended for sale only to B2B buyers
                        - `false` — the item is intended for sale to B2B and B2C buyers
                  quantum:
                    type: number
                    format: uint64
                    description: Minimum number of items in one cart of B2B buyer. Only when `"enable":true`
              dimensions:
                description: Dimensions and weight of packed item in cm and kg
                type: object
                properties:
                  length:
                    type: integer
                    description: Length, cm
                    format: int64
                  width:
                    type: integer
                    description: Width, cm
                    format: int64
                  height:
                    type: integer
                    description: Height, cm
                    format: int64
                  weightBrutto:
                    type: number
                    description: "Weight, kg\nNumber of decimal places <=3"
                  isValid:
                    type: boolean
                    description: |
                      Potential inaccuracy of item dimensions:

                      - `true` — not detected. `"isValid": true` does not guarantee that the dimensions are correct. In some cases (for example, when creating a new item category), `"isValid": true` will be returned for any values except zero.

                      - `false` — the specified dimensions significantly differ from the average for the category (subcategory). it is recommended to double-check whether the item dimensions in the packaging are correctly specified in `centimeters`. The functionality of the listing, including the calculation of logistics and storage, will not be limited. Logistics and storage will continue to be calculated based on the current dimensions. Also, `"isValid": false` is returned when there are missing values or any dimension is zero.
              documents:
                type: object
                description: |-
                  Documents added to the listing.
                  Validation results for each document specified in `items`.
                  Validation result of the entire listing specified in `overallVerdict`
                properties:
                  items:
                    type: array
                    description: Document list and validation results for each document
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Document ID
                        type:
                          type: integer
                          description: |
                            Document type:
                              - `1` — Certificate of Conformity
                              - `2` — The Correspondence Declaration
                              - `3` — Certificate of Registration of SGR
                              - `4` — Registration Certificate
                              - `5` — Certificate of Registration of the Republic of Belarus
                              - `7` — Registration of a Pesticide
                              - `8` — Registration of an Agrochemical
                              - `9` — Medicine Registration Certificate
                          format: int64
                        number:
                          type: string
                          description: Document number
                        productNumber:
                          type: string
                          description: Additional document number
                        tradeName:
                          type: string
                          description: Trade name
                        applicant:
                          type: string
                          description: Representative of the medical device manufacturer
                        startDate:
                          type: string
                          description: Document start date and time
                        endDate:
                          type: string
                          description: Document end date and time
                        isEndless:
                          type: boolean
                          description: |
                            Is the document valid indefinitely:
                              - `true` — yes, the document is indefinite
                              - `false` — no, the document has an expiration date
                        verdict:
                          description: Document validation result. Returns when the document validation is completed
                          type: object
                          properties:
                            verified:
                              type: boolean
                              description: |
                                - `true` — the document is validated
                                - `false` — the document is not validated
                            status:
                              type: integer
                              description: |
                                Document validation result:
                                  - `1` — validation passed
                                  - `2` — validation failed
                              format: int64
                            reason:
                              $ref: '#/components/schemas/reasonDocument'
                            additionalData:
                              type: object
                              nullable: true
                              description: Additional data
                            createdAt:
                              type: string
                              description: Listing validation date
                        createdAt:
                          type: string
                          description: Date the document was added
                  overallVerdict:
                    type: object
                    description: |-
                      The overall result of the entire listing validation. Returns when the validation is completed.
                      The results of current documents validation and the overall result of the listing may vary. For example, a listing can pass validation if the required document passed validation, but the additional document failed
                    properties:
                      isFullyChecked:
                        type: boolean
                        description: |
                          - `true` — the listing is validated
                          - `false` — the listing is not validated
                      status:
                        type: integer
                        description: |
                          Listing validation result:
                            - `1` — validation passed
                            - `2` — validation failed
                        format: int64
                      reason:
                        $ref: '#/components/schemas/reasonListing'
                      createdAt:
                        type: string
                        description: Listing validation date and time
                  excludeDocuments:
                    type: boolean
                    description: |
                      Seller confirmation that no permits are required for the item:
                        - `true` — yes, seller confirms that no permits are required. All values passed to `documents` will be replaced with empty values
                        - `false` — no, seller does not confirm that no permits are required

                      Whether the permits are required is checked when creating and changing the listing. If permits are required for the item and the value `true` is specified, the listing will not pass validation
              characteristics:
                type: array
                description: Characteristics
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: Characteristic ID
                      format: int64
                    name:
                      type: string
                      description: Characteristic name
                    value:
                      description: Characteristic value
              sizes:
