                      format: int64
                      description: Size ID
                    techSize:
                      type: string
                      description: Size (for example, S or 42)
                    wbSize:
                      type: string
                      description: Russian size
                    skus:
                      type: array
                      description: SKU
                      items:
                        type: string
                        example: 12345Ejf5
              tags:
                description: Labels
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: Label ID
                      format: int64
                    name:
                      type: string
                      description: Label name
                    color:
                      type: string
                      description: |
                        Label color:
                          - `D1CFD7` — grey
                          - `FEE0E0` — red
                          - `ECDAFF` — purple
                          - `E4EAFF` — blue
                          - `DEF1DD` — green
                          - `FFECC7` — yellow
              createdAt:
                type: string
                description: Creation date and time
              updatedAt:
                type: string
                description: Update date and time
        cursor:
          type: object
          description: Paginator
          properties:
            updatedAt:
