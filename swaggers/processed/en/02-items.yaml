paths:
  /content/v2/object/parent/all:
    servers:
    - url: https://content-api.wildberries.ru
      description: |
        **Prod**
    - url: https://content-api-sandbox.wildberries.ru
      description: |
        **Sandbox**
    get:
      operationId: getV2ObjectParentAll
      x-readonly-method: true
      x-category: content
      security:
      - BearerAuth: []
      summary: Item Parent Categories
      description: |-
        Returns the list of all item parent categories

        [Request limit](https://dev.wildberries.ru/openapi/api-information#tag/introduction/Rate-Limits) per one seller account for all methods in the **Content** category:
        | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- |
        | 1 min | 100 requests | 600 ms | 5 requests |
        Exceptions are the methods:

        * [creating listings](https://dev.wildberries.ru/openapi/item-management#tag/listingItems/operation/postV2CardsUpload)
        * [creating listings with merge](https://dev.wildberries.ru/openapi/item-management#tag/listingItems/operation/postV2CardsUploadAdd)
        * [editing listings](https://dev.wildberries.ru/openapi/item-management#tag/listings/operation/postV2CardsUpdate)
        * [recovering product card from trash](https://dev.wildberries.ru/openapi/item-management#tag/listings/operation/postV2CardsRecover)
        * [getting item recommendation list](https://dev.wildberries.ru/openapi/item-management#tag/recommendations/operation/postV1RecommendationsList)
        * [setting item recommendations](https://dev.wildberries.ru/openapi/item-management#tag/recommendations/operation/postV1RecommendationsSet)

        ---

        In [Sandbox](https://dev.wildberries.ru/en/sandbox) — maximum of 1 request per second for all **Content** methods in total.

        Library doc: https://valeryverkhoturov.github.io/wb-api-client-docs/reference/api/items/get-content-v2-object-parent-all
      tags:
      - Items
      parameters:
      - name: locale
        in: query
        description: |
          Language for response of the `name` field:
            - `ru` — Russian
            - `en` — English
            - `zh` — Chinese

          Not used in the sandbox. The sandbox data is returned only in Russian
        schema:
          type: string
          example: en
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetV2ObjectParentAllResponse200'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseBodyContentError400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseBodyContentError403'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Response4XX'
              examples:
                Response403TokenCategory:
                  $ref: '#/components/examples/Response403TokenCategory'
        '429':
          $ref: '#/components/responses/429'
      x-tagKey: categoriesSubcategoriesAndCharacteristics
      x-original-tags:
      - Categories, Subcategories, and Characteristics
  /content/v2/object/all:
    servers:
    - url: https://content-api.wildberries.ru
      description: |
        **Prod**
    - url: https://content-api-sandbox.wildberries.ru
      description: |
        **Sandbox**
    get:
      operationId: getV2ObjectAll
      x-readonly-method: true
      x-category: content
      security:
      - BearerAuth: []
      summary: Subcategories List
      description: |-
        Returns the list of all available subcategories, parent categories and their IDs

        [Request limit](https://dev.wildberries.ru/openapi/api-information#tag/introduction/Rate-Limits) per one seller account for all methods in the **Content** category:
        | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- |
        | 1 min | 100 requests | 600 ms | 5 requests |
        Exceptions are the methods:

        * [creating listings](https://dev.wildberries.ru/openapi/item-management#tag/listingItems/operation/postV2CardsUpload)
        * [creating listings with merge](https://dev.wildberries.ru/openapi/item-management#tag/listingItems/operation/postV2CardsUploadAdd)
        * [editing listings](https://dev.wildberries.ru/openapi/item-management#tag/listings/operation/postV2CardsUpdate)
        * [recovering product card from trash](https://dev.wildberries.ru/openapi/item-management#tag/listings/operation/postV2CardsRecover)
        * [getting item recommendation list](https://dev.wildberries.ru/openapi/item-management#tag/recommendations/operation/postV1RecommendationsList)
        * [setting item recommendations](https://dev.wildberries.ru/openapi/item-management#tag/recommendations/operation/postV1RecommendationsSet)

        ---

        In [Sandbox](https://dev.wildberries.ru/en/sandbox) — maximum of 1 request per second for all **Content** methods in total.

        Library doc: https://valeryverkhoturov.github.io/wb-api-client-docs/reference/api/items/get-content-v2-object-all
      tags:
      - Items
      parameters:
      - name: locale
        in: query
        schema:
          type: string
          example: en
        description: |
          Language for response of the `name` field:
            - `ru` — Russian
            - `en` — English
            - `zh` — Chinese

          Not used in the sandbox. The sandbox data is returned only in Russian
      - name: name
        in: query
        schema:
          type: string
          example: Socks
        description: Search by item name (Socks), the search works by substring and can be conducted in any of the supported languages
      - name: limit
        in: query
        schema:
          type: integer
          example: 1000
          default: 30
          format: int64
        description: Number of search results, maximum 1,000
      - name: offset
        in: query
        schema:
          type: integer
          example: 5000
          default: 0
          format: int64
        description: How many results to skip. For example, with value `10`, the response will start with the 11 element
      - name: parentID
        in: query
        schema:
          type: integer
          example: 1000
          format: int64
        description: Subcategory parent category ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetV2ObjectAllResponse200'
              example:
                data:
                - subjectID: 2560
                  parentID: 479
                  subjectName: 3D очки
                  parentName: Электроника
                - subjectID: 1152
                  parentID: 858
                  subjectName: 3D-принтеры
                  parentName: Оргтехника
                error: false
                errorText: ''
                additionalErrors:
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
      x-tagKey: categoriesSubcategoriesAndCharacteristics
      x-original-tags:
      - Categories, Subcategories, and Characteristics
  /content/v2/object/charcs/{subjectId}:
    servers:
    - url: https://content-api.wildberries.ru
      description: |
        **Prod**
    - url: https://content-api-sandbox.wildberries.ru
