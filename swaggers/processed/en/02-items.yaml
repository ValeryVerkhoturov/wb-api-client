  requestBodies:
    SellerTaskRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                type: array
                description: "Items, prices and discounts. Maximum 1,000 items. Both price and discount can not be empty\n\nIf the new item price with discount is lower than the [threshold value](https://seller.wildberries.ru/instructions/ru/ru/material/price-quarantine#2ef3641a-5165-41db-9ac7-e4374c9fc3f1), the item will go into [price quarantine](https://seller.wildberries.ru/instructions/ru/ru/material/price-quarantine) and the price will not change. You will get the error in the [upload details](./item-management#tag/pricesAndDiscounts/operation/getV2HistoryGoodsTask).\n\nYou can edit price or discount using API or remove the price out of quarantine in [your account](https://seller.wildberries.ru/discount-and-prices/quarantine)"
                items:
                  $ref: '#/components/schemas/Item'
    SellerTaskRequestSize:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                description: "Sizes and prices. Maximum 1,000 sizes\n\nFor items with [size-based pricing](./item-management#tag/pricesAndDiscounts/operation/postV2UploadTaskSize), [quarantine](https://seller.wildberries.ru/discount-and-prices/quarantine) does not apply."
                type: array
                items:
                  $ref: '#/components/schemas/SizeGoodReq'
    SellerTaskRequestClubDisc:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                type: array
                description: "Items and WB Club discounts. Maximum 1,000 items.\n"
                items:
                  $ref: '#/components/schemas/ClubDiscReq'
    B2BWholesaleTaskRequest:
      required: true
      description: Setting wholesale discounts for B2B
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                type: array
                description: Items and wholesale discounts for B2B
                minItems: 1
                maxItems: 1000
                items:
                  type: object
                  required:
                  - nmId
                  - wholesaleDiscountThreshold
                  properties:
                    nmId:
                      type: integer
                      description: WB item number
                      example: 694707813
                      format: int64
                    wholesaleDiscountThreshold:
                      type: array
                      description: Wholesale discounts at different levels for B2B
                      items:
                        $ref: '#/components/schemas/WholesaleDiscountThresholdReq'
          example:
            data:
            - nmId: 1
              wholesaleDiscountThreshold:
              - minQuantity: 10
                wholesaleDiscount: 10
                level: 1
            - nmId: 694707813
              wholesaleDiscountThreshold:
              - minQuantity: 11
                wholesaleDiscount: 14
                level: 1
              - minQuantity: 18
                wholesaleDiscount: 19
                level: 3
    FilterPost:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - nmList
            properties:
              nmList:
                description: WB item numbers for search
                type: array
                minItems: 1
                maxItems: 1000
                items:
                  type: integer
                  format: int64
          example:
            nmList:
            - 26613989
            - 1348041
