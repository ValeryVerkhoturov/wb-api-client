openapi: 3.0.1
info:
  title: Customer Communication
  version: communication
  description: |-
    Management of customer inquiries and feedback, chats, and returns processing

    You can test the customer communication methods in the [sandbox](https://dev.wildberries.ru/en/sandbox). Also you can use [special methods](https://dev.wildberries.ru/en/docs/openapi-other/sandbox-environment#tag/questionsAndFeedbacks) in the sandbox for managing test feedbacks and questions

    You can learn how to use methods in business cases in the [instructions](https://dev.wildberries.ru/en/knowledge-base/articles/019d49a4-0b26-7620-8d0b-e3050b7cd01d/communicating-with-customers) on working with **Customer Communication** section
  x-file-name: communications
security:
- BearerAuth: []
tags:
- name: Questions
  x-displayName: Questions
  description: ''
  x-tagKey: questions
  x-description: |
    <div class="description_auth">
      To access the methods, use a <a href="./api-information#tag/authorization/How-to-create-a-personal-access-base-or-test-token">token</a> for the <strong>Feedbacks and Questions</strong> category
    </div>
- name: Feedbacks
  x-displayName: Feedbacks
  description: ''
  x-tagKey: feedbacks
  x-description: |
    <div class="description_auth">
      To access the methods, use a <a href="./api-information#tag/authorization/How-to-create-a-personal-access-base-or-test-token">token</a> for the <strong>Feedbacks and Questions</strong> category
    </div>
- name: Pinned Feedbacks
  x-displayName: Pinned Feedbacks
  description: ''
  x-tagKey: pinnedFeedbacks
  x-description: |
    <div class="description_auth">
      To access the methods, use a <a href="./api-information#tag/authorization/How-to-create-a-personal-access-base-or-test-token">token</a> for the <strong>Feedbacks and Questions</strong> category
    </div>

    Use these methods for:
      1. [Getting the list of pinned and unpinned feedbacks](./customer-communication#tag/pinnedFeedbacks/operation/getV1Pins)
      2. [Pinning feedbacks](./customer-communication#tag/pinnedFeedbacks/operation/postV1Pins). The method is available for [Jam subscription](https://seller.wildberries.ru/monetization/jam) or **Pin a feedback** option in the [Plan Builder](https://seller.wildberries.ru/tariff-constructor)
      3. [Unpinning feedbacks](./customer-communication#tag/pinnedFeedbacks/operation/deleteV1Pins)
      4. [Getting pinned and unpinned feedback number](./customer-communication#tag/pinnedFeedbacks/operation/getV1PinsCount)
      5. [Getting pinned feedback limits](./customer-communication#tag/pinnedFeedbacks/operation/getV1PinsLimits)
- name: Buyers Chat
  x-displayName: Buyers Chat
  description: ''
  x-tagKey: buyersChat
  x-description: |
    <div class="description_auth">
      To access the methods, use a <a href="./api-information#tag/authorization/How-to-create-a-personal-access-base-or-test-token">token</a> for the <strong>Buyers chat</strong> category
    </div>
    Buyers chat allows sellers and buyers to communicate directly.
      <br>Buyers can ask questions about items or file reports. We recommended to respond to the messages in the chat within 10 days.
      <br>The buyer always starts the chat. In one chat you can communicate only with one buyer.
    <div class="description_important">
      Processing requests for item refunds is only available in <a class="link" target="_blank" href="https://seller.wildberries.ru/chat-with-clients">the web version of buyers chat</a>.
    </div>
      <br>

    Chat operations:
      1. [Get a chats list](./customer-communication#tag/buyersChat/operation/getV1SellerChats). Save the chat ID in your database — this will allow you to update the chat information when receiving events.
      2. [Get chat events](./customer-communication#tag/buyersChat/operation/getV1SellerEvents): messages. New chats will have the `isNewChat` parameter set to `true`.
      3. [Send messages to the chat](./customer-communication#tag/buyersChat/operation/postV1SellerMessage)
- name: Buyers Returns
  x-displayName: Buyers Returns
  description: ''
  x-tagKey: buyersReturns
  x-description: |
    <div class="description_auth">
      To access the methods, use a <a href="./api-information#tag/authorization/How-to-create-a-personal-access-base-or-test-token">token</a> for the <strong>Buyers returns</strong> category
    </div>
paths:
  /api/v1/new-feedbacks-questions:
    servers:
    - url: https://feedbacks-api.wildberries.ru
      description: |
        **Prod**
    - url: https://feedbacks-api-sandbox.wildberries.ru
      description: |
        **Sandbox**
    get:
      operationId: getV1NewFeedbacksQuestions
      x-readonly-method: true
      x-category: questionsandfeedback
      security:
      - BearerAuth: []
      summary: Unseen Feedbacks and Questions
      description: |-
        The method displays information about the seller unseen feedbacks and questions

        [Request limit](https://dev.wildberries.ru/openapi/api-information#tag/introduction/Rate-Limits) per one seller account for all methods in the **Feedbacks and Questions** category:
        | Type | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- | --- |
        | Personal | 1 s | 3 requests | 333 ms | 6 requests |
        | Service | 1 s | 3 requests | 333 ms | 6 requests |
        | Base with secret | 1 s | 3 requests | 333 ms | 6 requests |
        | Base | 1 h | 5 requests | 12 min | 1 request |

        Library doc: https://valeryverkhoturov.github.io/wb-api-client-docs/reference/api/communications/get-api-v1-new-feedbacks-questions
      tags:
      - Communications
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetV1NewFeedbacksQuestionsResponse200'
        '401':
          $ref: '#/components/responses/401'
        '402':
          $ref: '#/components/responses/402'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseFeedbackQuestionErr'
              examples:
                FeedbackErr403:
                  $ref: '#/components/examples/FeedbackErr403'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Response4XX'
              examples:
                Response403TokenCategory:
                  $ref: '#/components/examples/Response403TokenCategory'
        '429':
          $ref: '#/components/responses/429'
      x-tagKey: questions
      x-original-tags:
      - Questions
  /api/v1/questions/count-unanswered:
    servers:
    - url: https://feedbacks-api.wildberries.ru
      description: |
        **Prod**
    - url: https://feedbacks-api-sandbox.wildberries.ru
      description: |
        **Sandbox**
    get:
      operationId: getV1QuestionsCountUnanswered
      x-readonly-method: true
      x-category: questionsandfeedback
      security:
      - BearerAuth: []
      summary: Unanswered Questions
      description: |-
        The method allows you to get the number of unanswered questions for today and for all time

        [Request limit](https://dev.wildberries.ru/openapi/api-information#tag/introduction/Rate-Limits) per one seller account for all methods in the **Feedbacks and Questions** category:
        | Type | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- | --- |
        | Personal | 1 s | 3 requests | 333 ms | 6 requests |
        | Service | 1 s | 3 requests | 333 ms | 6 requests |
        | Base with secret | 1 s | 3 requests | 333 ms | 6 requests |
        | Base | 1 h | 5 requests | 12 min | 1 request |

        Library doc: https://valeryverkhoturov.github.io/wb-api-client-docs/reference/api/communications/get-api-v1-questions-count-unanswered
      tags:
      - Communications
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetV1QuestionsCountUnansweredResponse200'
        '401':
          $ref: '#/components/responses/401'
        '402':
          $ref: '#/components/responses/402'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseFeedbackQuestionErr'
              examples:
                FeedbackErr403:
                  $ref: '#/components/examples/FeedbackErr403'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Response4XX'
              examples:
                Response403TokenCategory:
                  $ref: '#/components/examples/Response403TokenCategory'
        '429':
          $ref: '#/components/responses/429'
      x-tagKey: questions
      x-original-tags:
      - Questions
  /api/v1/questions/count:
    servers:
    - url: https://feedbacks-api.wildberries.ru
      description: |
        **Prod**
    - url: https://feedbacks-api-sandbox.wildberries.ru
      description: |
        **Sandbox**
    get:
      operationId: getV1QuestionsCount
      x-readonly-method: true
      x-category: questionsandfeedback
      security:
      - BearerAuth: []
      summary: Number of Questions
      description: |-
        The method allows to get the number of questions for requested period

        [Request limit](https://dev.wildberries.ru/openapi/api-information#tag/introduction/Rate-Limits) per one seller account for all methods in the **Feedbacks and Questions** category:
        | Type | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- | --- |
        | Personal | 1 s | 3 requests | 333 ms | 6 requests |
        | Service | 1 s | 3 requests | 333 ms | 6 requests |
        | Base with secret | 1 s | 3 requests | 333 ms | 6 requests |
        | Base | 1 h | 5 requests | 12 min | 1 request |

        Library doc: https://valeryverkhoturov.github.io/wb-api-client-docs/reference/api/communications/get-api-v1-questions-count
      tags:
      - Communications
      parameters:
      - name: dateFrom
        in: query
        description: The start date of the period in Unix timestamp format
        schema:
          type: integer
          example: 1688465092
          format: int64
      - name: dateTo
        in: query
        description: The end date of the period in Unix timestamp format
        schema:
          type: integer
          example: 1688465092
          format: int64
      - name: isAnswered
        in: query
        description: |
          If the question was answered:
            - `true` — yes
            - `false` — no
        schema:
          type: boolean
          default: true
          example: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetV1QuestionsCountResponse200'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseFeedbackQuestionErr'
              examples:
                IsAnsweredErr400:
                  $ref: '#/components/examples/IsAnsweredErr400'
                DateFromErr400:
                  $ref: '#/components/examples/DateFromErr400'
                DateToErr400:
                  $ref: '#/components/examples/DateToErr400'
        '401':
          $ref: '#/components/responses/401'
        '402':
          $ref: '#/components/responses/402'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseFeedbackQuestionErr'
              examples:
                FeedbackErr403:
                  $ref: '#/components/examples/FeedbackErr403'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Response4XX'
              examples:
                Response403TokenCategory:
                  $ref: '#/components/examples/Response403TokenCategory'
        '429':
          $ref: '#/components/responses/429'
      x-tagKey: questions
      x-original-tags:
      - Questions
  /api/v1/questions:
    servers:
    - url: https://feedbacks-api.wildberries.ru
      description: |
        **Prod**
    - url: https://feedbacks-api-sandbox.wildberries.ru
      description: |
        **Sandbox**
    get:
      operationId: getV1Questions
      x-readonly-method: true
      x-category: questionsandfeedback
      security:
      - BearerAuth: []
      summary: Questions List
      description: |-
        The method allows you to get a list of questions by the specified parameters with pagination and sorting.
         It is possible to get a maximum of 10,000 questions per query

        [Request limit](https://dev.wildberries.ru/openapi/api-information#tag/introduction/Rate-Limits) per one seller account for all methods in the **Feedbacks and Questions** category:
        | Type | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- | --- |
        | Personal | 1 s | 3 requests | 333 ms | 6 requests |
        | Service | 1 s | 3 requests | 333 ms | 6 requests |
        | Base with secret | 1 s | 3 requests | 333 ms | 6 requests |
        | Base | 1 h | 5 requests | 12 min | 1 request |

        Library doc: https://valeryverkhoturov.github.io/wb-api-client-docs/reference/api/communications/get-api-v1-questions
      tags:
      - Communications
      parameters:
      - name: isAnswered
        in: query
        description: |
          The question is answered:
            - `true` — yes
            - `false` — no
        schema:
          type: boolean
        required: true
      - name: nmId
        in: query
        description: WB item number
        schema:
          type: integer
          format: int64
      - name: take
        in: query
        description: |
          Number of requested questions (the maximum possible value for the parameter is 10,000, and the total amount of `take` and `skip` parameters must not exceed 10,000)
        schema:
          type: integer
          format: int64
        required: true
      - name: skip
        in: query
        description: |
          Number of questions to skip (maximum possible value for the parameter is 10,000, and the total amount of `take` and `skip` parameters must not exceed 10,000)
        schema:
          type: integer
          format: int64
        required: true
      - name: order
        in: query
        description: Sorting questions by date (`dateAsc`/`dateDesc`)
        schema:
          type: string
      - name: dateFrom
        allowEmptyValue: true
        in: query
        description: The start date of the period in Unix timestamp format
        schema:
          type: integer
          example: 1688465092
          format: int64
      - name: dateTo
        in: query
        description: The end date of the period in Unix timestamp format
        schema:
          type: integer
          example: 1688465092
          format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetV1QuestionsResponse200'
              example:
                data:
                  countUnanswered: 24
                  countArchive: 508
                  questions:
                  - id: 2ncBtX4B9I0UHoornoqG
                    text: Question text
                    createdDate: '2022-02-01T11:18:08.769513469Z'
                    state: suppliersPortalSynch
                    answer:
                    productDetails:
                      imtId: 11157265
                      nmId: 14917842
                      productName: Coffee
                      supplierArticle: '123401'
                      supplierName: ' ГП Реклама и услуги'
                      brandName: Nescafe
                    wasViewed: false
                    isWarned: false
                error: false
                errorText: ''
                additionalErrors:
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseFeedbackQuestionErr'
              examples:
                FeedbackErr400:
                  $ref: '#/components/examples/FeedbackErr400'
        '401':
          $ref: '#/components/responses/401'
        '402':
          $ref: '#/components/responses/402'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseFeedbackQuestionErr'
              examples:
                FeedbackErr403:
                  $ref: '#/components/examples/FeedbackErr403'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Response4XX'
              examples:
                Response403TokenCategory:
                  $ref: '#/components/examples/Response403TokenCategory'
        '429':
          $ref: '#/components/responses/429'
      x-tagKey: questions
      x-original-tags:
      - Questions
    patch:
      operationId: patchV1Questions
      x-readonly-method: false
      x-category: questionsandfeedback
      security:
      - BearerAuth: []
      summary: Working with Questions
      description: |-
        Depending on the request body, you can:
        - View question.
        - Reject question.
        - Answer question or edit the answer

        All seller responses undergo preliminary moderation before publication

        It is possible to edit a response to a question within 2 months (60 days), after the response has been submitted and only once

        [Request limit](https://dev.wildberries.ru/openapi/api-information#tag/introduction/Rate-Limits) per one seller account for all methods in the **Feedbacks and Questions** category:
        | Type | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- | --- |
        | Personal | 1 s | 3 requests | 333 ms | 6 requests |
        | Service | 1 s | 3 requests | 333 ms | 6 requests |
        | Base with secret | 1 s | 3 requests | 333 ms | 6 requests |
        | Base | 1 h | 5 requests | 12 min | 1 request |

        Library doc: https://valeryverkhoturov.github.io/wb-api-client-docs/reference/api/communications/patch-api-v1-questions
      tags:
      - Communications
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                required:
                - id
                - wasViewed
                properties:
                  id:
                    description: Question ID
                    type: string
                    example: n5um6IUBQOOSTxXoo0gV
                  wasViewed:
                    description: If the question was viewed
                    type: boolean
                    example: true
              - type: object
                required:
                - id
                - answer
                - state
                properties:
                  id:
                    type: string
                    description: Question ID
                    example: n5um6IUBQOOSTxXoo0gV
                  answer:
                    type: object
                    required:
                    - text
                    properties:
                      text:
                        type: string
                        description: Answer text
                        example: answer text
                  state:
                    type: string
                    description: |
                      - `none` - question rejected by seller (this question doesn't appear on the buyer portal).
                      - `wbRu` - answer provided, the question is displayed on the buyers site.
            examples:
              ViewQuestion:
                description: View question
                value:
                  id: n5um6IUBQOOSTxXoo0gV
                  wasViewed: true
              RejectQuestion:
                description: Reject question
                value:
                  id: n5um6IUBQOOSTxXoo0gV
                  answer:
                    text: текст ответа
                  state: none
              AnswerQuestionOrEditAnswer:
                description: Answer question or edit the answer
                value:
                  id: n5um6IUBQOOSTxXoo0gV
                  answer:
                    text: текст ответа
                  state: wbRu
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatchV1QuestionsResponse200'
              example:
                data:
                error: false
                errorText: ''
                additionalErrors:
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseFeedbackQuestionErr'
              examples:
                FeedbackErr400:
                  $ref: '#/components/examples/FeedbackErr400'
        '401':
          $ref: '#/components/responses/401'
        '402':
          $ref: '#/components/responses/402'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseFeedbackQuestionErr'
              examples:
                FeedbackErr403:
                  $ref: '#/components/examples/FeedbackErr403'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Response4XX'
              examples:
                Response403TokenCategory:
                  $ref: '#/components/examples/Response403TokenCategory'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseFeedbackQuestionErr'
              examples:
                FeedbackErr404:
                  $ref: '#/components/examples/FeedbackErr404'
        '422':
          description: Error processing request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseFeedbackQuestionErr'
              examples:
                ResponsePatchQuestion:
                  $ref: '#/components/examples/ResponsePatchQuestion'
        '429':
          $ref: '#/components/responses/429'
      x-tagKey: questions
      x-original-tags:
      - Questions
  /api/v1/question:
    servers:
    - url: https://feedbacks-api.wildberries.ru
      description: |
        **Prod**
    - url: https://feedbacks-api-sandbox.wildberries.ru
      description: |
        **Sandbox**
    get:
      operationId: getV1Question
      x-readonly-method: true
      x-category: questionsandfeedback
      security:
