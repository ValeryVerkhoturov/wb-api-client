                  text: Хороший карандаш? Когда еще поставите?
                  createdDate: '2025-01-27T11:38:21.202143857Z'
                  state: wbRu
                  answer:
                    text: На следующей неделе
                    editable: true
                    createDate: '2025-07-28T08:24:37.187113704Z'
                  productDetails:
                    imtId: 202306781
                    nmId: 224747484
                    productName: Карандаш с ластиком
                    supplierArticle: 12113156uw
                    supplierName: ''
                    brandName: Brand
                  wasViewed: true
                  isWarned: false
                error: false
                errorText: ''
                additionalErrors:
        '401':
          $ref: '#/components/responses/401'
        '402':
          $ref: '#/components/responses/402'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseFeedbackQuestionErr'
              examples:
                FeedbackErr403:
                  $ref: '#/components/examples/FeedbackErr403'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Response4XX'
              examples:
