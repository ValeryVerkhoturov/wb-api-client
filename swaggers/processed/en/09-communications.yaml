        '422':
          description: Error processing request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseFeedbackQuestionErr'
              examples:
                responseGetQuestionByIdErrEx:
                  $ref: '#/components/examples/ResponseGetQuestionByIdErrEx'
        '429':
          $ref: '#/components/responses/429'
      x-tagKey: questions
      x-original-tags:
      - Questions
