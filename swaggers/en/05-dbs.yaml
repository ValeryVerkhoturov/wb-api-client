    post:
      operationId: postV3DbsOrdersStatusInfo
      x-readonly-method: true
      x-category: marketplace
      security:
        - HeaderApiKey: []
      tags:
        - DBS Assembly Orders
      summary: Get Assembly Order Statuses
      description: |
        Returns the statuses of [assembly orders](/openapi/dbs#tag/dbsAssemblyOrders) based on the list of assembly order IDs.

        `supplierStatus` is a status of an order. The trigger for its change is the action of the seller himself.<br>
        Possible values for this field are:
        | Status   | Description               | How to move an order to this status   |
        | -------  | ---------                 | --------------------------------------|
        | `new`      | **New order** | |
        | `confirm`  | **Order on assembly**      |  [Transfer to assembly](/openapi/orders-dbs?locale=ru#tag/dbsAssemblyOrders/operation/postV3DbsOrdersStatusConfirm)
        | `deliver`  | **Order on delivery**<br>    | [Transfer to delivery](/openapi/dbs#tag/dbsAssemblyOrders/operation/postV3DbsOrdersStatusDeliver)
        | `receive`  | **Received by the buyer**<br>       | [Notify that the order has been accepted by the buyer](/openapi/dbs#tag/dbsAssemblyOrders/operation/postV3DbsOrdersStatusReceive) <br>
        | `reject`   | **Declined upon receipt**<br>           |  [Notify that the buyer has declined the order](/openapi/dbs#tag/dbsAssemblyOrders/operation/postV3DbsOrdersStatusReject)
        | `cancel`   | **Canceled by the seller**   |  [Cancel the order](/openapi/dbs#tag/dbsAssemblyOrders/operation/postV3DbsOrdersStatusCancel)
        | `cancel_missed_call` | **Cancellation due to unreachable buyer**<br> | The status changes automatically |

        `wbStatus` is a status of an order on the Wildberries side.<br>
        Possible values for this field are:
        - `waiting` — assembly order in work
        - `sold` — the buyer got the order
        - `canceled` — assembly order canceled
        - `canceled_by_client` — the buyer canceled the order
        - `declined_by_client` — the buyer canceled the order in the first hour <br> Cancellation is available to the buyer in the first hour from the moment of order, if the order is not transferred to confirm status.
        - `defect` — order canceled due to a defect
        - `ready_for_pickup` — the order arrived the pickup point
        - `canceled_by_missed_call`— cancellation due to unreachable buyer. For delivery by seller

