    api.BatchErrorFinalPriceResponse:
      required:
        - code
        - detail
      properties:
        code:
          type: integer
          description: |
            Error code:
              - `404` — `NotFound`
              - `400` — `StatusMismatch`
              - `422` — `PriceNotCalculated`
          example: 404
        detail:
          type: string
          description: |
            - `NotFound` — the assembly order is not found (`404`)
            - `StatusMismatch` — operation is not possible for this assembly order status (`400`)
            - `PriceNotCalculated` — operation is not available for assembly orders created before 23.07.2026 (`422`)
          example: NotFound
      type: object
    api.BatchErrorDeliverResponse:
      properties:
        code:
          type: integer
          description: |
            Error code:
              - `404`
              - `409`
          example: 404
        detail:
          type: string
          description: |
            - `NotFound` —  assembly order is not found
            - `StatusMismatch` — operation is not possible for this assembly order status
            - `ImeiIsNotFilled` — IMEI is not filled
            - `MetaValidationFail` — label identifiers validation errors
          example: MetaValidationFail
        metaDetails:
          type: array
          description: Label identifiers validation error details
          items:
            type: object
            properties:
              key:
                type: string
                description: Label identifier
                example: sgtin
              value:
                type: string
                description: Label identifier value
                example: '1234567890'
              decision:
                type: string
                description: |
                  Статус проверки:
                  - `sgtin`
                    - `sgtinInvalidFormat` — Invalid format
                    - `sgtinNotFound` — Label identifier not found in [Chestny ZNAK](https://chestnyznak.ru/en/)
                    - `sgtinEmitted` —  Label identifier has been issued
                    - `sgtinApplied` — Putting into circulation not completed
                    - `sgtinWrittenOff` — Written off
                    - `sgtinRetired` — Retired
                    - `sgtinWithdrawn` — Withdrawn
                    - `sgtinDisaggregation` — Disaggregation
                    - `sgtinDisaggregated` — Disaggregated
                    - `sgtinAppliedNotPaid` — Not paid
                    - `pending` — Label identifier for inspection
                example: sgtinEmitted
      type: object
    api.BatchErrorResponse:
