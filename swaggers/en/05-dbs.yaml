    post:
      operationId: postV3DbsOrdersMetaCustomsDeclaration
      x-readonly-method: false
      x-category: marketplace
      security:
        - HeaderApiKey: []
      tags:
        - DBS Label Identifiers
      summary: Add Custom Declaration to the Orders
      description: |
        Sets the customs declaration numbers and numeric codes of the countries of origin for [assembly order label identifiers](/openapi/dbs#tag/dbsLabelIdentifiers/operation/postV3DbsOrdersMetaDetails). One assembly order can have only one customs declaration number.<br>
        Customs declaration number can only be added if all the conditions are met:
          - the assembly order has the B2B sale attribute — `"isB2b": true` in the response of the method [getting new assembly orders](/openapi/dbs#tag/dbsAssemblyOrders/operation/getV3DbsOrdersNew)
          - the assembly order is in `confirm` or `deliver` [statuses](/openapi/dbs#tag/dbsAssemblyOrders/operation/postV3DbsOrdersStatusInfo)
          - the `customsDeclaration` field is returned in the response of the [Get order label identifiers](/openapi/dbs#tag/dbsLabelIdentifiers/operation/postV3DbsOrdersMetaDetails) method

        <div class="description_limit">
        <a href="/openapi/api-information#tag/introduction/Rate-Limits">Request limit</a> per one seller account for all methods for <strong>adding DBS label identifiers</strong>:

        | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- |
        | 1 min | 500 requests | 120 ms | 20 requests |

        One request with <code>4XX</code> response codes is counted as 10 requests.

        <hr>

        In <a href='/en/sandbox'>Sandbox</a> — maximum of 1 request per second for all <strong>Marketplace</strong> methods in total.

        </div>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orders
              properties:
                orders:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    properties:
                      customsDeclaration:
                        type: string
                        minLength: 17
                        maxLength: 29
                        description: Customs declaration number
                        example: 10704010/010624/0000302
                      orderId:
                        type: integer
                        description: Assembly order ID
                      originCountryCode:
                        type: string
                        description: |
                          Numeric code of the country of origin according to [Russian classification of countries of the world](https://esnsi.gosuslugi.ru/classifiers/16269). Required only for assembly orders with the B2B sale indicator `"isB2b": true`
                        maxLength: 3
                        example: '643'
                    required:
                      - customsDeclaration
                      - orderId
                      - originCountryCode
      responses:
