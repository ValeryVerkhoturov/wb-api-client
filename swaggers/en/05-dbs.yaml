    DbsOnlyClientInfo:
      required:
        - replacementPhone
        - phone
        - firstName
        - fullName
        - additionalPhones
        - replacementAdditionalPhones
        - additionalPhoneCodes
        - orderID
        - phoneCode
      properties:
        replacementPhone:
          type: string
          description: |
            Replacement phone number to contact the buyer. <br>
            An empty value `""` means that the number is not assigned yet
          example: '79871234567'
          nullable: false
        phone:
          type: string
          description: |
            Backup replacement phone number to contact the buyer. <br>
            Use if the replacement number from `replacementPhone` is unavailable.
            To contact the buyer, dial this number and the extension code from `phoneCode`. <br>
            An empty value `""` means that the number is not assigned yet
          example: '+79871234567'
          nullable: false
        firstName:
          type: string
          description: First name
          nullable: false
        fullName:
          type: string
          description: Full name, used for paperwork. For example, documents for a car
          example: Иванов Иван Иванович
          nullable: false
        additionalPhones:
          nullable: false
          type: array
          items:
            type: string
            example: '79871234567'
          description: |
            Additional phone numbers to contact the buyer. <br>
            Use it to call the buyer, if the main number from `phone` is unavailable.<br>
            An empty value means that the number is not specified
        replacementAdditionalPhones:
          nullable: false
          type: array
          items:
            type: string
            example: '79871234567'
          description: |
            Additional replacement phone numbers to contact the buyer.<br>
            An empty value means that the number is not specified
        orderID:
          type: integer
          description: Assembly order ID
          example: 134567
        phoneCode:
          type: integer
          description: |
            Extension phone code. <br>
            An empty value `""` means that the code is not assigned yet
          example: 1234567
          nullable: false
        additionalPhoneCodes:
          nullable: false
          type: array
          items:
            type: string
          description: |
            Additional extension codes. <br>
            Use if you couldn't reach the buyer using the extension code from `phoneCode`.<br>
            An empty value `""` means that the code is not assigned yet
          example:
            - '12345'
            - '65498'
      type: object
