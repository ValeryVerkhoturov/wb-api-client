        - service
      summary: Add Items to Draft
      description: |

        <div class="description_token">
            Method is <a href="/openapi/api-information#tag/authorization/Rules-for-using-API-access-tokens">available</a> by
                <strong>Personal</strong> token, 
                <strong>Service</strong> token
        </div>

        Adds items to the specified supply draft.

        <div class="description_important">

        The method works on the principle of atomicity:
          - if all skus are successfully validated, all items will be added to the draft. The response will return <code>{"results":[]}</code>
          - if at least one sku is not validated, no items will be added to the draft. The response will return a list of invalid skus

        </div>

        <div class="description_limit">
        <a href="/openapi/api-information#tag/introduction/Rate-Limits">Request limit</a> per one seller account:

        | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- |
        | 1 min | 30 requests | 2 s | 10 requests |
        </div>
      tags:
        - Supply Drafts
      parameters:
        - name: draftId
          in: path
          description: Draft ID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/models.DraftAdditemsRequest'
            example:
              items:
                - quantity: 1
                  sku: '1234567'
                - quantity: 1
                  sku: '2000000512907'
      responses:
        '200':
          description: |
            Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.DraftAddItemsErrorResponse'
              examples:
                invalidSku:
                  $ref: '#/components/examples/InvalidSku'
