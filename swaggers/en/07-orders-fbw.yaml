openapi: 3.0.1
info:
  title: FBW Supplies
  version: ordersfbw
  description: |
    <div class="api-block">

    This section describes the methods for getting:
      - [information for forming supplies](/openapi/orders-fbw#tag/informationForFormingSupplies)
      - [supplies information](/openapi/orders-fbw#tag/suppliesInformation)

    </div>
  x-file-name: orders-fbw
security:
  - HeaderApiKey: []
tags:
  - name: Information for Forming Supplies
    x-displayName: Information for Forming Supplies
    description: ''
    x-tagKey: informationForFormingSupplies
    x-description: |
      <div class="description_auth">
        To access the methods, use a <a href="./api-information#tag/authorization/How-to-create-a-personal-access-base-or-test-token">token</a> for the <strong>Supplies</strong> category
      </div>

      Getting information for forming supplies to WB warehouses:
        1. [Acceptance options](./orders-fbw#tag/informationForFormingSupplies/operation/postV1AcceptanceOptions)
        2. [Warehouses list](./orders-fbw#tag/informationForFormingSupplies/operation/getV1Warehouses)
        3. [Transit directions](./orders-fbw#tag/informationForFormingSupplies/operation/getV1TransitTariffs)
  - name: Supplies Information
    x-displayName: Supplies Information
    description: ''
    x-tagKey: suppliesInformation
    x-description: |
      <div class="description_auth">
        To access the methods, use a <a href="./api-information#tag/authorization/How-to-create-a-personal-access-base-or-test-token">token</a> for the <strong>Supplies</strong> category
      </div>

      Getting information about item supplies for storage in WB warehouses:
        1. [Supplies list](./orders-fbw#tag/suppliesInformation/operation/postV1Supplies)
        2. [Supply details](./orders-fbw#tag/suppliesInformation/operation/getV1SuppliesId)
        3. [Supply items](./orders-fbw#tag/suppliesInformation/operation/getV1SuppliesIdGoods)
        4. [Supply package](./orders-fbw#tag/suppliesInformation/operation/getV1SuppliesIdPackage)
  - name: Supply Drafts
    x-displayName: Supply Drafts
    description: ''
    x-tagKey: supplyDrafts
    x-description: |
      <div class="description_auth">
        To access the methods, use a <a href="./api-information#tag/authorization/How-to-create-a-personal-access-base-or-test-token">token</a> for the <strong>Supplies</strong> category
      </div>

      Methods for working with supply drafts:
        1. [Create Draft](./orders-fbw#tag/supplyDrafts/operation/postV1Drafts)
        2. [Add Items to Draft](./orders-fbw#tag/supplyDrafts/operation/postV1DraftsDraftIdItems)
        3. [Drafts List](./orders-fbw#tag/supplyDrafts/operation/getV1Drafts)
        4. [Items List in Draft](./orders-fbw#tag/supplyDrafts/operation/getV1DraftsDraftIdItems)
        5. [Delete Items from Draft](./orders-fbw#tag/supplyDrafts/operation/deleteV1DraftsDraftIdItems)
        6. [Delete Draft](./orders-fbw#tag/supplyDrafts/operation/deleteV1DraftsDraftId)
paths:
  /api/v1/acceptance/options:
    servers:
      - url: https://supplies-api.wildberries.ru
    post:
      operationId: postV1AcceptanceOptions
      x-readonly-method: true
      x-category: supplies
      security:
        - HeaderApiKey: []
      tags:
        - Information for Forming Supplies
      summary: Acceptance Options
      description: |
        The method is [temporary disabled](/en/release-notes?id=570)

        <div class="description_limit">
        <a href="/openapi/api-information#tag/introduction/Rate-Limits">Request limit</a> per one seller account:


        | Type | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- | --- |
        | Personal | 1 min | 6 requests | 10 s | 6 requests |
        | Service | 1 min | 6 requests | 10 s | 6 requests |
        | Base with secret | 1 min | 6 requests | 10 s | 6 requests |
        | Base | 1 h | 2 requests | 30 min | 1 request |
        </div>
      parameters:
        - name: warehouseID
          in: query
          description: Warehouse ID. <br> If the parameter is not specified, data for all warehouses is returned. <br> **Maximum is one value**
          schema:
            type: integer
          example: 507
      requestBody:
        content:
          application/json:
            schema:
              type: array
              maxItems: 5000
              items:
                $ref: '#/components/schemas/models.Good'
            examples:
              RequestOptions:
                $ref: '#/components/examples/RequestOptions'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.OptionsResultModel'
              examples:
                Response:
                  $ref: '#/components/examples/OptionsResponse'
        '400':
          description: Incorrect request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorModel'
              examples:
                BadWarehouseIDsParam:
                  $ref: '#/components/examples/Response400Options'
        '401':
          $ref: '#/components/responses/401'
        '402':
          $ref: '#/components/responses/402'
        '403':
          $ref: '#/components/responses/403'
        '404':
          description: Not found
        '429':
          $ref: '#/components/responses/429'
