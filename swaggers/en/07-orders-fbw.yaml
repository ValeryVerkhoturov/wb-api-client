  /api/supplies/v1/discrepancies/{supplyId}:
    servers:
      - url: https://supplies-api.wildberries.ru
    get:
      operationId: getV1SuppliesSupplyIdDiscrepanciesQuantity
      x-readonly-method: true
      x-category: supplies
      x-token-types:
        - personal
        - service
      tags:
        - Supplies Information
      summary: Supply Discrepancies
      description: |

        <div class="description_token">
            Method is <a href="/openapi/api-information#tag/authorization/Rules-for-using-API-access-tokens">available</a> by
                <strong>Personal</strong> token, 
                <strong>Service</strong> token
        </div>

        The method returns information about discrepancies between the declared and actual item quantity in the supply.
        <br>
        Available for supplies accepted no more than one year ago.
        <br><br>
        **Discrepancy types:**
        <br><br>
        Discrepancy upwards:<br><br>
        1. Excess of items with the declared SKU:
          - `"discrepancyType": "surplus"`
          - `"discrepancyLabel": "surplus"`
        2. Excess of items with a SKU that does not match the declared one:
          - `"discrepancyType": "surplus"`
          - `"discrepancyLabel": "re-sorting"`

        Discrepancy downwards:<br><br>
        1. Missing items:
          - `"discrepancyType": "shortage"`
          - `"discrepancyLabel": "shortage"`
        2. Some SKUs do not match the declared ones:
          - `"discrepancyType": "shortage"`
          - `"discrepancyLabel": "re-sorting"`


        <div class="description_limit">
        <a href="/openapi/api-information#tag/introduction/Rate-Limits">Request limit</a> per one seller account:

        | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- |
        | 1 min | 1 request | 1 min | 1 request |
        </div>
      parameters:
        - name: supplyId
          in: path
          description: Supply ID
          required: true
          schema:
            type: string
            format: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/models.ItemDiscrepancyResponse'
              examples:
                ItemDiscrepancyResponse:
                  $ref: '#/components/examples/ItemDiscrepancyResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorModel'
              examples:
                BadPathParamFormat:
                  $ref: '#/components/examples/BadPathParamFormat'
                BadSupplyIDPackage:
                  $ref: '#/components/examples/BadSupplyIDPackage'
                BadID:
                  $ref: '#/components/examples/BadID'
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: Доступ запрещён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.SupplyAcceptedMoreThanYearAgo'
              examples:
                SupplyAcceptedMoreThanYearAgo:
                  $ref: '#/components/examples/SupplyAcceptedMoreThanYearAgo'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Response4XX'
              examples:
                Response403TokenCategory:
                  $ref: '#/components/examples/Response403TokenCategory'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrorModel'
              examples:
                SupplyNotFound:
                  $ref: '#/components/examples/SupplyNotFound'
        '429':
          $ref: '#/components/responses/429'
      x-tagKey: suppliesInformation
components:
  securitySchemes:
    HeaderApiKey:
      type: apiKey
      name: Authorization
      in: header
  schemas:
    models.ItemDiscrepancyResponse:
      required:
        - packageCode
        - videoUrl
        - videoStartsAt
        - videoUnavailable
        - items
      type: object
      properties:
        packageCode:
          description: Package ID
          type: string
        videoUrl:
          description: Video of discrepancies during acceptance
          type: string
        videoStartsAt:
          description: Date and time of video recording of discrepancies during acceptance
          type: string
          format: date-time
        videoUnavailable:
          description: |
            Is the video available:
              - `false` — yes
              - `true` — no
          type: boolean
        items:
          description: Supply items
          type: array
          items:
            $ref: '#/components/schemas/models.DiscrepancyResponseItem'
    models.DiscrepancyResponseItem:
      type: object
      required:
        - actualAmount
        - actualSku
        - declaredAmount
        - discrepancyQuantity
        - discrepancyType
        - declaredSku
        - skuScans
      properties:
        declaredSku:
          nullable: false
          description: SKU declared when creating the supply
          type: string
        discrepancyType:
          nullable: false
          type: string
          description: |
            Overall discrepancy type for the box:
              - `surplus` — more items delivered than declared
              - `shortage` — fewer items delivered than declared
              - `re-sorting` — the SKU of the accepted item does not match the one declared when creating the supply
          enum:
            - surplus
            - shortage
            - re-sorting
        declaredAmount:
          nullable: false
          description: Item quantity declared when creating the supply
          type: integer
        actualAmount:
          nullable: false
          description: Actual item quantity
          type: integer
        discrepancyQuantity:
          nullable: false
          description: Difference between declared and actual item quantity
          type: integer
        actualSku:
          nullable: false
          description: Actual SKU
          type: string
        skuScans:
          description: Item scan results
          nullable: true
          type: array
          items:
            $ref: '#/components/schemas/models.ItemScans'
    models.ItemScans:
      required:
        - scanId
        - declaredSku
        - scanTime
        - discrepancyLabel
        - actualSku
      type: object
      properties:
        scanId:
          nullable: false
          description: Scan ID
          type: integer
        declaredSku:
          nullable: false
          description: SKU declared when creating the supply
          type: string
        scanTime:
          nullable: false
          description: Scan date and time
          format: date-time
          type: string
        discrepancyLabel:
          nullable: false
          type: string
          description: |
            Discrepancy type:
              - `surplus` — more items delivered than declared
              - `shortage` — fewer items delivered than declared
              - `re-sorting` — the SKU of the accepted item does not match the one declared when creating the supply
          enum:
            - surplus
            - shortage
            - re-sorting
        actualSku:
          nullable: false
          type: string
          description: Actual SKU
    errors.DraftError:
      required:
        - status
        - title
        - requestId
        - origin
      type: object
      properties:
        status:
          type: integer
          description: HTTP status code
        title:
          type: string
          description: Error title
        detail:
          type: string
          description: Error details
        requestId:
          type: string
          description: Unique request ID
        origin:
          type: string
          description: Service name
    models.DraftAdditemsRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/models.Item'
          description: Items list
          maxItems: 1000
    models.DraftAddItemsErrorResponse:
      required:
        - results
      properties:
        results:
          description: List of invalid SKUs with errors
          items:
            $ref: '#/components/schemas/models.DraftAddItemsResultItem'
          type: array
      type: object
    models.DraftDeleteItemsErrorResponse:
      required:
        - results
      properties:
        results:
          type: array
      type: object
    models.DraftAddItemsResultItem:
      required:
        - error
        - sku
      properties:
        error:
          allOf:
            - $ref: '#/components/schemas/models.DraftAddItemsResultError'
          description: Error detail
        sku:
          description: SKU
          type: string
      type: object
    models.DraftAddItemsResultError:
      required:
        - detail
        - title
      properties:
        detail:
          description: Error details
          example: Создайте карточку товара с этим баркодом
          type: string
        title:
          description: Error title
          example: Invalid sku
          type: string
      type: object
    models.DraftCreateResponse:
      required:
        - draftId
      type: object
      properties:
        draftId:
          type: string
          description: Draft ID
          example: cd20d135-f13f-47a0-903c-3bd268b92047
    models.DraftDeleteitemsRequest:
      type: object
      required:
        - skus
      properties:
        skus:
          type: array
          minItems: 1
          items:
            type: string
          description: SKUs list
    models.DraftItemItem:
      required:
        - sku
        - color
        - quantity
        - brandName
        - imgSrc
        - nmId
        - subjectName
        - techSize
        - title
        - vendorCode
      type: object
      properties:
        sku:
          type: string
          description: SKU
        color:
          type: string
          description: Item color
        quantity:
          type: integer
          description: Item quantity
        brandName:
          type: string
          description: Brand
        imgSrc:
          type: string
          description: Link to item image
        nmId:
          type: integer
          description: WB item number
        subjectName:
          type: string
          description: Subcategory
        techSize:
          type: string
          description: Item size
        title:
          type: string
          description: Item title
        vendorCode:
          type: string
          description: Seller item number
    models.DraftItem:
      required:
        - draftId
        - phone
        - createdAt
        - updatedAt
        - skuQuantity
        - itemQuantity
      type: object
      properties:
        draftId:
          type: string
          description: Draft ID
        phone:
          type: string
          description: Phone number of the user that created the draft
        createdAt:
          type: string
          description: Date and time the draft was created
          format: ISO 8601
        updatedAt:
          type: string
          description: Date and time the draft was updated
          format: ISO 8601
        skuQuantity:
          type: integer
          description: SKU quantity
        itemQuantity:
          type: integer
          description: Item quantity
    models.ListDraftItemsResponse:
      required:
        - skuQuantity
        - itemQuantity
        - items
      type: object
      properties:
        skuQuantity:
          type: integer
          description: SKU quantity
        itemQuantity:
          type: integer
          description: Item quantity
        items:
          type: array
          items:
            $ref: '#/components/schemas/models.DraftItemItem'
          description: Items list
    models.ListDraftsResponse:
      required:
        - total
        - drafts
      type: object
      properties:
        total:
          type: integer
          description: Total number of drafts
        drafts:
          type: array
          items:
            $ref: '#/components/schemas/models.DraftItem'
          description: Drafts list
    models.Item:
      type: object
      required:
        - quantity
        - sku
      properties:
        quantity:
          type: integer
          description: |
            Item quantity
          minimum: 1
          maximum: 999999
        sku:
          type: string
          description: SKU specified in the listing
    models.TransitTariff:
      type: object
      properties:
        transitWarehouseName:
          type: string
          description: Transit warehouse
        destinationWarehouseName:
          type: string
          description: Destination warehouse
        activeFrom:
          type: string
          description: From what date the transit direction is available
          format: date-time
        boxTariff:
          nullable: true
          type: array
          description: Tariff for box transit. If `null`, transit for boxes is not available
          items:
            $ref: '#/components/schemas/models.VolumeTariff'
        palletTariff:
          type: integer
          description: Tariff per pallet, ₽
    models.VolumeTariff:
      type: object
      properties:
        from:
          type: integer
          description: Supply volume from, liters
        to:
          type: integer
          description: Supply volume up to, liters
        value:
          type: number
          description: Rate, ₽ per liter
    models.Box:
      type: object
      properties:
        packageCode:
          type: string
          description: Package SKU
        quantity:
          type: integer
          description: Total quantity of items in the package, pieces
        barcodes:
          type: array
          description: List of packed items
          items:
            $ref: '#/components/schemas/models.GoodInBox'
      example:
        packageCode: WB_689
        quantity: 1
        barcodes:
          - barcode: '1234567891234'
            quantity: 1
    models.GoodInBox:
      type: object
      properties:
        barcode:
          type: string
          description: Barcode
        quantity:
          type: integer
          description: Quantity, pieces
    models.SuppliesFiltersRequest:
      properties:
        dates:
          description: Filter by dates
          items:
            $ref: '#/components/schemas/models.DateFilterRequest'
          type: array
        statusIDs:
          description: |
            Filter the supply by statuses. Possible values:
              - `1` — Not planned
              - `2` — Planned
              - `3` — Dispatch allowed
              - `4` — Accepting
              - `5` — Accepted
              - `6` — Unloaded at the gate
          items:
            $ref: '#/components/schemas/models.HandySupplyStatus'
          type: array
      type: object
    models.GoodInSupply:
      type: object
      properties:
        barcode:
          description: Item barcode
          type: string
        vendorCode:
          type: string
          description: Seller item number
        nmID:
          type: integer
          description: WB item number
        needKiz:
          description: |
            Is a labeling code [Chestny ZNAK](https://chestnyznak.ru/en) required for this item:
              - `false` — not required
              - `true` — required
          type: boolean
        tnved:
          type: string
          description: |
            HS-code.
            <br>
            If `"needKiz":true` and `"tnved":null`, it is required to specify the **HS-codes** in the [personal account](https://seller.wildberries.ru/new-goods) or through [API](./item-management#tag/listings/operation/postV2CardsUpdate)
          nullable: true
        techSize:
          type: string
          description: Item size specified by the seller
        color:
          description: Item color
          type: string
          nullable: true
        supplierBoxAmount:
          type: integer
          nullable: true
          description: Specified in the package, pieces
        quantity:
          type: integer
          description: Specified in the supply/order, pieces
        readyForSaleQuantity:
          type: integer
          nullable: true
          description: Ready for sale, pieces
        acceptedQuantity:
          type: integer
          nullable: true
          description: Accepted, pieces
        unloadingQuantity:
          type: integer
          nullable: true
          description: Total items at putaway, pieces
      example:
        barcode: '1234567891234'
        vendorCode: wb4sewt0vg
        nmID: 987456654
        needKiz: true
        tnved: '6204430000'
        techSize: C
        color: красный
        supplierBoxAmount: 10
        quantity: 10
        readyForSaleQuantity: 0
        unloadingQuantity: 0
        acceptedQuantity: 0
    models.DateFilterRequest:
      properties:
        from:
          type: string
          description: Period start date
          format: ISO 8601
        till:
          type: string
          description: Period end date
          format: ISO 8601
        type:
          type: string
          enum:
            - factDate
            - createDate
            - supplyDate
            - updatedDate
          description: |
            Dates type:
              - `factDate` — actual dispatch date
              - `createDate` — supply creation date
              - `supplyDate` — planned dispatch date
              - `updatedDate` — supply update date
      required:
        - type
      type: object
    models.SupplyDetails:
      type: object
      properties:
        phone:
          description: Phone number of the user that created the supply
          type: string
        statusID:
          description: |
            Supply status ID:
            - `1` — Not planned
            - `2` — Planned
            - `3` — Dispatch allowed
            - `4` — Accepting
            - `5` — Accepted
            - `6` — Unloaded at the gate
          enum:
            - 1
            - 2
            - 3
            - 4
            - 5
            - 6
          type: integer
        virtualTypeID:
          description: |
            ID of virtual supply type. Displayed only for supplies with `"boxTypeID":0`.
              - `0` — Carryover of stock
              - `1` — Depersonalization
              - `4` — QR supply
              - `5` — Additional acceptance
              - `6` — Scan acceptance
          type: integer
        boxTypeID:
          description: |
            Supply type ID:
              - `0` — Without boxes (virtual supply)
              - `1` and `2` — Boxes
              - `5` — Monopallets
              - `6` — Supersafe
          type: integer
        createDate:
          description: Date and time the supply was created
          type: string
        supplyDate:
          description: Planned dispatch date
          type: string
          nullable: true
        factDate:
          description: Actual dispatch date
          type: string
          nullable: true
        updatedDate:
          description: Date of the supply update
          type: string
          nullable: true
        warehouseID:
          description: Warehouse ID for planned supply
          type: integer
        warehouseName:
          description: Warehouse name for planned supply
          type: string
        actualWarehouseID:
          description: Warehouse ID where the supply was delivered
          type: integer
          nullable: true
        actualWarehouseName:
          description: Warehouse name where the supply was delivered
          type: string
        transitWarehouseID:
          description: Transit warehouse ID
          type: integer
          nullable: true
        transitWarehouseName:
          description: Transit warehouse name
          type: string
        acceptanceCost:
          description: Preliminary acceptance cost, ₽
          type: number
          nullable: true
        paidAcceptanceCoefficient:
          description: Acceptance coefficient
