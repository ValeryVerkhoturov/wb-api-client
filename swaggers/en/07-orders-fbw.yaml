                $ref: '#/components/schemas/errors.DraftError'
              example:
                status: 404
                title: not found
                detail: Черновик не найден
                requestId: a6bdc2a4d2fde51c2036fa8af2483886
                origin: supply-api
        '429':
          $ref: '#/components/responses/429'
