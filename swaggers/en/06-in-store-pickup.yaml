openapi: 3.0.1
info:
  title: In-Store Pickup
  x-file-name: in-store-pickup
  description: |
    <div class="api-block">

    Management of [assembly orders](/openapi/in-store-pickup#tag/inStorePickupAssemblyOrders) and [order label identifiers](/openapi/in-store-pickup#tag/inStorePickupLabelIdentifiers) for the In-Store Pickup scheme.<br><br>

    You can test the In-Store Pickup methods in the [sandbox](/en/sandbox). Also you can use [special methods](/en/docs/openapi-other/sandbox-environment#tag/marketplaceInStorePickup) in the sandbox for emulating user actions

    </div>
  version: instorepickup
servers:
  - url: https://marketplace-api.wildberries.ru
security:
  - HeaderApiKey: []
tags:
  - name: In-Store Pickup Assembly Orders
    x-displayName: In-Store Pickup Assembly Orders
    description: ''
    x-tagKey: inStorePickupAssemblyOrders
    x-description: |
      <div class="description_auth">
        To access the methods, use a <a href="./api-information#tag/authorization/How-to-create-a-personal-access-base-or-test-token">token</a> for the <strong>Marketplace</strong> category
      </div>


      <div class="description_ref">
        You can learn how to use methods in business cases in the <a href="/en/knowledge-base/articles/019d49a4-16d3-7b8c-b42a-026b566a8e29/in-store-pickup-orders">instructions</a> on working with <strong>In-Store Pickup orders</strong>
      </div>


      Work order by scheme:
      1. [Get new assembly order](./in-store-pickup#tag/inStorePickupAssemblyOrders/operation/getV3ClickCollectOrdersNew)
      2. [Transfer it for assembly](./in-store-pickup#tag/inStorePickupAssemblyOrders/operation/postV3ClickCollectOrdersStatusConfirm)
      3. After this, [information about the buyer](./in-store-pickup#tag/inStorePickupAssemblyOrders/operation/postV3ClickCollectOrdersClient) (name, phone number) becomes available for the order.
      4. After assembly, [report that the assembly order is ready for pickup](./in-store-pickup#tag/inStorePickupAssemblyOrders/operation/postV3ClickCollectOrdersStatusPrepare)
      5. After the assembly order receives the status `Ready for pickup`, you can check whether [the assembly order belongs to the buyer](./in-store-pickup#tag/inStorePickupAssemblyOrders/operation/postV3ClickCollectOrdersClientIdentity).
      6. After delivering the order to the buyer, you need to inform our server that [the assembly order has been received by the buyer](./in-store-pickup#tag/inStorePickupAssemblyOrders/operation/postV3ClickCollectOrdersStatusReceive) or that [the buyer declined the assembly order](./in-store-pickup#tag/inStorePickupAssemblyOrders/operation/postV3ClickCollectOrdersStatusReject).
  - name: In-Store Pickup Label Identifiers
    x-displayName: In-Store Pickup Label Identifiers
    description: ''
    x-tagKey: inStorePickupLabelIdentifiers
    x-description: |
      <div class="description_auth">
        To access the methods, use a <a href="./api-information#tag/authorization/How-to-create-a-personal-access-base-or-test-token">token</a> for the <strong>Marketplace</strong> category
      </div>


      <div class="description_ref">
        You can learn how to use methods in business cases in the <a href="/en/knowledge-base/articles/019d49a4-16d3-7b8c-b42a-026b566a8e29/in-store-pickup-orders">instructions</a> on working with <strong>In-Store Pickup orders</strong>
      </div>


      Using these methods, you can [get](./in-store-pickup#tag/inStorePickupLabelIdentifiers/operation/postV3ClickCollectOrdersMetaDetails), [delete](./in-store-pickup#tag/inStorePickupLabelIdentifiers/operation/postV3ClickCollectOrdersMetaDelete), and edit label identifiers of assembly orders:
        - [Labeling code Chestny ZNAK](./in-store-pickup#tag/inStorePickupLabelIdentifiers/operation/postV3ClickCollectOrdersMetaSgtin)
        - [UIN](./in-store-pickup#tag/inStorePickupLabelIdentifiers/operation/postV3ClickCollectOrdersMetaUin)
        - [IMEI](./in-store-pickup#tag/inStorePickupLabelIdentifiers/operation/postV3ClickCollectOrdersMetaImei)
        - [GTIN](./in-store-pickup#tag/inStorePickupLabelIdentifiers/operation/postV3ClickCollectOrdersMetaGtin)
        - [Customs Declaration Number and Numeric Code of the Country of Origin](./in-store-pickup#tag/inStorePickupLabelIdentifiers/operation/postV3ClickCollectOrdersMetaCustomsDeclaration)

      Specifying label identifiers for the assembly order in the sandbox is optional
