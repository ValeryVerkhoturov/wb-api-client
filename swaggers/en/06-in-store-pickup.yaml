    get:
      operationId: getV3ClickCollectOrders
      x-readonly-method: true
      x-category: marketplace
      tags:
        - In-Store Pickup Assembly Orders
      summary: Get Information on Completed Orders
      description: |
        The method provides information on completed assembly orders after the sale or cancellation of an order.

        You can get data for a specified period, maximum of 30 calendar days per request.

        <div class="description_limit">
        <a href="/openapi/api-information#tag/introduction/Rate-Limits">Request limit</a> per one seller account for <strong>In-Store Pickup assembly orders</strong> methods:

        | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- |
        | 1 min | 300 requests | 200 ms | 20 requests |

        One request with <code>4XX</code> response codes is counted as 10 requests.

        <hr>

        In <a href='/en/sandbox'>Sandbox</a> — maximum of 1 request per second for all <strong>Marketplace</strong> methods in total.

        </div>
      parameters:
        - name: limit
          in: query
          description: |
            Number of items in the response
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: next
          in: query
          description: |
            Pagination parameter. To get the full list of data, specify 0 in the first request. To get the next data package, use the `next` value from the response
          required: true
          schema:
            type: integer
        - name: dateFrom
          in: query
          description: Period start date in the Unix timestamp format
          required: true
          schema:
            type: integer
        - name: dateTo
          in: query
          description: Period end date in the Unix timestamp format
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.Orders'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                IncorrectParameter:
                  $ref: '#/components/examples/IncorrectParameter'
        '401':
