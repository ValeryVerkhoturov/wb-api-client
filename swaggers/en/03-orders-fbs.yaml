openapi: 3.0.1
info:
  title: FBS Orders
  version: order
  description: |+
    <div class="api-block">

    Use the FBS Orders (Fulfillment by Seller) methods to:
      - get information about [assembly orders](/openapi/orders-fbs#tag/fbsAssemblyOrders) and their statuses, cancel assembly orders, and get stickers
      - get, add, edit, and delete [label identifiers](/openapi/orders-fbs#tag/fbsLabelIdentifiers) for assembly orders
      - manage [supplies](/openapi/orders-fbs#tag/fbsSupplies)
      - create, edit, and delete [passes](/openapi/orders-fbs#tag/fbsPasses) to WB warehouses

    You can test the FBS order methods in the [sandbox](/en/sandbox). Also you can use [special methods](/en/docs/openapi-other/sandbox-environment#tag/marketplaceFbs) in the sandbox for emulating user actions

    </div>


    <div class="description_ref">
      You can learn how to use methods in business cases in the <a href="/en/knowledge-base/articles/019d49a4-0771-7571-aea9-11d5b597f34c/fbs-orders">instructions</a> on working with <strong>FBS orders</strong>
    </div>

  x-file-name: orders-fbs
security:
  - HeaderApiKey: []
tags:
  - name: FBS Assembly Orders
    x-displayName: FBS Assembly Orders
    description: ''
    x-tagKey: fbsAssemblyOrders
  - name: FBS Label Identifiers
    x-displayName: FBS Label Identifiers
    description: ''
    x-tagKey: fbsLabelIdentifiers
  - name: FBS Supplies
    x-displayName: FBS Supplies
    description: ''
    x-tagKey: fbsSupplies
  - name: FBS Passes
    x-displayName: FBS Passes
    description: ''
    x-tagKey: fbsPasses
  - name: Auto-return Settings
    x-displayName: Auto-return Settings
    description: ''
    x-tagKey: autoreturnSettings
paths:
  /api/v3/passes/offices:
    servers:
      - url: https://marketplace-api.wildberries.ru
