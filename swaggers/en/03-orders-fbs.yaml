      type: object
    409SupplyDeliverError:
      type: object
      nullable: false
      properties:
        code:
          type: string
          description: Error code
          nullable: false
        message:
          type: string
          description: Error description
          nullable: false
        data:
          type: object
          description: Additional data for the error
          nullable: true
          properties:
            orders:
              type: array
              description: Assembly orders those label identifiers has not passed or has not yet completed validation
              items:
                type: object
                properties:
                  id:
                    type: integer
                    description: Assembly order ID
                  metaDetails:
                    type: array
                    description: Errors info
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                          description: Label identifier
                        value:
                          type: string
                          description: Label identifier value
                        decision:
                          type: string
                          description: |
                            State:
                            - `imei`
                              - `pending` — Label identifier validation continues. Wait for the validation status to change
                              - `required` — Required label identifier is not added to the assembly order
                              - `imeiInvalidFormat` — Invalid format
                              - `imeiAlreadySold` — The item with this IMEI has already been sold
                            - `uin`
                              - `required` — Required label identifier is not added to the assembly order
                              - `pending` — Label identifier validation continues. Wait for the validation status to change
                              - `uinInvalidFormat` — Invalid format
                              - `uinBadStatus` — Invalid batch status
                              - `uinBadProcess` — Invalid processing stage
                              - `uinBadStatusAndBadProcess` — Invalid batch status. Invalid processing stage
                              - `uinNotFound` — Not found in GIIS DMDK [https://minfin.gov.ru/ru/perfomance/jewels/dmdk].
                                When you receive this error, make sure that the UIN:
                                - is specified in the uploaded Delivery Contract Specification. If the specification was uploaded more than 30 minutes ago, [delete UIN](./orders-fbs#tag/fbsLabelIdentifiers/operation/deleteV3OrdersOrderIdMeta) from the assembly order and [add it](./orders-fbs#tag/fbsLabelIdentifiers/operation/putV3OrdersOrderIdMetaUin) again
                                - is registered in GIIS DMDK
                                - is specified correctly and is read from the tag without errors
                                - is in circulation
                            - `sgtin`
                              - `pending` — Label identifier validation continues. Wait for the validation status to change
                              - `required` — Required label identifier is not added to the assembly order
                              - `sgtinInvalidFormat` — Invalid format
                              - `sgtinNoGS` — Label identifier does not contain the GS separator `\u001d`
                              - `sgtinHasInvalidSymbols` — Label identifier contains incorrect characters or spaces
                              - `sgtinHasNonLatinSymbols` — Label identifier contains non-special or Latin characters
                              - `sgtinInvalidPattern` — Label identifier structure is incorrect
                              - `sgtinNotFound` — Label identifier not found in [Chestny ZNAK](https://chestnyznak.ru/en/)
                              - `sgtinEmitted` — Label identifier has been issued
                              - `sgtinApplied` — Putting into circulation not completed
                              - `sgtinWrittenOff` — Written off
                              - `sgtinRetired` — Retired
                              - `sgtinWithdrawn` — Withdrawn
                              - `sgtinDisaggregation` — Disaggregation
                              - `sgtinDisaggregated` — Disaggregated
                              - `sgtinAppliedNotPaid` — Not paid
                            - `gtin`
                              - `required` — Required label identifier is not added to the assembly order
                            - `expiration`
                              - `required` — Required label identifier is not added to the assembly order
                            - `customsDeclaration`
                              - `required` — Required label identifier is not added to the assembly order
