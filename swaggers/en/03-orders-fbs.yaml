      summary: Add Assembly Orders to the Supply
      description: |
        The method adds up to 100 [assembly orders](/openapi/orders-fbs#tag/fbsAssemblyOrders/operation/getV3Orders) to the supply and moves it to the `confirm` [status](/openapi/orders-fbs#tag/fbsAssemblyOrders/operation/postV3OrdersStatus).

        It can also move the assembly orders:
          - between active supplies
          - from a closed to an active supply, if the assembly order requires [reshipment](/openapi/orders-fbs#tag/fbsAssemblyOrders/operation/getV3SuppliesOrdersReshipment).

        <div class="description_important">
          You can add any assembly orders that arrived at the same warehouse to an empty supply.<br>
          The supply acquires the attributes of the first assembly order added to it from the <a href="/en/docs/openapi/orders-fbs#tag/fbsSupplies/operation/getV3SuppliesSupplyId">fields</a>:
          <ul>
            <li><code>crossBorderType</code> — crossborder or non-crossborder</li>
            <li><code>cargoType</code> — dimensional type</li>
            <li><code>isB2b</code> — B2B-sale or not B2B-sale</li>
          </ul>
            After that, you can add to the supply only assembly orders with the same <code>crossBorderType</code>, <code>cargoType</code>, <code>isB2b</code> attributes as the supply.
        </div>

