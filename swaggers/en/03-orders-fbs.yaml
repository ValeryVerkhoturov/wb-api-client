    UpdatedSuppliesShippingMethod:
      description: Результат обработки запроса для одной поставки
      type: object
      required:
        - supplyId
      properties:
        error:
          description: |
            Error processing the request for the supply. Possible errors:
              - `400 IncorrectRequestBody`:
                - incorrect supply ID
                - shipping point not found
                - destination warehouse is not located in the Russian Federation
                - unknown `shippingType`
                - date does not match the `YYYY-MM-DD` format
              - `400 FulfillmentRequired` — the **Fulfillment at SC** service is not available at the shipping point
              - `404 NotFound` — supply not found
              - `409 SupplyAlreadyScanned` — the supply or its boxes have already been scanned at the shipping point
              - `409 InvalidShippingDt` — invalid supply shipping date
          type: object
          required:
            - code
            - detail
          properties:
            code:
              type: integer
              description: Error code
            detail:
              type: string
              description: |
