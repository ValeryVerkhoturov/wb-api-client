        <br>
        Use the method to moved an assembly order from a closed supply to an open one.
        <br>
        An assembly order can be moved from delivery to assembly if all conditions are met:
        - the assembly order is in the `complete` status — in delivery
        - the supply to which the assembly order needs to be moved [is not transferred to delivery](/openapi/orders-fbs#tag/fbsSupplies/operation/patchV3SuppliesSupplyIdDeliver)
        - the assembly order has not previously been moved from delivery to assembly
        To check whether an assembly order can be transferred from delivery to assembly, use the [assembly order statuses](/openapi/orders-fbs#tag/fbsAssemblyOrders/operation/postV3OrdersStatus), the isTransferable field.
      parameters:
        - name: supplyId
          in: path
          required: true
          description: ID of the supply from which orders will be moved
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orderIds
                - newSupplyId
              properties:
                orderIds:
                  type: array
                  description: List of assembly order IDs that need to be moved to assembly
                  items:
                    type: integer
                newSupplyId:
                  type: string
                  description: ID of the supply to which orders will be moved. The supply must not be in a delivery status
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v3.TransferOrdersToAssemblyResponse'
              examples:
                v3.TransferOrdersToAssemblyResponse:
