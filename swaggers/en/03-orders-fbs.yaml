components:
  securitySchemes:
    HeaderApiKey:
      type: apiKey
      name: Authorization
      in: header
  parameters:
    Supply:
      name: supplyId
      in: path
      required: true
      description: Supply ID
      schema:
        type: string
        example: WB-GI-1234567
    Order:
      name: orderId
      in: path
      required: true
      description: Assembly order ID
      schema:
        type: integer
        format: int64
        example: 5632423
    Pass:
      name: passId
      in: path
      required: true
      description: Pass ID
      schema:
        type: integer
        format: int64
        example: 45
    Next:
      name: next
      in: query
      required: true
      schema:
        type: integer
        format: int64
      description: Pagination parameter. Sets the value from which to retrieve the next batch. It should start at 0 to get the full list of data. For the subsequent requests, you must take the value from the `next` field in the response.
    Limit:
      name: limit
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 1000
      description: Pagination parameter. Sets the limit for the amount of data returned.
  examples:
    v3.TransferOrdersToAssemblyResponse:
      value:
        transferredOrders:
          - error:
              detail: Failed to assign the assembly order to the supply. Make sure that the assembly task and the supply meet all the necessary requirements.
              code: 409
            newStickerId: 0
            oldStickerId: 0
            orderId: 5457166056
          - success: true
            newStickerId: 1234567890
            oldStickerId: 9876543210
            orderId: 5678954321
    LowExpirationDate:
      description: The specified expiration date is less than the allowable limit
      value:
        code: LowExpirationDate
        message: Не удалось обновить срок годности. Указан срок меньше допустимого
    IncorrectRequestBody:
      value:
        message: Incorrect request body
    WarehouseNameInvalid:
      value:
        message: Incorrect warehouse name
    IncorrectRequest:
      value:
        message: Incorrect request parameters
    IncorrectParameter:
      value:
        message: Incorrect parameter value
    MetaKeyNotRequired:
      description: This labeling identifier is not possible for this assembly order. You can add only the available labeling identifiers to the assembly order.
      value:
        code: MetaKeyNotRequired
        message: Order doesn't require ID
    CustomsDeclarationIsRequired:
      value:
        code: CustomsDeclarationIsRequired
        message: Customs declaration is required
    ShippingDtRequired:
      description: Specify the planned supply shipping date for orders for small-sized items (`"cargoType":1`) and dimensional cargo+ (`"cargoType":3`)
      value:
        code: ShippingDtRequired
        message: Shipping date is required for MGT and KGT supplies
    FailedToUpdateMeta:
      value:
        message: Failed to update the label identifiers of the assembly order. Please ensure that the assembly order meets all the necessary requirements (the assembly order exists, is in the "In assembly" status, label identifiers is available to the order, see the method description to Get the label identifiers of the order).
    SupplyHasOrders:
      value:
        message: Cannot delete the supply. The supply contains orders.
    SupplyIsProcessing:
      description: The supply is busy with another process, for example, assembly orders are being added to it. Repeat the request later
      value:
        code: SupplyIsProcessing
        message: The supply is currently being processed. Please try again later
    SupplyHasZeroOrders:
      value:
        message: Cannot move the supply to the delivery. The supply does not satisfy the delivery conditions.
    MetaValidationFail:
      description: Label identifiers were not validated
      value:
        code: MetaValidationFail
        message: Fix them to dispatch items
        data:
          orders:
            - id: 123456789
              metaDetails:
                - key: uin
                  value: 'null'
                  decision: uinBadStatus
    FulfillmentSupplyBoxesRequired:
      description: Required shipping unit not added
      value:
        code: FulfillmentSupplyBoxesRequired
        message: Unable to change status to "in delivery". Fulfillment shipments require at least one cargo space
    SupplyNotClosed:
      value:
        message: The supply is not moved to the delivery.
    FailedToAddSupplyOrder:
      value:
        message: Cannot add the assembly order to the supply. The assembly order does not satisfy the conditions of assignment to the delivery.
    StatusMismatch:
      value:
        message: Status change is not allowed for the assembly order.
    StatusChangeNotAllowed:
      value:
        message: Status change to 'completed' or 'canceled by client' is not allowed for the assembly order in 'Delivery By Seller'.
    ArhiveOrderError400:
      value:
        code: BadRequest
        detail: Incorrect parameter
        errors:
