  schemas:
    v3.TransferOrdersToAssemblyResponse:
      properties:
        transferredOrders:
          items:
            $ref: '#/components/schemas/v3.TransferOrderToAssembly'
          type: array
      type: object
    v3.TransferOrderToAssembly:
      required:
        - newStickerId
        - oldStickerId
        - orderId
      properties:
        error:
          type: object
          description: Error detail
          properties:
            detail:
              type: string
              nullable: false
              description: Error details
            code:
              type: integer
              nullable: false
              description: Internal error code
        success:
          type: boolean
          nullable: false
          description: Whether the request was processed successfully. Can only be `true`
        newStickerId:
          nullable: false
          type: integer
          description: New sticker ID
        oldStickerId:
          nullable: false
          type: integer
          description: Old sticker ID
        orderId:
          nullable: false
          type: integer
          description: Assembly order ID
      type: object
    v3.ArchiveOrders:
      type: object
      description: List of archived assembly orders
      required:
        - orders
        - next
      properties:
        next:
          description: Pagination parameter. Sets the value from which to get the next batch
          type: integer
          format: int64
          nullable: true
        orders:
          description: Archived assembly orders
          type: array
          items:
            $ref: '#/components/schemas/v3.ArchiveOrder'
    v3.ArchiveOrder:
      type: object
      description: Archived assembly order
      required:
        - cargoType
        - colorCode
        - createdAt
        - crossBorder
        - crossBorderType
        - id
        - isZeroOrder
        - metaDetails
        - options
        - orderUid
        - priceInfo
        - product
        - rid
        - scanPrice
        - status
        - stickerId
        - supplyId
        - warehouseId
      properties:
        cargoType:
          description: |
            Type of cargo:
              - `mgt` — small-sized items
              - `sgt` — over dimensional cargo (ODC)
              - `kgtPlus` — dimensional cargo+ (CD+)
          type: string
          example: mgt
        colorCode:
          description: Color code for tinted items
          type: string
          example: RAL 3017
          nullable: true
        createdAt:
          description: Date when the order was created
          type: string
          example: '2022-05-04'
        crossBorder:
          description: Cross-border order information
          type: object
          nullable: true
          properties:
            parcel:
              description: Parcel ID
              type: string
              example: 1Z999AA10123456784
        crossBorderType:
          description: |
            Assembly order type:
              - `local` — Non-Cross-Border
              - `crossBorder` — Cross-Border
          type: string
          example: crossBorder
        id:
          description: Assembly order ID
          type: integer
          example: 1234567890
        isZeroOrder:
          description: |
            Indicator of an order for an item with zero inventory:
              - `false` — the order is made for an item with a non-zero inventory
              - `true` — the order is made for an item with zero inventory
          type: boolean
          example: false
        metaDetails:
          allOf:
            - $ref: '#/components/schemas/MetaDetails'
            - description: Assembly order label identifiers
        options:
          description: Order options
          type: object
          properties:
            isB2B:
              description: |
                Indicator of a B2B sale:
                  - `false` — not B2B sale
                  - `true` — B2B sale
              type: boolean
              example: false
        orderUid:
          description: Transaction ID for order grouping. Orders in the same buyer's cart will have the same `orderUid`
          type: string
          example: 165918930_629fbc924b984618a44354475ca58675
        priceInfo:
          description: Order price data
          type: object
          required:
            - convertedCurrencyCode
            - convertedPrice
            - currencyCode
            - price
          properties:
            convertedCurrencyCode:
              description: Currency code of the seller country
              type: integer
              example: 643
            convertedPrice:
              description: The sum charged to the buyer in the currency of the seller country including all discounts, multiplied by 100
              type: integer
              example: 1020
            currencyCode:
              description: Sale currency code
              type: integer
              example: 643
            price:
              description: The price in the currency of sale including all discounts, except WB Wallet discount, multiplied by 100
              type: integer
              example: 1020
        product:
          description: Item information
          type: object
          required:
            - article
            - chrtId
            - nmId
            - skus
          properties:
            article:
              description: Seller item number
              type: string
              example: wv1702fyjh
            chrtId:
              description: Item size ID in WB systems
              type: integer
              format: uint64
              example: 12345678
            nmId:
              description: WB item number
              type: integer
              example: 370870300
            skus:
              description: List of SKUs
              items:
                type: string
              type: array
              example:
                - 12345Ejf5
                - 12345Ejf6
                - 12345Ejf7
        rid:
          description: |
            Unique order ID. <br>
            Note: `rid` corresponds to `srid` in the responses of the methods:
              - [Buyers Return Applications](./customer-communication#tag/buyersReturns/operation/getV1Claims)
              - [Order Feed](./analytics#tag/orderFeed/operation/postV1OrderFeed)
              - [Orders](./reports#tag/mainReports/operation/getV1SupplierOrders)
              - [Sales](./reports#tag/mainReports/operation/getV1SupplierSales)
              - [Returns and Item Movement Report](./reports#tag/returnsAndItemMovementReport)
              - [Details for the Sales Reports by Report ID](./documents-and-accounting#tag/financialReports/operation/postV1SalesReportsDetailedReportId)
              - [Details for the Sales Reports by Period](./documents-and-accounting#tag/financialReports/operation/postV1SalesReportsDetailed)
              - [Details for the Acquiring Expenses Reports by Report ID](./documents-and-accounting#tag/financialReports/operation/postV1AcquiringDetailedReportId)
              - [Details for the Acquiring Expenses Reports by Period](./documents-and-accounting#tag/financialReports/operation/postV1AcquiringDetailed)
          type: string
          example: f884001e44e511edb8780242ac120002
        scanPrice:
          description: Acceptance price in kopecks
          type: integer
          nullable: true
          example: 5200
        status:
          description: The latest assembly order statuses
          required:
            - supplierStatus
            - wbStatus
          properties:
            supplierStatus:
              description: Assembly order status set by the seller
              example: complete
              type: string
            wbStatus:
              description: Assembly order status set by WB system
              example: sent_to_carrier
              type: string
          type: object
        stickerId:
          description: Sticker ID
          example: 33811984302
          type: integer
        supplyId:
          description: Supply ID
          example: WB-GI-1234588
          type: string
          nullable: true
        warehouseId:
          description: ID of the seller warehouse from which the item was shipped
          example: 55684681
          type: integer
    v3.SupplyOrderIDsAPI:
      type: object
      properties:
        orderIds:
          type: array
          nullable: true
          description: Assembly order IDs
          items:
            type: integer
          example:
            - 132334
            - 203984
            - 403543
            - 598349
