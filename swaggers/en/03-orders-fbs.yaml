      tags:
        - FBS Passes
      summary: Create Pass
      description: |
        Creates a seller pass. <br> The pass is valid for 48 hours from the time of creation.

        <div class="description_limit">
          Maximum of 1 request per 10 <a href="/openapi/api-information#tag/introduction/Rate-Limits">minutes</a> per one seller account

          One request with <code>4XX</code> response codes is counted as 10 requests.

          <hr>

          In <a href='/en/sandbox'>sandbox</a> — maximum of 1 request per second for all <strong>Marketplace</strong> methods in total.

        </div>
      requestBody:
        required: true
        description: The total length of the full name is limited from 6 to 100 characters. The car number can contain only letters and numbers
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                  nullable: false
                  minLength: 1
                  description: First name
                  example: Alex
                lastName:
                  type: string
                  nullable: false
                  minLength: 1
                  description: Last name
                  example: Petrov
                carModel:
                  type: string
                  nullable: false
                  minLength: 1
                  maxLength: 100
                  description: Car model
                  example: Lamborghini
                carNumber:
                  type: string
                  nullable: false
                  minLength: 6
                  maxLength: 9
                  description: Car number
                  example: A456BC123
                officeId:
                  type: integer
                  format: int64
                  nullable: false
                  minimum: 1
                  description: Office ID
                  example: 15
              required:
                - firstName
                - lastName
                - carModel
                - carNumber
                - officeId
      responses:
