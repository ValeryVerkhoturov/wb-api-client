        - latitude
        - longitude
        - fulfillment
        - available
      properties:
        id:
          format: int64
          type: integer
          example: 100
          description: Shipping point ID
        name:
          type: string
          description: Name
          example: Москва Морской
        address:
          type: string
          description: Address
          example: г Москва, Морской Проспект 54
        city:
          type: string
          example: Москва
          description: Locality
        officeType:
          description: |
            Shipping point type:
              - `sc` — sorting center
              - `sw` — warehouse
              - `pp` — pickup point
          type: string
          example: pp
          enum:
            - sc
            - sw
            - pp
        cargoTypes:
          description: |
            Types of items a shipping point can accept:
              - `1` — small-sized items
              - `2` — over dimensional cargo (ODC)
              - `3` — dimensional cargo+ (CD+)
          type: array
          items:
            type: integer
            enum:
              - 1
              - 2
              - 3
          example:
            - 1
            - 3
        latitude:
          type: number
          description: Latitude
          example: 37.588898
        longitude:
          type: number
          description: Longitude
          example: 55.386871
        fulfillment:
          type: boolean
          description: |
            Service **Fulfillment in SC** for FBS supplies:
              - `true` — available
              - `false` — unavailable
          example: false
        available:
          type: boolean
          description: |
            Whether the shipping point is available for the supply:
              - `true` — available
              - `false` — unavailable. Returns for the pickup point if it is overloaded on the planned supply shipping date
          example: true
