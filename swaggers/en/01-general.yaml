        | Personal | 1 min | 1 request | 1 min | 10 requests |
        | Service | 1 min | 1 request | 1 min | 10 requests |
        | Base with secret | 1 min | 1 request | 1 min | 10 requests |
        | Base | 1 h | 1 request | 1 h | 1 request |
        </div>
      parameters:
        - name: from
          in: query
          required: false
          allowEmptyValue: true
          description: |
            Filter by date and time: the response returns only notifications received before the specified date and time. Specify the values no later than the current ones.<br>
            To receive the newest notifications, do not pass this parameter in the request.<br>
            Use the parameter for pagination:
              1. Send the first request without the 'from` parameter.
              2. In the following requests, pass the `date` value of the last notification in the response in the `from` parameter.
