        requestId: c479c04d0b576a9ba0b20fdf235004c2
        origin: public-acl
    SupplierRatingModel:
      type: object
      properties:
        feedbackCount:
          description: Feedbacks number
          type: integer
          example: 12355
        valuation:
          description: Seller rating
          type: number
          format: float
          example: 4.55
    SubscriptionsJamInfo:
      type: object
      description: Jam subscription information
      required:
        - state
        - activationSource
        - level
        - since
        - till
      properties:
        state:
          type: string
          example: active
          enum:
            - active
            - inactive
          description: |
            Subscription state:
              - `active` — active
              - `inactive` — expired or canceled
        activationSource:
          type: string
          enum:
            - constructor
            - jam
          example: jam
          description: |
            Subscription activation source:
              - `constructor` — purchased via the **Plan Builder** section
              - `jam` — purchased via the **Jam Subscription** section
        level:
          type: string
          enum:
            - standard
            - advanced
            - premium
          example: premium
          description: |
            Subscription level:
              - `standard`
              - `advanced`
              - `premium`
        since:
          type: string
          format: date-time
          example: '2026-03-16T08:38:08.056406Z'
          description: The date and time when the subscription was first activated. Does not change upon renewal or reactivation
        till:
          type: string
          format: date-time
          example: '2026-04-25T14:44:28.393587Z'
          description: Subscription end date and time
    PlanBuilderOptionsInfo:
      type: object
      required:
        - activeOptionCount
        - activePackageCount
        - totalCommissionRate
        - packages
        - options
      properties:
        activeOptionCount:
          type: number
          format: int
          example: 5
          description: Number of active options not included in packages
        activePackageCount:
          type: number
          format: int
          example: 2
          description: Number of active option packages
        totalCommissionRate:
          type: number
          format: float
          example: 4.6
          description: Final fee for activated options and packages, % of turnover
        packages:
          type: array
          items:
            $ref: '#/components/schemas/PlanBuilderPackage'
          description: Activated option packages
        options:
          type: array
          items:
            $ref: '#/components/schemas/PlanBuilderOption'
          description: Activated options
    PlanBuilderPackage:
      type: object
      properties:
