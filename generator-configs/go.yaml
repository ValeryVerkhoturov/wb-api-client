# The Go template emits one package per output directory. Per-slug
# packageName is injected by generate.sh (e.g. `wbapi_items`). The client
# lives in the sibling wb-api-client-go repo (mounted at clients/go) with
# go.mod at its root, so daily-check's plain `vX.Y.Z` tags there make
# `go get github.com/ValeryVerkhoturov/wb-api-client-go@vX.Y.Z` resolve.
generatorName: go
generateInterfaces: true
withGoMod: true
isGoSubmodule: false
httpUserAgent: ValeryVerkhoturov/wb-api-client/go
# Deterministic output — the PR check workflow diffs the regenerated tree
# against the committed one, so any per-run varying header would flap.
hideGenerationTimestamp: true
