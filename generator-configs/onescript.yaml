# OneScript is generated by an out-of-tree plugin
# (github.com/ValeryVerkhoturov/onescript-openapi-generator), loaded next to
# openapi-generator-cli on the classpath and pinned by commit in
# scripts/onescript-toolchain.sh.
#
# Per-slug `modelNamePrefix` is injected by generate.sh. OneScript has no
# namespaces — class names are global — and 34 model names repeat across the
# 13 specs (`Response4XX` alone appears in 12), so models carry the category
# as a prefix. API classes take the module name (`ItemsApi`, …), which is
# unique by construction since post-process renames every operation's tag
# to the module.
#
# packagedef / lib.config / README.md emitted per spec are discarded: the
# unified package needs one of each, built from templates/onescript/ once the
# 13 trees are spliced together.
generatorName: onescript
hideGenerationTimestamp: true
# Transport is built on 1connector; this is the minimum stamped into packagedef.
# Keep in step with ONESCRIPT_CONNECTOR_VERSION in scripts/onescript-toolchain.sh,
# which installs it so the generated client can be compile-checked.
connectorVersion: "2.3.3"
# Model shape is declared as jason annotations: &Сериализуемое for the JSON name,
# &Тип/&ДляКаждого for the class to deserialize into. jason requires OneScript
# 2.0, which is why environmentVersion is 2.0.0. Keep in step with the
# ONESCRIPT_*_VERSION values in scripts/onescript-toolchain.sh, which installs it.
jasonVersion: "0.6.0"
environmentVersion: "2.0.0"
userAgent: ValeryVerkhoturov/wb-api-client/onescript
