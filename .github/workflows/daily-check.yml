name: Daily upstream check

on:
  schedule:
    # 06:15 UTC daily — after Wildberries' typical overnight portal deploys
    # but before the EU/RU workday, so any regeneration lands early.
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate & publish even if checksums match"
        type: boolean
        default: false

# One run at a time. If a scheduled run overlaps a manual one we drop the
# newer attempt — publishing the same spec twice would just churn tags.
concurrency:
  group: daily-check
  cancel-in-progress: false

permissions:
  contents: write      # commit swaggers + generated clients, push tag
  actions: write       # dispatch language publish workflows

jobs:
  regenerate:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # need history for `git tag --list` version calc
          # Fetch the clients/php submodule too. Uses `PHP_REPO_TOKEN`
          # instead of the default GITHUB_TOKEN because we need PUSH
          # rights on the sibling repo (default token is scoped to this
          # repo only). Store a PAT with `repo` scope on
          # github.com/ValeryVerkhoturov/wb-api-client-php as
          # secrets.PHP_REPO_TOKEN.
          submodules: recursive
          token: ${{ secrets.PHP_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Snapshot previous checksums
        run: |
          if [[ -f swaggers/checksums.txt ]]; then
            cp swaggers/checksums.txt /tmp/checksums.prev.txt
          else
            : > /tmp/checksums.prev.txt
          fi

      - name: Download upstream specs
        env:
          # Rotate the secret when downloads start returning HTTP 498; the
          # token is fingerprint-bound and expires. When unset, the script's
          # hardcoded fallback is used.
          WBAAS_TOKEN: ${{ secrets.WBAAS_TOKEN }}
        run: ./scripts/download-swaggers.sh

      - name: Detect changes
        id: diff
        run: |
          if diff -q /tmp/checksums.prev.txt swaggers/checksums.txt >/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Upstream diff:"
            # tee the diff to a file so the release-notes step can include it
            diff /tmp/checksums.prev.txt swaggers/checksums.txt \
              | tee /tmp/upstream-diff.txt || true
          fi

      - name: Compute release version
        id: version
        if: steps.diff.outputs.changed == 'true' || inputs.force
        run: |
          # Canonical version: 1.YYYYMMDD.N — a stable-semver form used
          # verbatim by every language (git tag, PyPI, npm, Maven, Go).
          #   MAJOR = 1     (fixed; keeps Go module path free of the
          #                  /vN suffix that MAJOR ≥ 2 would require)
          #   MINOR = date  (YYYYMMDD as int — monotonic across days)
          #   PATCH = N     (same-day counter, 0 for first release)
          # `npm install <pkg>` sees stable-semver releases and picks the
          # highest one; `pip`, `mvn`, `go get @latest` do the same.
          today="$(date -u +%Y%m%d)"
          n="$(git tag --list "v1.${today}.*" | wc -l | tr -d ' ')"
          version="1.${today}.${n}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Python (post-processor)
        if: steps.diff.outputs.changed == 'true' || inputs.force
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install post-processor deps
        if: steps.diff.outputs.changed == 'true' || inputs.force
        run: pip install -r scripts/requirements.txt

      - name: Post-process specs
        if: steps.diff.outputs.changed == 'true' || inputs.force
        run: python scripts/post-process.py

      - name: Regenerate all six language clients
        if: steps.diff.outputs.changed == 'true' || inputs.force
        # generate.sh uses openapi-generator-cli inside Docker; runners
        # ship Docker preinstalled, and generate.sh also runs `go mod tidy`
        # inside its own Go container so clients/go/go.sum is accurate
        # before commit.
        run: ./scripts/generate.sh "${{ steps.version.outputs.version }}"

      - name: Commit PHP submodule (separate repo)
        if: steps.diff.outputs.changed == 'true' || inputs.force
        # Packagist expects composer.json at the root of a git repo, so
        # PHP lives in its own repo mounted here as a submodule. Commit +
        # tag + push inside the submodule FIRST — main repo then records
        # the new submodule SHA in its own commit below. Both repos end
        # up with the same v<version> tag pointing at their respective
        # regenerated trees.
        working-directory: clients/php
        run: |
          git config user.name "wb-api-client-bot"
          git config user.email "bot@users.noreply.github.com"
          git fetch origin main
          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git stash push -u -m "regen"
            git checkout -B main origin/main
            git stash pop
          else
            git checkout -B main origin/main
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "No PHP changes to commit"
          else
            git commit -m "chore(release): regenerate at ${{ steps.version.outputs.version }}"
            git push origin main
          fi
          # Idempotent tag: skip if identical tag already exists.
          if ! git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
            git push origin "${{ steps.version.outputs.tag }}"
          fi

      - name: Create GitHub Release on sibling PHP repo
        if: steps.diff.outputs.changed == 'true' || inputs.force
        # Cross-repo release creation needs PHP_REPO_TOKEN (contents:write
        # on wb-api-client-php). Falls back to GITHUB_TOKEN which will
        # 404 for cross-repo — that's fine, tag is still pushed above.
        env:
          GH_TOKEN: ${{ secrets.PHP_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          # Skip if release already exists (idempotent).
          if gh release view "${TAG}" --repo ValeryVerkhoturov/wb-api-client-php >/dev/null 2>&1; then
            echo "Release ${TAG} already exists on sibling repo, skipping"
            exit 0
          fi
          cat > /tmp/php-release-notes.md <<'EOF'
          Автоматический релиз PHP-клиента Wildberries Seller API.

          Этот репозиторий синхронизирован с [wb-api-client __TAG__](https://github.com/ValeryVerkhoturov/wb-api-client/releases/tag/__TAG__) — код регенерируется в основном репозитории и коммитится сюда одним и тем же тегом.

          ## Установка

          ```bash
          composer require valeryverkhoturov/wb-api-client:__VERSION__
          ```

          - [Packagist](https://packagist.org/packages/valeryverkhoturov/wb-api-client#__VERSION__)
          - [Документация](https://valeryverkhoturov.github.io/wb-api-client-docs/languages/php)
          EOF
          sed -i "s|__VERSION__|${VERSION}|g; s|__TAG__|${TAG}|g" /tmp/php-release-notes.md
          gh release create "${TAG}" \
            --repo ValeryVerkhoturov/wb-api-client-php \
            --title "${TAG}" \
            --notes-file /tmp/php-release-notes.md

      - name: Commit specs + generated clients + submodule pointer, push tag
        if: steps.diff.outputs.changed == 'true' || inputs.force
        run: |
          git config user.name "wb-api-client-bot"
          git config user.email "bot@users.noreply.github.com"
          # Stage explicitly rather than `git add -A` to avoid picking up
          # workflow scratch (dist/, node_modules/, target/ …). Also
          # include clients/php to record the submodule pointer bump
          # from the sibling-repo commit above.
          git add swaggers/ clients/
          if git diff --cached --quiet; then
            echo "No file changes to commit despite checksum diff — nothing to do"
            exit 0
          fi
          git commit -m "chore(release): sync upstream + regenerate at ${{ steps.version.outputs.version }}"
          git push
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release on main repo
        if: steps.diff.outputs.changed == 'true' || inputs.force
        # The tag was just pushed above; promote it to a full GitHub
        # Release with install snippets + package links + the upstream
        # spec diff that triggered this release. Idempotent — skips if
        # a release for this tag already exists (happens on re-runs).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "${TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists, skipping"
            exit 0
          fi
          # Quoted heredoc so backticks in the code fences aren't
          # interpreted as command substitution. Placeholders are
          # replaced by sed below.
          cat > /tmp/release-notes.md <<'EOF'
          Автоматический релиз по итогам ежедневной сверки с апстримом Wildberries.

          ## Установка (эта версия)

          ```bash
          pip install valeryverkhoturov-wb-api-client==__VERSION__
          npm install @valeryverkhoturov/wb-api-client@__VERSION__
          go get github.com/ValeryVerkhoturov/wb-api-client/clients/go@__TAG__
          composer require valeryverkhoturov/wb-api-client:__VERSION__
          ```

          Java (Maven):
          ```xml
          <dependency>
            <groupId>io.github.valeryverkhoturov</groupId>
            <artifactId>wb-api-client</artifactId>
            <version>__VERSION__</version>
          </dependency>
          ```

          ## Пакеты

          - [PyPI](https://pypi.org/project/valeryverkhoturov-wb-api-client/__VERSION__/)
          - [npm](https://www.npmjs.com/package/@valeryverkhoturov/wb-api-client/v/__VERSION__)
          - [Go / pkg.go.dev](https://pkg.go.dev/github.com/ValeryVerkhoturov/wb-api-client/clients/go@__TAG__)
          - [Maven Central](https://central.sonatype.com/artifact/io.github.valeryverkhoturov/wb-api-client/__VERSION__)
          - [Packagist](https://packagist.org/packages/valeryverkhoturov/wb-api-client#__VERSION__)

          ## Документация

          https://valeryverkhoturov.github.io/wb-api-client-docs/
          EOF
          sed -i "s|__VERSION__|${VERSION}|g; s|__TAG__|${TAG}|g" /tmp/release-notes.md
          # Append the upstream spec diff, if any — this is what
          # triggered the release. Empty on forced re-runs where
          # nothing changed upstream.
          if [[ -s /tmp/upstream-diff.txt ]]; then
            {
              echo ""
              echo "## Изменения апстрим-спецификаций"
              echo ""
              echo '```diff'
              cat /tmp/upstream-diff.txt
              echo '```'
            } >> /tmp/release-notes.md
          fi
          gh release create "${TAG}" \
            --repo "${{ github.repository }}" \
            --title "${TAG}" \
            --notes-file /tmp/release-notes.md

  publish:
    needs: regenerate
    if: needs.regenerate.outputs.changed == 'true' || inputs.force
    # Trigger publish.yml via workflow_dispatch (fire-and-forget) rather
    # than `uses: publish.yml` (workflow_call). Reason: PyPI + npm
    # trusted publishing verify BOTH the OIDC token exchange (matches
    # `job_workflow_ref`) AND the Sigstore attestation cert (matches
    # `workflow_ref`). With workflow_call those two claims point at
    # DIFFERENT files — the callee (publish.yml) and the caller
    # (daily-check.yml) — and no trusted-publisher config can satisfy
    # both. Dispatching makes publish.yml top-level, so both claims
    # point at publish.yml and the trusted publisher matches cleanly.
    # Trade-off: daily-check completes without waiting for publish
    # results — watch the individual publish runs in the Actions tab.
    runs-on: ubuntu-latest
    permissions:
      actions: write             # dispatch publish.yml via API
    strategy:
      fail-fast: false
      matrix:
        lang: [python, typescript, go, java, php, onescript]
    steps:
      - name: Dispatch publish.yml for ${{ matrix.lang }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run publish.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f lang="${{ matrix.lang }}" \
            -f version="${{ needs.regenerate.outputs.version }}" \
            -f ref="${{ needs.regenerate.outputs.tag }}"
