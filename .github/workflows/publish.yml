name: Publish clients

on:
  workflow_call:
    inputs:
      lang:
        type: string
        required: true
      version:
        type: string
        required: true
      ref:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      lang:
        type: choice
        options: [python, typescript, go, java, php, onescript, csharp, rust]
        required: true
      version:
        type: string
        required: true
      ref:
        type: string
        required: true

jobs:
  publish-python:
    if: inputs.lang == 'python'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - name: Build wheel + sdist
        working-directory: clients/python
        run: python -m build
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: clients/python/dist
          skip-existing: true

  publish-typescript:
    if: inputs.lang == 'typescript'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm to a version that speaks OIDC
        run: npm install -g npm@latest
      - name: Build & publish @valeryverkhoturov/wb-api-client
        working-directory: clients/typescript
        run: |
          npm install
          npm run build
          npm publish --provenance --access public

  publish-go:
    if: inputs.lang == 'go'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm tag reachable
        run: |
          echo "Go module release: github.com/ValeryVerkhoturov/wb-api-client-go@${{ inputs.ref }}"
          echo "No registry publish needed — proxy.golang.org fetches from the tag."

  publish-php:
    if: inputs.lang == 'php'
    runs-on: ubuntu-latest
    environment: packagist
    steps:
      - name: Ping Packagist to refresh the package
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
          PACKAGE: "valeryverkhoturov/wb-api-client"
        run: |
          curl -fsSL -XPOST \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_API_TOKEN}" \
            -H 'content-type: application/json' \
            -d "{\"repository\":{\"url\":\"https://github.com/ValeryVerkhoturov/wb-api-client-php\"}}"
          echo "  ✓ Packagist notified — new version live at https://packagist.org/packages/${PACKAGE}"

  publish-java:
    if: inputs.lang == 'java'
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - uses: stCarolas/setup-maven@v4.5
        with:
          maven-version: "3.9.16"
      - name: Deploy to Maven Central
        working-directory: clients/java
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn --batch-mode -DskipTests deploy

  publish-onescript:
    if: inputs.lang == 'onescript'
    runs-on: ubuntu-latest
    environment: onescript
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Install OneScript
        env:
          ONESCRIPT_VERSION: "2.2.0"
        run: |
          curl -fsSL -o /tmp/onescript.zip \
            "https://github.com/EvilBeaver/OneScript/releases/download/v${ONESCRIPT_VERSION}/OneScript-${ONESCRIPT_VERSION}-linux-x64.zip"
          # Not `unzip`: the archive stores its (Cyrillic) entry names in UTF-8
          # and Info-ZIP rewrites them as #Uxxxx escapes, which leaves every
          # path in lib.config dangling — opm then fails to load its own core.
          python3 -m zipfile -e /tmp/onescript.zip "${HOME}/onescript"
          chmod +x "${HOME}/onescript/bin/oscript"
          echo "OSCRIPT=${HOME}/onescript/bin/oscript" >> "${GITHUB_ENV}"
          echo "OPM=${HOME}/onescript/lib/opm/src/cmd/opm.os" >> "${GITHUB_ENV}"
          "${HOME}/onescript/bin/oscript" -version

      - name: Build the opm package
        working-directory: clients/onescript
        run: |
          "${OSCRIPT}" "${OPM}" build .
          ls -la ./*.ospx

      - name: Push to hub.oscript.io
        working-directory: clients/onescript
        env:
          GITHUB_OAUTH_TOKEN: ${{ secrets.OSCRIPT_HUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          "${OSCRIPT}" "${OPM}" push --channel stable "wb-api-client-${VERSION}.ospx"
          echo "  ✓ published — https://hub.oscript.io/pools/default/packages/wb-api-client"

  publish-csharp:
    if: inputs.lang == 'csharp'
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Pack
        working-directory: clients/csharp
        run: dotnet pack -c Release -o ./artifacts

      - name: Push to NuGet
        working-directory: clients/csharp
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          # --skip-duplicate keeps a re-run from failing when the version is
          # already live, matching the idempotence of the other publish jobs.
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          echo "  ✓ published — https://www.nuget.org/packages/ValeryVerkhoturov.WbApiClient"

  publish-rust:
    if: inputs.lang == 'rust'
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Pin the toolchain used at generation time
        run: rustup toolchain install 1.98 --profile minimal

      - name: Publish to crates.io
        working-directory: clients/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -e
          for attempt in 1 2 3; do
            if out="$(cargo +1.98 publish 2>&1)"; then
              break
            fi
            echo "${out}" | tail -5
            if grep -qi 'already uploaded' <<<"${out}"; then
              echo "  · already at ${{ inputs.version }} — skipping"
              break
            fi
            [ "${attempt}" -lt 3 ] && sleep 60 || exit 1
          done
          echo "  ✓ published — https://crates.io/crates/wb-api-client"
