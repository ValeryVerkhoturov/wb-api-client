name: Publish clients

# Reusable workflow. Regeneration and commit happen in daily-check.yml; by
# the time this runs the tag already exists and `clients/<lang>` is
# committed at that tag. This workflow is a pure publish step — download
# the tagged source, build the language-specific package artifact, push to
# the appropriate registry.
#
# Each language branch is self-contained so a broken publish for one
# language does not block the others (fail-fast: false in the caller).

on:
  workflow_call:
    inputs:
      lang:
        type: string
        required: true
      version:
        type: string
        required: true
      ref:
        # Tag to check out. daily-check.yml passes `v<version>` so the
        # source we publish exactly matches what's committed at that tag.
        type: string
        required: true
  workflow_dispatch:
    inputs:
      lang:
        type: choice
        options: [python, typescript, go, java, php, onescript]
        required: true
      version:
        type: string
        required: true
      ref:
        type: string
        required: true

jobs:
  publish-python:
    if: inputs.lang == 'python'
    runs-on: ubuntu-latest
    environment: pypi              # protects the PyPI trusted-publisher config
    permissions:
      id-token: write              # OIDC → PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - name: Build wheel + sdist
        working-directory: clients/python
        run: python -m build
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: clients/python/dist
          skip-existing: true

  publish-typescript:
    if: inputs.lang == 'typescript'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write              # OIDC → npm trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm to a version that speaks OIDC
        run: npm install -g npm@latest
      - name: Build & publish @valeryverkhoturov/wb-api-client
        working-directory: clients/typescript
        run: |
          npm install
          npm run build
          npm publish --provenance --access public

  publish-go:
    if: inputs.lang == 'go'
    runs-on: ubuntu-latest
    # No-op job: Go modules resolve versions directly from the repo's
    # tags — the tag was already pushed in daily-check.yml, so
    # `go get github.com/ValeryVerkhoturov/wb-api-client/clients/go@vX.Y.Z`
    # already works. This job exists so the matrix stays symmetric and
    # anyone reading the workflow can see Go is intentionally handled.
    steps:
      - name: Confirm tag reachable
        run: |
          echo "Go module release: github.com/ValeryVerkhoturov/wb-api-client/clients/go@${{ inputs.ref }}"
          echo "No registry publish needed — proxy.golang.org fetches from the tag."

  publish-php:
    if: inputs.lang == 'php'
    runs-on: ubuntu-latest
    environment: packagist
    # PHP lives in a separate repo (wb-api-client-php) because Packagist
    # requires composer.json at the ROOT of the crawled repo. The
    # sibling repo is mounted here as the clients/php submodule; the
    # tag was already pushed to it by daily-check.yml. This job just
    # pings Packagist so the update is instant rather than "eventually
    # when the crawler runs".
    steps:
      - name: Ping Packagist to refresh the package
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
          # Full Packagist package name — must match `name` in
          # wb-api-client-php/composer.json.
          PACKAGE: "valeryverkhoturov/wb-api-client"
        run: |
          curl -fsSL -XPOST \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_API_TOKEN}" \
            -H 'content-type: application/json' \
            -d "{\"repository\":{\"url\":\"https://github.com/ValeryVerkhoturov/wb-api-client-php\"}}"
          echo "  ✓ Packagist notified — new version live at https://packagist.org/packages/${PACKAGE}"

  publish-java:
    if: inputs.lang == 'java'
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Deploy to Maven Central
        working-directory: clients/java
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn --batch-mode -DskipTests deploy

  publish-onescript:
    if: inputs.lang == 'onescript'
    runs-on: ubuntu-latest
    environment: onescript
    # OneScript lives in a separate repo (wb-api-client-1c) mounted here as
    # the clients/onescript submodule, so the package source only appears
    # once the submodule is checked out. daily-check.yml commits and tags
    # the sibling before tagging this repo, so the pointer at `ref` already
    # resolves to the matching tree.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Install OneScript
        env:
          ONESCRIPT_VERSION: "2.2.0"
        run: |
          curl -fsSL -o /tmp/onescript.zip \
            "https://github.com/EvilBeaver/OneScript/releases/download/v${ONESCRIPT_VERSION}/OneScript-${ONESCRIPT_VERSION}-linux-x64.zip"
          # Not `unzip`: the archive stores its (Cyrillic) entry names in UTF-8
          # and Info-ZIP rewrites them as #Uxxxx escapes, which leaves every
          # path in lib.config dangling — opm then fails to load its own core.
          python3 -m zipfile -e /tmp/onescript.zip "${HOME}/onescript"
          chmod +x "${HOME}/onescript/bin/oscript"
          echo "OSCRIPT=${HOME}/onescript/bin/oscript" >> "${GITHUB_ENV}"
          echo "OPM=${HOME}/onescript/lib/opm/src/cmd/opm.os" >> "${GITHUB_ENV}"
          "${HOME}/onescript/bin/oscript" -version

      - name: Build the opm package
        working-directory: clients/onescript
        run: |
          "${OSCRIPT}" "${OPM}" build .
          ls -la ./*.ospx

      - name: Push to hub.oscript.io
        working-directory: clients/onescript
        env:
          # opm authenticates against the hub with a GitHub token, used only to
          # verify the pusher's identity — per `opm push --help` it needs no
          # scopes at all, and it never touches this repository.
          GITHUB_OAUTH_TOKEN: ${{ secrets.OSCRIPT_HUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          "${OSCRIPT}" "${OPM}" push --channel stable "wb-api-client-${VERSION}.ospx"
          echo "  ✓ published — https://hub.oscript.io/package/wb-api-client"
