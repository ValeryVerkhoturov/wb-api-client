cases:
  - name: secret struct injected, token field retyped, user agent rebranded
    function: patch_rust_configuration
    input: |
      #[derive(Debug, Clone)]
      pub struct Configuration {
          pub bearer_access_token: Option<String>,
      }

      impl Configuration {
          pub fn new() -> Configuration {
              Configuration::default()
          }
      }

      impl Default for Configuration {
          fn default() -> Self {
              Configuration {
                  user_agent: Some("OpenAPI-Generator/7.9.0/rust".to_owned()),
                  bearer_access_token: None,
              }
          }
      }
    expected: |
      /// Wrapper around a bearer JWT that redacts under Debug and Display.
      /// Call [`SecretString::expose_secret`] to get the raw value — deliberately
      /// awkward so accidental leaks (logs, `println!("{:?}", config)`) become explicit.
      #[derive(Clone)]
      pub struct SecretString(String);

      impl SecretString {
          pub fn new<S: Into<String>>(value: S) -> Self {
              SecretString(value.into())
          }

          pub fn expose_secret(&self) -> &str {
              &self.0
          }
      }

      impl std::fmt::Debug for SecretString {
          fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
              f.write_str("<REDACTED>")
          }
      }

      impl std::fmt::Display for SecretString {
          fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
              f.write_str("<REDACTED>")
          }
      }

      #[derive(Debug, Clone)]
      pub struct Configuration {
          pub bearer_access_token: Option<SecretString>,
      }

      impl Configuration {
          pub fn new() -> Configuration {
              Configuration::default()
          }

          /// Store the WB bearer JWT wrapped in a [`SecretString`] so it redacts
          /// under Debug/Display; the raw value leaves only via `expose_secret()`.
          pub fn set_access_token(&mut self, token: &str) {
              self.bearer_access_token = Some(SecretString::new(token));
          }
      }

      impl Default for Configuration {
          fn default() -> Self {
              Configuration {
                  user_agent: Some("ValeryVerkhoturov/wb-api-client/rust".to_owned()),
                  bearer_access_token: None,
              }
          }
      }
  - name: bearer auth call exposes the secret
    function: patch_rust_api
    input: |
      let local_var_req = local_var_req_builder.bearer_auth(local_var_token.to_owned());
    expected: |
      let local_var_req = local_var_req_builder.bearer_auth(local_var_token.expose_secret());
