cases:
  - name: access token wrapped in SecretStr
    function: patch_python_configuration
    input: |
      from typing import Optional
      from typing_extensions import Annotated, Field

      class Configuration:
          access_token: Optional[str]=None,

              self.access_token = access_token

              auth_settings['bearer'] = {
                  'value': 'Bearer ' + self.access_token,
              }
    expected: |
      from typing import Optional, Union
      from typing_extensions import Annotated, Field
      from pydantic import SecretStr

      class Configuration:
          access_token: Optional[Union[str, SecretStr]]=None,

              if access_token is not None and not isinstance(access_token, SecretStr):

                  access_token = SecretStr(access_token)

              self.access_token = access_token

              auth_settings['bearer'] = {
                  'value': 'Bearer ' + self.access_token.get_secret_value(),
              }
  - name: already patched input passes through unchanged
    function: patch_python_configuration
    input: |
      from pydantic import SecretStr
      access_token: Optional[Union[str, SecretStr]]=None,
    expected: |
      from pydantic import SecretStr
      access_token: Optional[Union[str, SecretStr]]=None,
