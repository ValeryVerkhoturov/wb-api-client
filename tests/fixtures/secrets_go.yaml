cases:
  - name: configuration gains secrecy SecretString token
    function: patch_go_configuration
    input: |
      package wb

      import (
      	"context"
      	"fmt"
      )

      type Configuration struct {
      	ServerIndex int
      }

      const (
      	// ContextAccessToken takes a string oauth2 access token as authentication for the request.
      	ContextAccessToken = contextKey("accesstoken")
      )
    expected: |
      package wb

      import (
      	"context"
      	"fmt"

      	"github.com/negrel/secrecy"
      )

      type Configuration struct {
      	AccessToken      *secrecy.SecretString `json:"-"`
      	ServerIndex int
      }

      const (
      )

      // SetAccessToken stores the WB bearer JWT on the Configuration,
      // wrapped in a secrecy.SecretString so it redacts under fmt/log.
      func (c *Configuration) SetAccessToken(token string) {
      	s := secrecy.NewSecretString([]byte(token))
      	c.AccessToken = &s
      }
  - name: context token auth block sourced from configuration secret
    function: patch_go_client
    input: |
      		// AccessToken Authentication
      		if auth, ok := ctx.Value(ContextAccessToken).(string); ok {
      			localVarRequest.Header.Add("Authorization", "Bearer "+auth)
      		}
    expected: |
      		// AccessToken Authentication — sourced from
      		// c.cfg.AccessToken (a secrecy.SecretString) only.
      		if c.cfg.AccessToken != nil {
      			localVarRequest.Header.Add("Authorization", "Bearer "+c.cfg.AccessToken.ExposeSecret())
      		}
