cases:
  - name: access token stored as SecretString, user agent rebranded
    function: patch_php_configuration
    input: |
      <?php
           * User agent of the HTTP request, set to "OpenAPI-Generator/{version}/PHP" by default
           */
          protected $userAgent = 'OpenAPI-Generator/7.9.0';

           * @var string
           */
          protected $accessToken = '';

           * @return string Access token for OAuth
           */
          public function getAccessToken()
          {
              return $this->accessToken;
          }

          public function setAccessToken($accessToken)
          {
              $this->accessToken = $accessToken;
          }
    expected: |
      <?php
           * User agent of the HTTP request, set to "ValeryVerkhoturov/wb-api-client/php" by default
           */
          protected $userAgent = 'ValeryVerkhoturov/wb-api-client/php';

           * @var SecretString|null
           */
          protected $accessToken;

           * @return string|null Access token for OAuth
           */
          public function getAccessToken()
          {
              return $this->accessToken?->exposeSecret();
          }

          public function setAccessToken($accessToken)
          {
              $this->accessToken = new SecretString($accessToken);
          }
  - name: already patched input keeps token handling
    function: patch_php_configuration
    input: |
      <?php
          protected $userAgent = 'OpenAPI-Generator/7.9.0';
              $this->accessToken = new SecretString($accessToken);
    expected: |
      <?php
          protected $userAgent = 'ValeryVerkhoturov/wb-api-client/php';
              $this->accessToken = new SecretString($accessToken);
