cases:
  - name: access token property replaced by redacting setter
    function: patch_csharp_configuration
    input: |
      class Configuration {
              public virtual string AccessToken { get; set; }

                      AccessToken = second.AccessToken ?? first.AccessToken,
                  };
                  return config;

                  UserAgent = WebUtility.UrlEncode("OpenAPI-Generator/7.9.0/csharp");
      }
    expected: |
      class Configuration {
              private SecretString _accessToken = new SecretString(string.Empty);

              /// <summary>
              /// Stores the WB bearer JWT in a redacting wrapper.
              /// </summary>
              /// <remarks>
              /// There is deliberately no getter on Configuration: the token leaves
              /// the wrapper only through the explicit IReadableConfiguration member
              /// that the generated Api classes consume internally.
              /// </remarks>
              /// <param name="token">The access token.</param>
              public virtual void SetAccessToken(string token)
              {
                  _accessToken = new SecretString(token ?? string.Empty);
              }

              string IReadableConfiguration.AccessToken => _accessToken.ExposeSecret();

                  };
                  config.SetAccessToken(second.AccessToken ?? first.AccessToken);
                  return config;

                  UserAgent = "ValeryVerkhoturov/wb-api-client/csharp";
      }
  - name: already patched configuration only rebrands user agent
    function: patch_csharp_configuration
    input: |
              public virtual void SetAccessToken(string token)
              UserAgent = WebUtility.UrlEncode("x");
    expected: |
              public virtual void SetAccessToken(string token)
              UserAgent = "ValeryVerkhoturov/wb-api-client/csharp";
  - name: shadowed foreach variable renamed outside string literals
    function: fix_csharp_shadowed_loops
    input: |
      foreach (var items in items)
      {
          var name = items.Name;
          var label = "items stays in strings";
      }
    expected: |
      foreach (var itemsItem in items)
      {
          var name = itemsItem.Name;
          var label = "items stays in strings";
      }
  - name: non-shadowed loop untouched
    function: fix_csharp_shadowed_loops
    input: |
      foreach (var item in items)
      {
          var name = item.Name;
      }
    expected: |
      foreach (var item in items)
      {
          var name = item.Name;
      }
